<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SoulHub | Point of Sale - Shoe Store</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #FEFCF8;
      color: #1E1B18;
      overflow-x: hidden;
      transition: background-color 0.3s, color 0.3s;
    }

    /* Dark Mode */
    body.dark-mode {
      background-color: #1a1a1a;
      color: #E9E2D8;
    }

    body.dark-mode .sidebar,
    body.dark-mode .product-card,
    body.dark-mode .cart-item,
    body.dark-mode .modal-content,
    body.dark-mode .search-results {
      background: #2C2C2C;
      border-color: #3C3C3C;
    }

    body.dark-mode .navbar {
      background: rgba(28, 28, 28, 0.98);
      border-bottom-color: #3C3C3C;
    }

    body.dark-mode .user-info {
      background: #3C3C3C;
    }

    body.dark-mode .nav-link {
      color: #E9E2D8;
    }

    body.dark-mode .nav-link:hover,
    body.dark-mode .nav-link.active {
      background: #C49A6C;
      color: #1E1B18;
    }

    body.dark-mode .cart-summary {
      background: #3C3C3C;
    }

    /* Layout */
    .app-wrapper {
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 280px;
      background: white;
      border-right: 1px solid #F0EAE3;
      position: fixed;
      height: 100vh;
      overflow-y: auto;
      transition: all 0.3s;
      z-index: 99;
    }

    .sidebar-header {
      padding: 24px;
      border-bottom: 1px solid #F0EAE3;
    }

    .sidebar-logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, #2C241E 0%, #A2794C 100%);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sidebar-logo i {
      background: none;
      color: #C49A6C;
      font-size: 1.3rem;
    }

    .nav-menu {
      padding: 24px 0;
    }

    .nav-item {
      margin-bottom: 8px;
    }

    .nav-link {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 24px;
      color: #6B5E54;
      text-decoration: none;
      transition: all 0.2s;
      font-weight: 500;
    }

    .nav-link i {
      width: 24px;
      font-size: 1.2rem;
    }

    .nav-link:hover {
      background: #F9F4ED;
      color: #C49A6C;
    }

    .nav-link.active {
      background: #F9F4ED;
      color: #C49A6C;
      border-right: 3px solid #C49A6C;
    }

    /* Main Content */
    .main-content {
      flex: 1;
      margin-left: 280px;
    }

    /* Navbar */
    .navbar {
      background: rgba(254, 252, 248, 0.98);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(0,0,0,0.05);
      padding: 16px 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 24px;
    }

    .nav-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .user-menu {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #F9F4ED;
      padding: 8px 16px;
      border-radius: 40px;
    }

    .user-avatar {
      width: 36px;
      height: 36px;
      background: #C49A6C;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 600;
    }

    .logout-btn, .dark-mode-toggle {
      background: transparent;
      border: 1px solid #E9E2D8;
      padding: 8px 20px;
      border-radius: 40px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
    }

    .logout-btn:hover {
      background: #C23D2E;
      border-color: #C23D2E;
      color: white;
    }

    .dark-mode-toggle:hover {
      background: #1E1B18;
      color: white;
    }

    /* POS Layout */
    .pos-grid {
      display: grid;
      grid-template-columns: 1fr 400px;
      gap: 24px;
      margin-top: 24px;
    }

    /* Products Section */
    .products-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .search-box {
      flex: 1;
      max-width: 400px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 12px 20px;
      border: 1px solid #E9E2D8;
      border-radius: 40px;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
    }

    .category-filter {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .category-btn {
      padding: 8px 20px;
      background: white;
      border: 1px solid #E9E2D8;
      border-radius: 40px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .category-btn.active {
      background: #C49A6C;
      color: white;
      border-color: #C49A6C;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
      max-height: calc(100vh - 300px);
      overflow-y: auto;
      padding: 4px;
    }

    .product-card {
      background: white;
      border: 1px solid #F0EAE3;
      border-radius: 20px;
      padding: 16px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 16px rgba(0,0,0,0.1);
      border-color: #C49A6C;
    }

    .product-card.disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .product-card.disabled:hover {
      transform: none;
    }

    .product-name {
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 8px;
    }

    .product-sku {
      font-size: 0.75rem;
      color: #6B5E54;
      margin-bottom: 8px;
    }

    .product-price {
      font-weight: 700;
      color: #C49A6C;
      font-size: 1.2rem;
    }

    .product-stock {
      font-size: 0.75rem;
      color: #6B5E54;
      margin-top: 8px;
    }

    .low-stock-badge {
      color: #ef4444;
      font-weight: 600;
    }

    /* Cart Section */
    .cart-section {
      background: white;
      border-radius: 28px;
      border: 1px solid #F0EAE3;
      display: flex;
      flex-direction: column;
      height: calc(100vh - 120px);
      position: sticky;
      top: 100px;
    }

    .cart-header {
      padding: 24px;
      border-bottom: 1px solid #F0EAE3;
    }

    .cart-header h3 {
      font-family: 'Playfair Display', serif;
      font-size: 1.3rem;
    }

    .cart-items {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      border-bottom: 1px solid #F0EAE3;
      margin-bottom: 8px;
    }

    .cart-item-info {
      flex: 1;
    }

    .cart-item-name {
      font-weight: 600;
      font-size: 0.9rem;
    }

    .cart-item-price {
      font-size: 0.8rem;
      color: #C49A6C;
    }

    .cart-item-quantity {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }

    .quantity-btn {
      background: #F9F4ED;
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
    }

    .quantity-btn:hover {
      background: #C49A6C;
      color: white;
    }

    .cart-item-total {
      font-weight: 700;
      min-width: 80px;
      text-align: right;
    }

    .remove-item {
      color: #ef4444;
      cursor: pointer;
      margin-left: 12px;
    }

    .cart-summary {
      padding: 24px;
      border-top: 1px solid #F0EAE3;
      background: #F9F4ED;
      border-radius: 0 0 28px 28px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .summary-row.total {
      font-size: 1.2rem;
      font-weight: 700;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 2px solid #E9E2D8;
    }

    .checkout-btn {
      width: 100%;
      padding: 14px;
      background: #C49A6C;
      color: white;
      border: none;
      border-radius: 40px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 20px;
      transition: all 0.2s;
    }

    .checkout-btn:hover {
      background: #A2794C;
      transform: translateY(-2px);
    }

    .clear-cart-btn {
      width: 100%;
      padding: 10px;
      background: transparent;
      border: 1px solid #E9E2D8;
      border-radius: 40px;
      cursor: pointer;
      margin-top: 8px;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.5);
    }

    .modal-content {
      background-color: white;
      margin: 10% auto;
      padding: 0;
      border-radius: 28px;
      width: 90%;
      max-width: 500px;
      animation: slideIn 0.3s;
    }

    @keyframes slideIn {
      from {
        transform: translateY(-50px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .modal-header {
      padding: 24px 32px;
      border-bottom: 1px solid #F0EAE3;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-body {
      padding: 32px;
    }

    .modal-footer {
      padding: 24px 32px;
      border-top: 1px solid #F0EAE3;
      display: flex;
      gap: 12px;
      justify-content: flex-end;
    }

    .close {
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-primary, .btn-secondary {
      padding: 12px 24px;
      border-radius: 40px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-primary {
      background: #C49A6C;
      color: white;
      border: none;
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid #E9E2D8;
    }

    .toast {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: #10b981;
      color: white;
      padding: 12px 24px;
      border-radius: 40px;
      z-index: 1100;
      animation: slideInRight 0.3s;
    }

    .toast.error {
      background: #ef4444;
    }

    @keyframes slideInRight {
      from {
        transform: translateX(100%);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    .menu-toggle {
      display: none;
    }

    @media (max-width: 768px) {
      .sidebar {
        transform: translateX(-100%);
      }
      .sidebar.open {
        transform: translateX(0);
      }
      .main-content {
        margin-left: 0;
      }
      .pos-grid {
        grid-template-columns: 1fr;
      }
      .cart-section {
        position: static;
        margin-top: 24px;
      }
      .menu-toggle {
        display: block;
        background: none;
        border: none;
        font-size: 1.5rem;
        cursor: pointer;
      }
    }
  </style>
</head>
<body>
  <div id="loadingScreen" style="display: flex; justify-content: center; align-items: center; height: 100vh;">
    <div class="spinner" style="width: 50px; height: 50px; border: 3px solid #E9E2D8; border-top-color: #C49A6C; border-radius: 50%; animation: spin 1s linear infinite;"></div>
  </div>

  <div id="dashboardContent" style="display: none;">
    <div class="app-wrapper">
      <!-- Sidebar -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <div class="sidebar-logo">
            <i class="fas fa-chart-line"></i> SoulHub
          </div>
        </div>
        <nav class="nav-menu">
          <div class="nav-item">
            <a href="dashboard.html" class="nav-link">
              <i class="fas fa-home"></i> Dashboard
            </a>
          </div>
          <div class="nav-item">
            <a href="inventory.html" class="nav-link">
              <i class="fas fa-boxes"></i> Inventory
            </a>
          </div>
          <div class="nav-item">
            <a href="sales.html" class="nav-link active">
              <i class="fas fa-shopping-cart"></i> Sales
            </a>
          </div>
          <div class="nav-item">
            <a href="staff.html" class="nav-link">
              <i class="fas fa-users"></i> Staff Management
            </a>
          </div>
          <div class="nav-item">
            <a href="reports.html" class="nav-link">
              <i class="fas fa-chart-bar"></i> Reports
            </a>
          </div>
          <div class="nav-item">
            <a href="settings.html" class="nav-link">
              <i class="fas fa-cog"></i> Settings
            </a>
          </div>
        </nav>
      </aside>

      <!-- Main Content -->
      <main class="main-content">
        <nav class="navbar">
          <div class="container nav-container">
            <button class="menu-toggle" id="menuToggle">
              <i class="fas fa-bars"></i>
            </button>
            <div style="flex:1"></div>
            <div class="user-menu">
              <button class="dark-mode-toggle" id="darkModeToggle">
                <i class="fas fa-moon"></i> Dark Mode
              </button>
              <div class="user-info">
                <div class="user-avatar" id="userAvatar">JD</div>
                <span id="userName">Loading...</span>
              </div>
              <button class="logout-btn" id="logoutBtn">
                <i class="fas fa-sign-out-alt"></i> Logout
              </button>
            </div>
          </div>
        </nav>

        <div class="container">
          <div class="pos-grid">
            <!-- Products Section -->
            <div>
              <div class="products-header">
                <h2>🛍️ Point of Sale</h2>
                <div class="search-box">
                  <input type="text" id="searchInput" placeholder="🔍 Search products...">
                </div>
              </div>
              
              <div class="category-filter" id="categoryFilter">
                <button class="category-btn active" data-category="all">All</button>
              </div>
              
              <div class="products-grid" id="productsGrid">

              </div>
            </div>

            <!-- Cart Section -->
            <div class="cart-section">
              <div class="cart-header">
                <h3><i class="fas fa-shopping-cart"></i> Current Sale</h3>

              <div class="cart-items" id="cartItems">
                <p style="text-align: center; color: #6B5E54;">Cart is empty</p>

              <div class="cart-summary">
                <div class="summary-row">
                  <span>Subtotal:</span>

                </div>
                <div class="summary-row">
                  <span>Tax (10%):</span>
                  <span id="tax">$0.00</span>

                <div class="summary-row total">
                  <span>Total:</span>
                  <span id="total">$0.00</span>
                </div>
                <button class="checkout-btn" id="checkoutBtn">
                  <i class="fas fa-credit-card"></i> Process Payment

                  <i class="fas fa-trash"></i> Clear Cart
                </button>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Payment Modal -->
  <div id="paymentModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Process Payment</h2>
        <span class="close">&times;</span>
      </div>
      <div class="modal-body">
        <div class="form-group" style="margin-bottom: 20px;">
          <label>Payment Method</label>
          <select id="paymentMethod" style="width: 100%; padding: 12px; border-radius: 16px; border: 1px solid #E9E2D8;">
            <option value="Cash">Cash</option>
            <option value="Card">Card</option>
            <option value="Mobile Money">Mobile Money</option>

          <label>Amount Received (for cash)</label>

      </div>
      <div class="modal-footer">
        <button class="btn-secondary" id="cancelPaymentBtn">Cancel</button>
        <button class="btn-primary" id="confirmPaymentBtn">Complete Sale</button>
      </div>
    </div>
  </div>

  <!-- Receipt Modal -->
  <div id="receiptModal" class="modal">
    <div class="modal-content" style="max-width: 400px;">
      <div class="modal-header">
        <h2>Receipt</h2>
        <span class="close-receipt">&times;</span>
      </div>
      <div class="modal-body" id="receiptContent">
        <!-- Receipt content will be inserted here -->
      </div>
      <div class="modal-footer">
        <button class="btn-primary" id="printReceiptBtn">
          <i class="fas fa-print"></i> Print Receipt
        </button>
        <button class="btn-secondary" id="closeReceiptBtn">Close</button>
      </div>
    </div>
  </div>

  <style>
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
    }
  </style>

  <script>
    (function() {
      const SUPABASE_URL = "https://ulccyfajpaiuvqovvqyz.supabase.co";
      const SUPABASE_ANON_KEY = "sb_publishable_4kKDA0psp8AFpoTJlB-k8A_VS9IaWI9";
      
      let supabase;
      let products = [];
      let cart = [];
      let currentUser = null;
      let selectedCategory = 'all';
      
      try {
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      } catch (err) {
        console.error("Failed to create Supabase client:", err);
      }
      
      function showToast(message, isError = false) {
        const toast = document.createElement('div');
        toast.className = `toast ${isError ? 'error' : ''}`;
        toast.innerHTML = `<i class="fas ${isError ? 'fa-exclamation-circle' : 'fa-check-circle'}"></i> ${message}`;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
      }
      
      function getInitials(name) {
        if (!name) return 'U';
        return name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
      }
      
      function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>]/g, function(m) {
          if (m === '&') return '&amp;';
          if (m === '<') return '&lt;';
          if (m === '>') return '&gt;';
          return m;
        });
      }
      
      // Load products
      async function loadProducts() {
        try {
          const { data, error } = await supabase
            .from('products')
            .select('*')
            .eq('status', 'active')
            .order('name');
          
          if (error) throw error;
          products = data;
          displayProducts();
          loadCategories();
        } catch (err) {
          console.error("Error loading products:", err);
          showToast("Failed to load products", true);
        }
      }
      
      function loadCategories() {
        const categories = ['all', ...new Set(products.map(p => p.category).filter(c => c))];
        const filterDiv = document.getElementById('categoryFilter');
        filterDiv.innerHTML = categories.map(cat => `
          <button class="category-btn ${selectedCategory === cat ? 'active' : ''}" data-category="${cat}">
            ${cat === 'all' ? 'All' : cat}
          </button>
        `).join('');
        
        document.querySelectorAll('.category-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            selectedCategory = btn.dataset.category;
            displayProducts();
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
          });
        });
      }
      
      function displayProducts() {
        const grid = document.getElementById('productsGrid');
        let filtered = products;
        
        if (selectedCategory !== 'all') {
          filtered = products.filter(p => p.category === selectedCategory);
        }
        
        const searchTerm = document.getElementById('searchInput')?.value.toLowerCase() || '';
        if (searchTerm) {
          filtered = filtered.filter(p => 
            p.name.toLowerCase().includes(searchTerm) || 
            p.sku.toLowerCase().includes(searchTerm)
          );
        }
        
        if (filtered.length === 0) {
          grid.innerHTML = '<p style="text-align: center; grid-column: 1/-1;">No products found</p>';
          return;
        }
        
        grid.innerHTML = filtered.map(product => {
          const cartItem = cart.find(item => item.id === product.id);
          const availableStock = product.stock_quantity - (cartItem?.quantity || 0);
          const isOutOfStock = availableStock <= 0;
          
          return `
            <div class="product-card ${isOutOfStock ? 'disabled' : ''}" onclick="${isOutOfStock ? '' : `addToCart(${JSON.stringify(product).replace(/"/g, '&quot;')})`}">
              <div class="product-name">${escapeHtml(product.name)}</div>
              <div class="product-sku">${escapeHtml(product.sku)}</div>
              <div class="product-price">$${(product.price || 0).toFixed(2)}</div>
              <div class="product-stock ${availableStock <= product.low_stock_threshold ? 'low-stock-badge' : ''}">
                Stock: ${availableStock}
              </div>
            </div>
          `;
        }).join('');
      }
      
      // Cart functions
      window.addToCart = function(product) {
        const cartItem = cart.find(item => item.id === product.id);
        const currentStock = product.stock_quantity - (cartItem?.quantity || 0);
        
        if (currentStock <= 0) {
          showToast(`${product.name} is out of stock!`, true);
          return;
        }
        
        if (cartItem) {
          cartItem.quantity++;
        } else {
          cart.push({
            id: product.id,
            name: product.name,
            price: product.price,
            sku: product.sku,
            quantity: 1,
            stock: product.stock_quantity
          });
        }
        
        updateCart();
        displayProducts();
        showToast(`${product.name} added to cart`);
      };
      
      function updateCart() {
        const cartDiv = document.getElementById('cartItems');
        
        if (cart.length === 0) {
          cartDiv.innerHTML = '<p style="text-align: center; color: #6B5E54;">Cart is empty</p>';
          updateTotals();
          return;
        }
        
        cartDiv.innerHTML = cart.map((item, index) => `
          <div class="cart-item">
            <div class="cart-item-info">
              <div class="cart-item-name">${escapeHtml(item.name)}</div>
              <div class="cart-item-price">$${item.price.toFixed(2)} each</div>
              <div class="cart-item-quantity">
                <button class="quantity-btn" onclick="updateQuantity(${index}, -1)">-</button>
                <span>${item.quantity}</span>
                <button class="quantity-btn" onclick="updateQuantity(${index}, 1)">+</button>
              </div>
            </div>
            <div class="cart-item-total">
              $${(item.price * item.quantity).toFixed(2)}
              <i class="fas fa-trash remove-item" onclick="removeFromCart(${index})"></i>
            </div>
          </div>
        `).join('');
        
        updateTotals();
      }
      
      window.updateQuantity = function(index, change) {
        const item = cart[index];
        const newQuantity = item.quantity + change;
        
        if (newQuantity < 1) {
          removeFromCart(index);
          return;
        }
        
        if (newQuantity > item.stock) {
          showToast(`Only ${item.stock} available in stock`, true);
          return;
        }
        
        item.quantity = newQuantity;
        updateCart();
        displayProducts();
      };
      
      window.removeFromCart = function(index) {
        cart.splice(index, 1);
        updateCart();
        displayProducts();
        showToast('Item removed from cart');
      };
      
      function updateTotals() {
        const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
        const tax = subtotal * 0.10;
        const total = subtotal + tax;
        
        document.getElementById('subtotal').textContent = `$${subtotal.toFixed(2)}`;
        document.getElementById('tax').textContent = `$${tax.toFixed(2)}`;
        document.getElementById('total').textContent = `$${total.toFixed(2)}`;
      }
      
      function generateInvoiceNumber() {
        const date = new Date();
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        const random = Math.floor(Math.random() * 10000).toString().padStart(4, '0');
        return `INV-${year}${month}${day}-${random}`;
      }
      
      // Process sale
      async function processSale(paymentMethod, amountReceived = null) {
        if (cart.length === 0) {
          showToast('Cart is empty!', true);
          return false;
        }
        
        const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
        const tax = subtotal * 0.10;
        const total = subtotal + tax;
        
        if (paymentMethod === 'Cash' && amountReceived && amountReceived < total) {
          showToast('Insufficient amount received!', true);
          return false;
        }
        
        try {
          const invoiceNumber = generateInvoiceNumber();
          
          // Create sale record
          const { data: sale, error: saleError } = await supabase
            .from('sales')
            .insert([{
              invoice_number: invoiceNumber,
              user_id: currentUser?.id,
              total_amount: total,
              payment_method: paymentMethod,
              sale_date: new Date().toISOString()
            }])
            .select()
            .single();
          
          if (saleError) throw saleError;
          
          // Update stock quantities
          for (const item of cart) {
            const { error: updateError } = await supabase
              .from('products')
              .update({ 
                stock_quantity: supabase.raw(`stock_quantity - ${item.quantity}`)
              })
              .eq('id', item.id);
            
            if (updateError) throw updateError;
          }
          
          showToast(`Sale completed! Invoice: ${invoiceNumber}`);
          
          // Show receipt
          showReceipt(invoiceNumber, cart, subtotal, tax, total, paymentMethod, amountReceived);
          
          // Clear cart
          cart = [];
          updateCart();
          await loadProducts();
          
          return true;
        } catch (err) {
          console.error("Error processing sale:", err);
          showToast('Failed to process sale', true);
          return false;
        }
      }
      
      function showReceipt(invoiceNumber, items, subtotal, tax, total, paymentMethod, amountReceived) {
        const date = new Date().toLocaleString();
        const change = amountReceived ? amountReceived - total : 0;
        
        const receiptHtml = `
          <div style="text-align: center; margin-bottom: 20px;">
            <h3>SoulHub Shoe Store</h3>
            <p>123 Fashion Avenue, NY</p>
            <p>Tel: +1 234-567-8900</p>
            <hr>
            <p><strong>Invoice: ${invoiceNumber}</strong></p>
            <p>Date: ${date}</p>
            <hr>
          </div>
          <div style="margin-bottom: 20px;">
            ${items.map(item => `
              <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                <span>${escapeHtml(item.name)} x ${item.quantity}</span>
                <span>$${(item.price * item.quantity).toFixed(2)}</span>
              </div>
            `).join('')}
          </div>
          <hr>
          <div style="margin-top: 12px;">
            <div style="display: flex; justify-content: space-between;">
              <span>Subtotal:</span>
              <span>$${subtotal.toFixed(2)}</span>
            </div>
            <div style="display: flex; justify-content: space-between;">
              <span>Tax (10%):</span>
              <span>$${tax.toFixed(2)}</span>
            </div>
            <div style="display: flex; justify-content: space-between; font-weight: 700; margin-top: 8px;">
              <span>TOTAL:</span>
              <span>$${total.toFixed(2)}</span>
            </div>
            <div style="display: flex; justify-content: space-between; margin-top: 8px;">
              <span>Payment:</span>
              <span>${paymentMethod}</span>
            </div>
            ${amountReceived ? `
              <div style="display: flex; justify-content: space-between;">
                <span>Amount Received:</span>
                <span>$${amountReceived.toFixed(2)}</span>
              </div>
              <div style="display: flex; justify-content: space-between;">
                <span>Change:</span>
                <span>$${change.toFixed(2)}</span>
              </div>
            ` : ''}
          </div>
          <hr>
          <div style="text-align: center; margin-top: 20px;">
            <p>Thank you for shopping at SoulHub!</p>
            <p>Have a great day! 👟</p>
          </div>
        `;
        
        document.getElementById('receiptContent').innerHTML = receiptHtml;
        document.getElementById('receiptModal').style.display = 'block';
      }
      
      // Load user profile
      async function loadUserProfile() {
        try {
          const { data: { user } } = await supabase.auth.getUser();
          if (!user) {
            window.location.href = "login.html";
            return;
          }
          
          currentUser = user;
          const fullName = user.user_metadata?.full_name || user.email?.split('@')[0] || 'User';
          document.getElementById('userName').textContent = fullName;
          document.getElementById('userAvatar').textContent = getInitials(fullName);
        } catch (err) {
          console.error("Error loading profile:", err);
        }
      }
      
      // Dark mode
      function initDarkMode() {
        const toggle = document.getElementById('darkModeToggle');
        const isDark = localStorage.getItem('darkMode') === 'true';
        if (isDark) {
          document.body.classList.add('dark-mode');
          toggle.innerHTML = '<i class="fas fa-sun"></i> Light Mode';
        }
        
        toggle.addEventListener('click', () => {
          document.body.classList.toggle('dark-mode');
          const isNowDark = document.body.classList.contains('dark-mode');
          localStorage.setItem('darkMode', isNowDark);
          toggle.innerHTML = isNowDark ? '<i class="fas fa-sun"></i> Light Mode' : '<i class="fas fa-moon"></i> Dark Mode';
        });
      }
      
      // Mobile menu
      function initMobileMenu() {
        const menuToggle = document.getElementById('menuToggle');
        const sidebar = document.getElementById('sidebar');
        if (menuToggle) {
          menuToggle.addEventListener('click', () => sidebar.classList.toggle('open'));
        }
      }
      
      // Event listeners
      document.getElementById('clearCartBtn').addEventListener('click', () => {
        if (cart.length > 0 && confirm('Clear entire cart?')) {
          cart = [];
          updateCart();
          displayProducts();
          showToast('Cart cleared');
        }
      });
      
      document.getElementById('checkoutBtn').addEventListener('click', () => {
        if (cart.length === 0) {
          showToast('Cart is empty!', true);
          return;
        }
        document.getElementById('paymentModal').style.display = 'block';
      });
      
      document.getElementById('confirmPaymentBtn').addEventListener('click', async () => {
        const paymentMethod = document.getElementById('paymentMethod').value;
        const amountReceived = parseFloat(document.getElementById('amountReceived').value);
        
        await processSale(paymentMethod, amountReceived);
        document.getElementById('paymentModal').style.display = 'none';
        document.getElementById('amountReceived').value = '';
        document.getElementById('changeDue').textContent = '';
      });
      
      document.getElementById('cancelPaymentBtn').addEventListener('click', () => {
        document.getElementById('paymentModal').style.display = 'none';
      });
      
      document.getElementById('printReceiptBtn').addEventListener('click', () => {
        window.print();
      });
      
      document.getElementById('closeReceiptBtn').addEventListener('click', () => {
        document.getElementById('receiptModal').style.display = 'none';
      });
      
      document.querySelectorAll('.close, .close-receipt').forEach(btn => {
        btn.addEventListener('click', () => {
          document.getElementById('paymentModal').style.display = 'none';
          document.getElementById('receiptModal').style.display = 'none';
        });
      });
      
      document.getElementById('amountReceived').addEventListener('input', (e) => {
        const total = parseFloat(document.getElementById('total').textContent.replace('$', ''));
        const received = parseFloat(e.target.value);
        if (received >= total) {
          document.getElementById('changeDue').textContent = `Change: $${(received - total).toFixed(2)}`;
        } else {
          document.getElementById('changeDue').textContent = '';
        }
      });
      
      document.getElementById('searchInput').addEventListener('input', () => {
        displayProducts();
      });
      
      document.getElementById('logoutBtn').addEventListener('click', async () => {
        await supabase.auth.signOut();
        window.location.href = "login.html";
      });
      
      // Initialize
      async function init() {
        await loadUserProfile();
        await loadProducts();
        document.getElementById('loadingScreen').style.display = 'none';
        document.getElementById('dashboardContent').style.display = 'block';
        initDarkMode();
        initMobileMenu();
      }
      
      init();
    })();
  </script>
</body>
</html>
