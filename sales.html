<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SoulHub - Sales & POS</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@300;400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #FEFCF8; color: #1E1B18; }
    body.dark-mode { background: #1a1a1a; color: #FEFCF8; }
    body.dark-mode .sidebar, body.dark-mode .top-bar, body.dark-mode .card, body.dark-mode .modal-content { background: #2d2d2d; border-color: #404040; }
    .app-container { display: flex; min-height: 100vh; }
    .sidebar { width: 280px; background: white; border-right: 1px solid #F0EAE3; position: fixed; height: 100vh; overflow-y: auto; transition: all 0.3s ease; z-index: 100; }
    .sidebar-header { padding: 24px; border-bottom: 1px solid #F0EAE3; }
    .logo { font-family: 'Playfair Display', serif; font-size: 1.8rem; font-weight: 700; background: linear-gradient(135deg, #2C241E 0%, #A2794C 100%); background-clip: text; -webkit-background-clip: text; color: transparent; display: flex; align-items: center; gap: 8px; }
    .nav-menu { padding: 24px; }
    .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; margin-bottom: 8px; border-radius: 12px; cursor: pointer; transition: all 0.2s ease; color: #5E5348; text-decoration: none; }
    .nav-item:hover { background: #F9F4ED; color: #C49A6C; }
    .nav-item.active { background: #C49A6C; color: white; }
    .nav-item i { width: 24px; }
    .main-content { flex: 1; margin-left: 280px; }
    .top-bar { background: white; border-bottom: 1px solid #F0EAE3; padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 99; }
    .page-title h1 { font-size: 1.8rem; font-weight: 600; }
    .top-bar-actions { display: flex; align-items: center; gap: 20px; }
    .theme-toggle, .notifications { cursor: pointer; font-size: 1.2rem; padding: 8px; border-radius: 50%; }
    .user-menu { display: flex; align-items: center; gap: 12px; cursor: pointer; padding: 8px 16px; border-radius: 40px; background: #F9F4ED; }
    .user-avatar { width: 32px; height: 32px; background: #C49A6C; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; }
    .content-area { padding: 32px; }
    .pos-grid { display: grid; grid-template-columns: 1fr 380px; gap: 24px; }
    .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; margin-top: 16px; }
    .product-card { background: white; border: 1px solid #F0EAE3; border-radius: 16px; padding: 16px; cursor: pointer; transition: all 0.2s; }
    body.dark-mode .product-card { background: #2d2d2d; }
    .product-card:hover { transform: translateY(-4px); box-shadow: 0 8px 20px rgba(0,0,0,0.1); border-color: #C49A6C; }
    .product-name { font-weight: 600; margin-bottom: 8px; }
    .product-price { color: #C49A6C; font-weight: 700; font-size: 1.2rem; }
    .cart { background: white; border: 1px solid #F0EAE3; border-radius: 20px; padding: 20px; position: sticky; top: 100px; }
    body.dark-mode .cart { background: #2d2d2d; }
    .cart-item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #F0EAE3; }
    .cart-total { margin-top: 20px; padding-top: 20px; border-top: 2px solid #C49A6C; font-size: 1.2rem; font-weight: 700; }
    .btn-primary { background: #1E1B18; color: white; border: none; padding: 12px 24px; border-radius: 40px; cursor: pointer; width: 100%; margin-top: 16px; }
    .btn-primary:hover { background: #C49A6C; }
    .remove-item { color: #C23D2E; cursor: pointer; margin-left: 12px; }
    .search-box { margin-bottom: 20px; }
    .search-box input { width: 100%; padding: 12px; border: 1px solid #E9E2D8; border-radius: 40px; }
    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); }
      .sidebar.mobile-open { transform: translateX(0); }
      .main-content { margin-left: 0; }
      .menu-toggle { display: block; cursor: pointer; font-size: 1.5rem; }
      .pos-grid { grid-template-columns: 1fr; }
    }
    @media (min-width: 769px) { .menu-toggle { display: none; } }
    .loading { text-align: center; padding: 60px; }
    .spinner { animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="app-container">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header"><div class="logo"><i class="fas fa-chart-line"></i> SoulHub</div></div>
    <nav class="nav-menu">
      <a href="dashboard.html" class="nav-item"><i class="fas fa-tachometer-alt"></i><span>Dashboard</span></a>
      <a href="inventory.html" class="nav-item"><i class="fas fa-boxes"></i><span>Inventory</span></a>
      <a href="sales.html" class="nav-item active"><i class="fas fa-shopping-cart"></i><span>Sales & POS</span></a>
      <a href="customers.html" class="nav-item"><i class="fas fa-users"></i><span>Customers</span></a>
      <a href="reports.html" class="nav-item"><i class="fas fa-chart-bar"></i><span>Reports</span></a>
    </nav>
  </aside>

  <main class="main-content">
    <div class="top-bar">
      <div class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></div>
      <div class="page-title"><h1>Point of Sale</h1></div>
      <div class="top-bar-actions">
        <div class="theme-toggle" id="themeToggle"><i class="fas fa-moon"></i></div>
        <div class="user-menu" id="userMenu"><div class="user-avatar"><i class="fas fa-user"></i></div><span id="userName">Loading...</span><i class="fas fa-chevron-down"></i></div>
      </div>
    </div>

    <div class="content-area" id="contentArea">
      <div class="loading"><i class="fas fa-spinner spinner" style="font-size: 2rem;"></i><p>Loading POS...</p></div>
    </div>
  </main>
</div>

<script>
  (function() {
    const SUPABASE_URL = "https://ulccyfajpaiuvqovvqyz.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVsY2N5ZmFqcGFpdXZxb3Z2cXl6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwNjIwMzAsImV4cCI6MjA5NTYzODAzMH0.mLGYFgTZ3ToIJD8KAiqbxr0h42H8PYN5xh1fyvTNvqo";
    
    let supabaseClient = null;
    let currentUser = null;
    let products = [];
    let cart = [];

    async function initSupabase() {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) { window.location.href = "login.html"; return; }
      currentUser = session.user;
      const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', currentUser.id).single();
      document.getElementById('userName').textContent = profile?.full_name || currentUser.email;
      await loadProducts();
      renderPOS();
    }

    async function loadProducts() {
      const { data, error } = await supabaseClient.from('products').select('*').order('name');
      if (error) { console.error(error); return; }
      products = data || [];
      renderProducts();
    }

    function renderProducts() {
      const searchTerm = document.getElementById('searchProducts')?.value.toLowerCase() || '';
      const filtered = products.filter(p => p.name.toLowerCase().includes(searchTerm) || p.sku.toLowerCase().includes(searchTerm));
      const container = document.getElementById('productsContainer');
      if (container) {
        container.innerHTML = filtered.map(p => `
          <div class="product-card" onclick="window.addToCart('${p.id}')">
            <div class="product-name">${p.name}</div>
            <div class="product-sku" style="font-size:0.75rem; color:#8F8278;">${p.sku}</div>
            <div class="product-price">$${p.selling_price || 0}</div>
            <div style="font-size:0.7rem; margin-top:8px;">Stock: ${p.stock_quantity || 0}</div>
          </div>
        `).join('');
      }
    }

    function renderCart() {
      const container = document.getElementById('cartItems');
      if (!container) return;
      if (cart.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:#8F8278;">Cart is empty</p>';
        document.getElementById('cartTotal').innerHTML = '$0.00';
        return;
      }
      container.innerHTML = cart.map((item, idx) => `
        <div class="cart-item">
          <div><strong>${item.name}</strong><br>$${item.price} x ${item.quantity}</div>
          <div>$${(item.price * item.quantity).toFixed(2)} <span class="remove-item" onclick="window.removeFromCart(${idx})"><i class="fas fa-trash"></i></span></div>
        </div>
      `).join('');
      const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
      document.getElementById('cartTotal').innerHTML = `$${total.toFixed(2)}`;
    }

    function addToCart(productId) {
      const product = products.find(p => p.id === productId);
      if (!product) return;
      if (product.stock_quantity <= 0) {
        alert('Out of stock!');
        return;
      }
      const existing = cart.find(item => item.id === productId);
      if (existing) {
        if (product.stock_quantity <= existing.quantity) {
          alert('Not enough stock!');
          return;
        }
        existing.quantity++;
      } else {
        cart.push({ id: productId, name: product.name, price: product.selling_price, quantity: 1 });
      }
      renderCart();
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      renderCart();
    }

    async function checkout() {
      if (cart.length === 0) { alert('Cart is empty'); return; }
      
      const paymentMethod = prompt('Payment Method (cash/card/mobile):', 'cash');
      if (!paymentMethod) return;
      
      const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
      
      const { error: saleError } = await supabaseClient.from('sales').insert([{
        user_id: currentUser.id,
        total_amount: total,
        payment_method: paymentMethod
      }]);
      
      if (saleError) { alert('Error: ' + saleError.message); return; }
      
      // Update stock
      for (const item of cart) {
        const product = products.find(p => p.id === item.id);
        if (product) {
          await supabaseClient.from('products').update({ stock_quantity: product.stock_quantity - item.quantity }).eq('id', item.id);
        }
      }
      
      alert(`Sale completed! Total: $${total.toFixed(2)}`);
      cart = [];
      renderCart();
      await loadProducts();
      renderProducts();
    }

    function renderPOS() {
      document.getElementById('contentArea').innerHTML = `
        <div class="pos-grid">
          <div>
            <div class="search-box"><input type="text" id="searchProducts" placeholder="Search products..." onkeyup="window.renderProducts()"></div>
            <div class="products-grid" id="productsContainer"></div>
          </div>
          <div class="cart">
            <h3>Shopping Cart</h3>
            <div id="cartItems"></div>
            <div class="cart-total">Total: <span id="cartTotal">$0.00</span></div>
            <button class="btn-primary" onclick="window.checkout()"><i class="fas fa-credit-card"></i> Checkout</button>
          </div>
        </div>
      `;
      renderProducts();
      renderCart();
    }

    document.getElementById('themeToggle')?.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
      const icon = document.querySelector('#themeToggle i');
      icon.classList.toggle('fa-moon');
      icon.classList.toggle('fa-sun');
    });

    document.getElementById('menuToggle')?.addEventListener('click', () => {
      document.getElementById('sidebar').classList.toggle('mobile-open');
    });

    document.getElementById('userMenu')?.addEventListener('click', async () => {
      if (confirm('Logout?')) { await supabaseClient.auth.signOut(); window.location.href = 'login.html'; }
    });

    window.addToCart = addToCart;
    window.removeFromCart = removeFromCart;
    window.checkout = checkout;
    window.renderProducts = renderProducts;

    initSupabase();
  })();
</script>
</body>
</html>
