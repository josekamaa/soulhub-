<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SoulHub - Inventory Management</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@300;400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #FEFCF8;
      color: #1E1B18;
    }
    body.dark-mode {
      background: #1a1a1a;
      color: #FEFCF8;
    }
    body.dark-mode .sidebar,
    body.dark-mode .top-bar,
    body.dark-mode .card,
    body.dark-mode .modal-content {
      background: #2d2d2d;
      border-color: #404040;
    }
    .app-container { display: flex; min-height: 100vh; }
    .sidebar {
      width: 280px;
      background: white;
      border-right: 1px solid #F0EAE3;
      position: fixed;
      height: 100vh;
      overflow-y: auto;
      transition: all 0.3s ease;
      z-index: 100;
    }
    .sidebar-header { padding: 24px; border-bottom: 1px solid #F0EAE3; }
    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(135deg, #2C241E 0%, #A2794C 100%);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .nav-menu { padding: 24px; }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      margin-bottom: 8px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      color: #5E5348;
      text-decoration: none;
    }
    .nav-item:hover { background: #F9F4ED; color: #C49A6C; }
    .nav-item.active { background: #C49A6C; color: white; }
    .nav-item i { width: 24px; }
    .main-content { flex: 1; margin-left: 280px; }
    .top-bar {
      background: white;
      border-bottom: 1px solid #F0EAE3;
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 99;
    }
    .page-title h1 { font-size: 1.8rem; font-weight: 600; }
    .top-bar-actions { display: flex; align-items: center; gap: 20px; }
    .theme-toggle, .notifications { cursor: pointer; font-size: 1.2rem; padding: 8px; border-radius: 50%; }
    .user-menu {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      padding: 8px 16px;
      border-radius: 40px;
      background: #F9F4ED;
    }
    .user-avatar {
      width: 32px;
      height: 32px;
      background: #C49A6C;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }
    .content-area { padding: 32px; }
    .action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 16px;
    }
    .btn-primary {
      background: #1E1B18;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 40px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-primary:hover { background: #C49A6C; transform: translateY(-2px); }
    .search-box {
      display: flex;
      gap: 12px;
    }
    .search-box input {
      padding: 10px 16px;
      border: 1px solid #E9E2D8;
      border-radius: 40px;
      width: 250px;
    }
    table {
      width: 100%;
      background: white;
      border-radius: 20px;
      overflow: hidden;
      border-collapse: collapse;
    }
    body.dark-mode table { background: #2d2d2d; }
    th, td {
      padding: 16px;
      text-align: left;
      border-bottom: 1px solid #F0EAE3;
    }
    body.dark-mode th, body.dark-mode td { border-bottom-color: #404040; }
    .badge {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge-low { background: #FEF2F0; color: #C23D2E; }
    .badge-medium { background: #FFF4E5; color: #B76E00; }
    .badge-good { background: #E6F4EA; color: #2E7D32; }
    .action-icons i {
      margin: 0 8px;
      cursor: pointer;
      color: #8F8278;
    }
    .action-icons i:hover { color: #C49A6C; }
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: white;
      border-radius: 24px;
      padding: 32px;
      max-width: 500px;
      width: 90%;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .close-modal { cursor: pointer; font-size: 1.5rem; }
    .form-group { margin-bottom: 20px; }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 10px;
      border: 1px solid #E9E2D8;
      border-radius: 12px;
      font-family: 'Inter', sans-serif;
    }
    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); }
      .sidebar.mobile-open { transform: translateX(0); }
      .main-content { margin-left: 0; }
      .menu-toggle { display: block; cursor: pointer; font-size: 1.5rem; }
      .action-bar { flex-direction: column; align-items: stretch; }
      .search-box input { width: 100%; }
      table { font-size: 0.85rem; }
      th, td { padding: 10px; }
    }
    @media (min-width: 769px) { .menu-toggle { display: none; } }
    .loading { text-align: center; padding: 60px; }
    .spinner { animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="app-container">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header"><div class="logo"><i class="fas fa-chart-line"></i> SoulHub</div></div>
    <nav class="nav-menu">
      <a href="dashboard.html" class="nav-item"><i class="fas fa-tachometer-alt"></i><span>Dashboard</span></a>
      <a href="inventory.html" class="nav-item active"><i class="fas fa-boxes"></i><span>Inventory</span></a>
      <a href="sales.html" class="nav-item"><i class="fas fa-shopping-cart"></i><span>Sales & POS</span></a>
      <a href="customers.html" class="nav-item"><i class="fas fa-users"></i><span>Customers</span></a>
      <a href="reports.html" class="nav-item"><i class="fas fa-chart-bar"></i><span>Reports</span></a>
    </nav>
  </aside>

  <main class="main-content">
    <div class="top-bar">
      <div class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></div>
      <div class="page-title"><h1>Inventory Management</h1></div>
      <div class="top-bar-actions">
        <div class="theme-toggle" id="themeToggle"><i class="fas fa-moon"></i></div>
        <div class="user-menu" id="userMenu"><div class="user-avatar"><i class="fas fa-user"></i></div><span id="userName">Loading...</span><i class="fas fa-chevron-down"></i></div>
      </div>
    </div>

    <div class="content-area" id="contentArea">
      <div class="loading"><i class="fas fa-spinner spinner" style="font-size: 2rem;"></i><p>Loading inventory...</p></div>
    </div>
  </main>
</div>

<div id="productModal" class="modal">
  <div class="modal-content">
    <div class="modal-header"><h2 id="modalTitle">Add Product</h2><span class="close-modal">&times;</span></div>
    <form id="productForm">
      <input type="hidden" id="productId">
      <div class="form-group"><label>SKU *</label><input type="text" id="sku" required></div>
      <div class="form-group"><label>Product Name *</label><input type="text" id="name" required></div>
      <div class="form-group"><label>Category</label><select id="category"><option value="sneakers">Sneakers</option><option value="boots">Boots</option><option value="casual">Casual</option><option value="formal">Formal</option><option value="sandals">Sandals</option></select></div>
      <div class="form-group"><label>Selling Price ($)</label><input type="number" id="sellingPrice" step="0.01"></div>
      <div class="form-group"><label>Stock Quantity</label><input type="number" id="stockQuantity" value="0"></div>
      <div class="form-group"><label>Low Stock Threshold</label><input type="number" id="lowStockThreshold" value="5"></div>
      <button type="submit" class="btn-primary" style="width:100%">Save Product</button>
    </form>
  </div>
</div>

<script>
  (function() {
    const SUPABASE_URL = "https://ulccyfajpaiuvqovvqyz.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVsY2N5ZmFqcGFpdXZxb3Z2cXl6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwNjIwMzAsImV4cCI6MjA5NTYzODAzMH0.mLGYFgTZ3ToIJD8KAiqbxr0h42H8PYN5xh1fyvTNvqo";
    
    let supabaseClient = null;
    let currentUser = null;
    let products = [];

    async function initSupabase() {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) { window.location.href = "login.html"; return; }
      currentUser = session.user;
      const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', currentUser.id).single();
      document.getElementById('userName').textContent = profile?.full_name || currentUser.email;
      loadProducts();
    }

    async function loadProducts() {
      const { data, error } = await supabaseClient.from('products').select('*').order('created_at', { ascending: false });
      if (error) { console.error(error); return; }
      products = data || [];
      renderProducts();
    }

    function renderProducts() {
      const searchTerm = document.getElementById('searchInput')?.value.toLowerCase() || '';
      const filtered = products.filter(p => p.name.toLowerCase().includes(searchTerm) || p.sku.toLowerCase().includes(searchTerm));
      
      const html = `
        <div class="action-bar">
          <button class="btn-primary" onclick="window.openAddModal()"><i class="fas fa-plus"></i> Add Product</button>
          <div class="search-box"><input type="text" id="searchInput" placeholder="Search by name or SKU..." onkeyup="window.loadProducts()"></div>
        </div>
        <table>
          <thead><tr><th>SKU</th><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody>
            ${filtered.map(p => `
              <tr>
                <td>${p.sku}</td>
                <td>${p.name}</td>
                <td>${p.category || '-'}</td>
                <td>$${p.selling_price || 0}</td>
                <td>${p.stock_quantity || 0}</td>
                <td>${getStockBadge(p.stock_quantity, p.low_stock_threshold)}</td>
                <td class="action-icons">
                  <i class="fas fa-edit" onclick="window.editProduct('${p.id}')"></i>
                  <i class="fas fa-trash" onclick="window.deleteProduct('${p.id}')"></i>
                </td>
              </tr>
            `).join('')}
            ${filtered.length === 0 ? '<tr><td colspan="7" style="text-align:center">No products found</td></tr>' : ''}
          </tbody>
        </table>
      `;
      document.getElementById('contentArea').innerHTML = html;
    }

    function getStockBadge(stock, threshold) {
      if (stock <= (threshold || 5)) return '<span class="badge badge-low">Low Stock</span>';
      if (stock <= (threshold || 5) * 2) return '<span class="badge badge-medium">Medium Stock</span>';
      return '<span class="badge badge-good">Good Stock</span>';
    }

    function openAddModal() {
      document.getElementById('modalTitle').textContent = 'Add Product';
      document.getElementById('productForm').reset();
      document.getElementById('productId').value = '';
      document.getElementById('productModal').classList.add('active');
    }

    async function editProduct(id) {
      const product = products.find(p => p.id === id);
      if (!product) return;
      document.getElementById('modalTitle').textContent = 'Edit Product';
      document.getElementById('productId').value = product.id;
      document.getElementById('sku').value = product.sku;
      document.getElementById('name').value = product.name;
      document.getElementById('category').value = product.category || 'casual';
      document.getElementById('sellingPrice').value = product.selling_price || '';
      document.getElementById('stockQuantity').value = product.stock_quantity || 0;
      document.getElementById('lowStockThreshold').value = product.low_stock_threshold || 5;
      document.getElementById('productModal').classList.add('active');
    }

    async function deleteProduct(id) {
      if (!confirm('Are you sure you want to delete this product?')) return;
      const { error } = await supabaseClient.from('products').delete().eq('id', id);
      if (error) { alert('Error: ' + error.message); } else { loadProducts(); }
    }

    async function saveProduct() {
      const id = document.getElementById('productId').value;
      const data = {
        sku: document.getElementById('sku').value,
        name: document.getElementById('name').value,
        category: document.getElementById('category').value,
        selling_price: parseFloat(document.getElementById('sellingPrice').value) || 0,
        stock_quantity: parseInt(document.getElementById('stockQuantity').value) || 0,
        low_stock_threshold: parseInt(document.getElementById('lowStockThreshold').value) || 5
      };
      
      let error;
      if (id) {
        const result = await supabaseClient.from('products').update(data).eq('id', id);
        error = result.error;
      } else {
        const result = await supabaseClient.from('products').insert([data]);
        error = result.error;
      }
      
      if (error) { alert('Error: ' + error.message); } else {
        document.getElementById('productModal').classList.remove('active');
        loadProducts();
      }
    }

    document.getElementById('themeToggle')?.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
      const icon = document.querySelector('#themeToggle i');
      icon.classList.toggle('fa-moon');
      icon.classList.toggle('fa-sun');
    });

    document.getElementById('menuToggle')?.addEventListener('click', () => {
      document.getElementById('sidebar').classList.toggle('mobile-open');
    });

    document.querySelectorAll('.close-modal').forEach(btn => {
      btn.addEventListener('click', () => document.querySelectorAll('.modal').forEach(m => m.classList.remove('active')));
    });

    document.getElementById('productForm')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      await saveProduct();
    });

    document.getElementById('userMenu')?.addEventListener('click', async () => {
      if (confirm('Logout?')) { await supabaseClient.auth.signOut(); window.location.href = 'login.html'; }
    });

    window.openAddModal = openAddModal;
    window.editProduct = editProduct;
    window.deleteProduct = deleteProduct;
    window.loadProducts = loadProducts;

    initSupabase();
  })();
</script>
</body>
</html>
