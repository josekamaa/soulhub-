<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SoulHub · Staff Management</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* =============================================
                  CSS VARIABLES
    ============================================= */
    :root {
      --primary: #C49A6C;
      --primary-dark: #A2794C;
      --primary-light: #F0D5B0;
      --primary-glow: rgba(196,154,108,0.25);
      --bg: #F5F0EB;
      --bg-card: #FFFFFF;
      --text: #1E1B18;
      --text-muted: #6B5E54;
      --border: #E9E2D8;
      --shadow: 0 4px 16px rgba(0,0,0,0.06);
      --shadow-hover: 0 8px 32px rgba(0,0,0,0.12);
      --radius: 20px;
      --radius-sm: 12px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      --font: 'Inter', sans-serif;
      --font-display: 'Playfair Display', serif;
    }

    .dark-mode {
      --bg: #0d0d0d;
      --bg-card: #1a1a1a;
      --text: #F0EAE3;
      --text-muted: #A8998E;
      --border: #2a2a2a;
      --shadow: 0 4px 16px rgba(0,0,0,0.4);
      --shadow-hover: 0 8px 32px rgba(0,0,0,0.6);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      transition: var(--transition);
      overflow-x: hidden;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--border); }
    ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 8px; }

    /* =============================================
                  SIDEBAR
    ============================================= */
    .app-container { display: flex; min-height: 100vh; }

    .sidebar {
      width: 280px;
      background: var(--bg-card);
      border-right: 1px solid var(--border);
      position: fixed;
      height: 100vh;
      overflow-y: auto;
      transition: transform 0.3s ease-in-out;
      z-index: 1000;
      padding-bottom: 40px;
    }

    .sidebar-header {
      padding: 24px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-family: var(--font-display);
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(135deg, #2C241E 0%, var(--primary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo i { -webkit-text-fill-color: var(--primary); }

    .nav-menu { padding: 20px 16px; }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      margin-bottom: 4px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: var(--transition);
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 500;
    }
    .nav-item:hover { background: var(--primary-light); color: var(--primary); }
    .nav-item.active { background: var(--primary); color: white; }
    .nav-item i { width: 24px; font-size: 1.2rem; }
    .nav-item.hidden { display: none; }

    .sidebar-footer {
      padding: 20px 24px;
      border-top: 1px solid var(--border);
      font-size: 0.7rem;
      color: var(--text-muted);
      position: absolute;
      bottom: 0;
      width: 100%;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    /* =============================================
                  TOP BAR
    ============================================= */
    .main-content {
      flex: 1;
      margin-left: 280px;
      min-height: 100vh;
    }

    .top-bar {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 12px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 99;
      backdrop-filter: blur(16px);
      background: rgba(255,255,255,0.85);
    }
    .dark-mode .top-bar { background: rgba(26,26,26,0.85); }

    .menu-toggle {
      display: none;
      cursor: pointer;
      font-size: 1.5rem;
      color: var(--text-muted);
      background: none;
      border: none;
    }
    .menu-toggle:hover { color: var(--primary); }

    .top-bar-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .top-bar-left .page-title h1 {
      font-family: var(--font-display);
      font-size: 1.4rem;
      font-weight: 600;
    }
    .top-bar-left .page-title h1 i { color: var(--primary); margin-right: 8px; }

    .top-bar-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .role-badge {
      padding: 4px 14px;
      border-radius: 40px;
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: var(--primary-light);
      color: var(--primary-dark);
    }
    .dark-mode .role-badge { background: #2a2a2a; color: #C49A6C; }

    .theme-toggle {
      cursor: pointer;
      font-size: 1.1rem;
      padding: 8px 10px;
      border-radius: 50%;
      transition: var(--transition);
      background: none;
      border: none;
      color: var(--text-muted);
    }
    .theme-toggle:hover { background: var(--border); }

    .user-menu {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      padding: 4px 14px 4px 4px;
      border-radius: 40px;
      background: var(--border);
      transition: var(--transition);
    }
    .user-menu:hover { background: var(--primary-light); }
    .user-avatar {
      width: 34px;
      height: 34px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 0.8rem;
    }
    .user-name { font-weight: 500; font-size: 0.85rem; }

    /* =============================================
                  CONTENT AREA
    ============================================= */
    .content-area {
      padding: 24px 32px 40px;
      max-width: 1440px;
      margin: 0 auto;
    }

    /* =============================================
                  STATS CARDS
    ============================================= */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .stats-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 18px 20px;
      box-shadow: var(--shadow);
      transition: var(--transition);
    }
    .stats-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-hover);
    }
    .stats-card .stats-icon {
      font-size: 1.5rem;
      color: var(--primary);
      margin-bottom: 6px;
      display: block;
    }
    .stats-card .stats-value {
      font-size: 1.8rem;
      font-weight: 700;
    }
    .stats-card .stats-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* =============================================
                  ACTION BAR
    ============================================= */
    .action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 24px;
    }

    .action-left {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .action-right {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    .btn {
      padding: 10px 22px;
      border: none;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font);
    }
    .btn-primary {
      background: var(--primary);
      color: white;
    }
    .btn-primary:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(196,154,108,0.3);
    }
    .btn-secondary {
      background: var(--border);
      color: var(--text);
    }
    .btn-secondary:hover {
      background: var(--primary-light);
      color: var(--primary);
    }
    .btn-danger {
      background: #ef4444;
      color: white;
    }
    .btn-danger:hover {
      background: #dc2626;
      transform: translateY(-2px);
    }

    .search-input {
      padding: 10px 18px;
      border: 1px solid var(--border);
      border-radius: 40px;
      font-family: var(--font);
      font-size: 0.85rem;
      background: var(--bg-card);
      color: var(--text);
      width: 240px;
      transition: var(--transition);
    }
    .search-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }
    .dark-mode .search-input { background: #2a2a2a; border-color: #3a3a3a; }

    select.btn-secondary {
      padding: 10px 18px;
      appearance: none;
      cursor: pointer;
    }

    /* =============================================
                  TABLE
    ============================================= */
    .table-container {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    thead {
      background: var(--border);
      border-bottom: 2px solid var(--border);
    }
    th {
      padding: 14px 16px;
      text-align: left;
      font-weight: 600;
      color: var(--text-muted);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      user-select: none;
      transition: var(--transition);
    }
    th:hover { color: var(--primary); }
    th i { margin-left: 4px; opacity: 0.5; }
    td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    tr:hover td { background: rgba(196,154,108,0.04); }
    tr:last-child td { border-bottom: none; }

    .status-badge {
      padding: 4px 12px;
      border-radius: 40px;
      font-size: 0.7rem;
      font-weight: 600;
      display: inline-block;
    }
    .status-badge.active { background: #10b98120; color: #10b981; }
    .status-badge.inactive { background: #ef444420; color: #ef4444; }

    .role-badge {
      padding: 4px 12px;
      border-radius: 40px;
      font-size: 0.7rem;
      font-weight: 600;
      background: var(--primary-light);
      color: var(--primary-dark);
    }
    .dark-mode .role-badge { background: #2a2a2a; color: #C49A6C; }

    .action-icons {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .action-icons button {
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      border-radius: 8px;
      transition: var(--transition);
      font-size: 1rem;
      color: var(--text-muted);
    }
    .action-icons button:hover { background: var(--border); }
    .action-icons .edit-btn:hover { color: var(--primary); }
    .action-icons .delete-btn:hover { color: #ef4444; background: #ef444420; }
    .action-icons .self-label {
      font-size: 0.65rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* =============================================
                  MODAL
    ============================================= */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 2000;
      justify-content: center;
      align-items: center;
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .modal.active { display: flex; }

    .modal-content {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 32px;
      max-width: 520px;
      width: 92%;
      max-height: 90vh;
      overflow-y: auto;
      animation: slideUp 0.3s ease;
    }
    @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .modal-header h2 {
      font-family: var(--font-display);
      font-size: 1.4rem;
      font-weight: 600;
    }
    .modal-header .close {
      cursor: pointer;
      font-size: 1.8rem;
      color: var(--text-muted);
      transition: var(--transition);
      background: none;
      border: none;
      padding: 0 8px;
    }
    .modal-header .close:hover { color: #ef4444; transform: rotate(90deg); }

    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .form-group label .required { color: #ef4444; margin-left: 2px; }
    .form-group input,
    .form-group select {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: var(--font);
      font-size: 0.9rem;
      transition: var(--transition);
      background: var(--bg);
      color: var(--text);
    }
    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }
    .form-group small {
      display: block;
      margin-top: 4px;
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .modal-footer {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    /* =============================================
                  TOAST
    ============================================= */
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .toast {
      padding: 14px 24px;
      border-radius: var(--radius-sm);
      color: white;
      font-weight: 500;
      font-size: 0.9rem;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
      animation: slideUp 0.3s ease;
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 280px;
    }
    .toast.success { background: #10b981; }
    .toast.error { background: #ef4444; }
    .toast.info { background: #3b82f6; }
    .toast.warning { background: #f59e0b; }

    /* =============================================
                  EMPTY STATE
    ============================================= */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
    }
    .empty-state i {
      font-size: 3rem;
      color: var(--primary);
      opacity: 0.3;
      margin-bottom: 16px;
      display: block;
    }
    .empty-state h3 { font-size: 1.1rem; margin-bottom: 4px; }
    .empty-state p { color: var(--text-muted); font-size: 0.9rem; }

    /* =============================================
                  LOADING
    ============================================= */
    .loading-state {
      text-align: center;
      padding: 80px 20px;
    }
    .loading-state .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* =============================================
                  RESPONSIVE
    ============================================= */
    @media (max-width: 1024px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 768px) {
      .sidebar {
        transform: translateX(-100%);
        width: 280px;
        position: fixed;
      }
      .sidebar.mobile-open { transform: translateX(0); }
      .main-content { margin-left: 0; }
      .menu-toggle { display: block; }
      .top-bar { padding: 10px 16px; }
      .content-area { padding: 16px; }
      .action-bar { flex-direction: column; align-items: stretch; }
      .action-left, .action-right { width: 100%; }
      .action-right { flex-direction: column; }
      .search-input { width: 100%; }
      .stats-grid { grid-template-columns: 1fr 1fr; }
      .form-row { grid-template-columns: 1fr; }
      .modal-content { padding: 24px; margin: 16px; }
      table { font-size: 0.8rem; }
      th, td { padding: 10px 12px; }
      .top-bar-left .page-title h1 { font-size: 1.1rem; }
      .user-name { display: none; }
    }

    @media (max-width: 480px) {
      .stats-grid { grid-template-columns: 1fr; }
      .top-bar-actions { gap: 6px; }
      .role-badge { display: none; }
    }
  </style>
</head>
<body>

<div class="app-container">
  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo"><i class="fas fa-chart-line"></i> SoulHub</div>
    </div>
    <nav class="nav-menu">
      <a href="dashboard.html" class="nav-item"><i class="fas fa-th-large"></i><span>Dashboard</span></a>
      <a href="inventory.html" class="nav-item"><i class="fas fa-boxes"></i><span>Inventory</span></a>
      <a href="sales.html" class="nav-item"><i class="fas fa-cash-register"></i><span>Sales</span></a>
      <a href="customers.html" class="nav-item"><i class="fas fa-users"></i><span>Customers</span></a>
      <a href="staff.html" class="nav-item active"><i class="fas fa-user-cog"></i><span>Staff</span></a>
      <a href="reports.html" class="nav-item"><i class="fas fa-chart-bar"></i><span>Reports</span></a>
    </nav>
    <div class="sidebar-footer">
      <i class="fas fa-shield-alt"></i> v2.0
      <span style="flex:1;"></span>
      <span id="liveTime" style="font-size:0.75rem;font-weight:500;"></span>
    </div>
  </aside>

  <!-- ============ MAIN ============ -->
  <main class="main-content">
    <div class="top-bar">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
        <div class="top-bar-left">
          <div class="page-title">
            <h1><i class="fas fa-users-cog"></i> Staff Management</h1>
          </div>
        </div>
      </div>
      <div class="top-bar-actions">
        <span class="role-badge" id="roleBadge">Staff</span>
        <button class="theme-toggle" id="themeToggle"><i class="fas fa-moon"></i></button>
        <div class="user-menu" id="userMenu">
          <div class="user-avatar" id="userAvatar">U</div>
          <span class="user-name" id="userName">User</span>
          <i class="fas fa-chevron-down" style="font-size:0.6rem;opacity:0.6;"></i>
        </div>
      </div>
    </div>

    <div class="content-area" id="contentArea">
      <div class="loading-state">
        <div class="spinner"></div>
        <p>Loading staff members...</p>
      </div>
    </div>
  </main>
</div>

<!-- ============ STAFF MODAL ============ -->
<div id="staffModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="modalTitle">Add Staff Member</h2>
      <button class="close">&times;</button>
    </div>
    <form id="staffForm">
      <input type="hidden" id="staffId">
      
      <div class="form-group">
        <label>Full Name <span class="required">*</span></label>
        <input type="text" id="fullName" required placeholder="e.g., John Doe">
      </div>

      <div class="form-group">
        <label>Email <span class="required">*</span></label>
        <input type="email" id="email" required placeholder="john@example.com">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Role <span class="required">*</span></label>
          <select id="role" required>
            <option value="staff">👤 Staff</option>
            <option value="manager">📊 Manager</option>
            <option value="admin">⚙️ Admin</option>
          </select>
        </div>
        <div class="form-group">
          <label>Position</label>
          <input type="text" id="position" placeholder="Sales Associate">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Employee Code</label>
          <input type="text" id="employeeCode" placeholder="e.g., EMP001">
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input type="tel" id="phone" placeholder="+1 555 123 4567">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Hire Date</label>
          <input type="date" id="hireDate">
        </div>
        <div class="form-group">
          <label>Status</label>
          <select id="status">
            <option value="active">✅ Active</option>
            <option value="inactive">❌ Inactive</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>Store Name</label>
        <input type="text" id="storeName" placeholder="Main Store">
      </div>

      <div class="form-group" id="passwordGroup">
        <label>Password <span class="required" id="passwordRequired">*</span></label>
        <input type="password" id="password" placeholder="Min 6 characters">
        <small id="passwordHint">Required for new staff members. Leave blank when editing.</small>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn btn-primary" id="saveStaffBtn">
          <i class="fas fa-save"></i> Save Staff
        </button>
      </div>
    </form>
  </div>
</div>

<!-- ============ TOAST CONTAINER ============ -->
<div class="toast-container" id="toastContainer"></div>

<script>
  (function() {
    'use strict';

    // =============================================
    //  CONFIGURATION
    // =============================================
    const SUPABASE_URL = "https://ulccyfajpaiuvqovvqyz.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVsY2N5ZmFqcGFpdXZxb3Z2cXl6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwNjIwMzAsImV4cCI6MjA5NTYzODAzMH0.mLGYFgTZ3ToIJD8KAiqbxr0h42H8PYN5xh1fyvTNvqo";

    let supabase = null;
    let allStaff = [];
    let currentUser = null;
    let currentUserRole = null;
    let currentEditId = null;

    // =============================================
    //  TOAST
    // =============================================
    function showToast(message, type = 'info') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      const icons = {
        success: 'fa-check-circle',
        error: 'fa-exclamation-circle',
        warning: 'fa-exclamation-triangle',
        info: 'fa-info-circle'
      };
      toast.innerHTML = `<i class="fas ${icons[type] || icons.info}"></i> ${message}`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(100%)';
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    }

    // =============================================
    //  LIVE CLOCK
    // =============================================
    function updateClock() {
      const now = new Date();
      document.getElementById('liveTime').textContent = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
    }
    setInterval(updateClock, 1000);

    // =============================================
    //  INIT
    // =============================================
    async function init() {
      try {
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const { data: { session } } = await supabase.auth.getSession();
        if (!session) { window.location.href = 'login.html'; return; }
        currentUser = session.user;

        // Get user profile
        const { data: profile } = await supabase
          .from('profiles')
          .select('*')
          .eq('id', currentUser.id)
          .single();

        currentUserRole = profile?.role || 'staff';
        const name = profile?.full_name || currentUser.email?.split('@')[0] || 'User';

        // Update UI
        document.getElementById('userName').textContent = name;
        document.getElementById('userAvatar').textContent = name.charAt(0).toUpperCase();
        document.getElementById('roleBadge').textContent = currentUserRole.charAt(0).toUpperCase() + currentUserRole.slice(1);

        // Check if user has permission to manage staff
        if (currentUserRole !== 'admin') {
          document.getElementById('contentArea').innerHTML = `
            <div style="text-align:center;padding:80px 20px;">
              <i class="fas fa-lock" style="font-size:4rem;color:#ef4444;opacity:0.3;margin-bottom:16px;display:block;"></i>
              <h2>Access Denied</h2>
              <p style="color:var(--text-muted);">Only administrators can manage staff members.</p>
              <a href="dashboard.html" class="btn btn-primary" style="margin-top:16px;">Go to Dashboard</a>
            </div>
          `;
          return;
        }

        await fetchStaff();
        setupEvents();

      } catch (err) {
        console.error('Init error:', err);
        showToast('Failed to initialize: ' + err.message, 'error');
      }
    }

    // =============================================
    //  FETCH STAFF
    // =============================================
    async function fetchStaff() {
      try {
        const { data, error } = await supabase
          .from('profiles')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) throw error;

        allStaff = data || [];
        renderStaff();

      } catch (err) {
        console.error('Fetch error:', err);
        showToast('Failed to load staff: ' + err.message, 'error');
      }
    }

    // =============================================
    //  RENDER STAFF
    // =============================================
    function renderStaff() {
      const searchTerm = document.getElementById('searchInput')?.value.toLowerCase() || '';
      const roleFilter = document.getElementById('roleFilter')?.value || 'all';
      const statusFilter = document.getElementById('statusFilter')?.value || 'all';

      const filtered = allStaff.filter(s => {
        const matchesSearch = (s.full_name?.toLowerCase() || '').includes(searchTerm) ||
                              (s.email?.toLowerCase() || '').includes(searchTerm) ||
                              (s.role?.toLowerCase() || '').includes(searchTerm) ||
                              (s.position?.toLowerCase() || '').includes(searchTerm);
        const matchesRole = roleFilter === 'all' || s.role === roleFilter;
        const matchesStatus = statusFilter === 'all' || s.status === statusFilter;
        return matchesSearch && matchesRole && matchesStatus;
      });

      // Stats
      const total = allStaff.length;
      const active = allStaff.filter(s => s.status === 'active').length;
      const admins = allStaff.filter(s => s.role === 'admin').length;
      const managers = allStaff.filter(s => s.role === 'manager').length;

      // Build table rows
      let rows = '';
      if (filtered.length === 0) {
        rows = `
          <tr>
            <td colspan="7">
              <div class="empty-state">
                <i class="fas fa-users"></i>
                <h3>No staff members found</h3>
                <p>${searchTerm ? 'Try a different search term' : 'Click "Add Staff" to get started'}</p>
              </div>
            </td>
          </tr>
        `;
      } else {
        rows = filtered.map(staff => {
          const isSelf = staff.id === currentUser.id;
          return `
            <tr>
              <td><strong>${escapeHtml(staff.full_name || '—')}</strong></td>
              <td>${escapeHtml(staff.email || '—')}</td>
              <td><span class="role-badge">${escapeHtml(staff.role || 'staff')}</span></td>
              <td>${escapeHtml(staff.position || '—')}</td>
              <td>${escapeHtml(staff.employee_code || '—')}</td>
              <td><span class="status-badge ${staff.status === 'active' ? 'active' : 'inactive'}">${staff.status || 'active'}</span></td>
              <td>
                <div class="action-icons">
                  <button class="edit-btn" onclick="window.editStaff('${staff.id}')" title="Edit staff member">
                    <i class="fas fa-edit"></i>
                  </button>
                  ${!isSelf ? `
                    <button class="delete-btn" onclick="window.deleteStaff('${staff.id}', '${escapeHtml(staff.full_name).replace(/'/g, "\\'")}')" title="Deactivate staff member">
                      <i class="fas fa-user-slash"></i>
                    </button>
                  ` : `
                    <span class="self-label">(You)</span>
                  `}
                </div>
              </td>
            </tr>
          `;
        }).join('');
      }

      const html = `
        <!-- Stats -->
        <div class="stats-grid">
          <div class="stats-card">
            <span class="stats-icon"><i class="fas fa-users"></i></span>
            <div class="stats-value">${total}</div>
            <div class="stats-label">Total Staff</div>
          </div>
          <div class="stats-card">
            <span class="stats-icon"><i class="fas fa-user-check"></i></span>
            <div class="stats-value">${active}</div>
            <div class="stats-label">Active</div>
          </div>
          <div class="stats-card">
            <span class="stats-icon"><i class="fas fa-user-shield"></i></span>
            <div class="stats-value">${admins}</div>
            <div class="stats-label">Admins</div>
          </div>
          <div class="stats-card">
            <span class="stats-icon"><i class="fas fa-user-tie"></i></span>
            <div class="stats-value">${managers}</div>
            <div class="stats-label">Managers</div>
          </div>
        </div>

        <!-- Action Bar -->
        <div class="action-bar">
          <div class="action-left">
            <button class="btn btn-primary" id="addStaffBtn">
              <i class="fas fa-user-plus"></i> Add Staff
            </button>
            <button class="btn btn-secondary" id="refreshBtn">
              <i class="fas fa-sync-alt"></i> Refresh
            </button>
          </div>
          <div class="action-right">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search staff...">
            <select id="roleFilter" class="btn-secondary">
              <option value="all">All Roles</option>
              <option value="admin">Admin</option>
              <option value="manager">Manager</option>
              <option value="staff">Staff</option>
            </select>
            <select id="statusFilter" class="btn-secondary">
              <option value="all">All Status</option>
              <option value="active">Active</option>
              <option value="inactive">Inactive</option>
            </select>
          </div>
        </div>

        <!-- Table -->
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th onclick="window.sortStaff('full_name')">Name <i class="fas fa-sort"></i></th>
                <th onclick="window.sortStaff('email')">Email <i class="fas fa-sort"></i></th>
                <th onclick="window.sortStaff('role')">Role <i class="fas fa-sort"></i></th>
                <th onclick="window.sortStaff('position')">Position <i class="fas fa-sort"></i></th>
                <th onclick="window.sortStaff('employee_code')">Code <i class="fas fa-sort"></i></th>
                <th onclick="window.sortStaff('status')">Status <i class="fas fa-sort"></i></th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              ${rows}
            </tbody>
          </table>
        </div>
      `;

      document.getElementById('contentArea').innerHTML = html;

      // Re-bind events
      document.getElementById('addStaffBtn')?.addEventListener('click', openAddModal);
      document.getElementById('refreshBtn')?.addEventListener('click', fetchStaff);
      document.getElementById('searchInput')?.addEventListener('input', renderStaff);
      document.getElementById('roleFilter')?.addEventListener('change', renderStaff);
      document.getElementById('statusFilter')?.addEventListener('change', renderStaff);
    }

    // =============================================
    //  HELPERS
    // =============================================
    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
      });
    }

    window.sortStaff = function(column) {
      allStaff.sort((a, b) => {
        let aVal = a[column] || '';
        let bVal = b[column] || '';
        if (typeof aVal === 'string') aVal = aVal.toLowerCase();
        if (typeof bVal === 'string') bVal = bVal.toLowerCase();
        return aVal > bVal ? 1 : -1;
      });
      renderStaff();
    };

    // =============================================
    //  MODAL FUNCTIONS
    // =============================================
    function openAddModal() {
      currentEditId = null;
      document.getElementById('modalTitle').textContent = 'Add Staff Member';
      document.getElementById('staffForm').reset();
      document.getElementById('staffId').value = '';
      document.getElementById('role').value = 'staff';
      document.getElementById('status').value = 'active';
      document.getElementById('passwordGroup').style.display = 'block';
      document.getElementById('passwordRequired').textContent = '*';
      document.getElementById('passwordHint').textContent = 'Required for new staff members.';
      document.getElementById('staffModal').classList.add('active');
    }

    window.editStaff = async function(staffId) {
      const staff = allStaff.find(s => s.id === staffId);
      if (!staff) return;

      currentEditId = staffId;
      document.getElementById('modalTitle').textContent = 'Edit Staff Member';
      document.getElementById('staffId').value = staff.id;
      document.getElementById('fullName').value = staff.full_name || '';
      document.getElementById('email').value = staff.email || '';
      document.getElementById('role').value = staff.role || 'staff';
      document.getElementById('position').value = staff.position || '';
      document.getElementById('employeeCode').value = staff.employee_code || '';
      document.getElementById('phone').value = staff.phone || '';
      document.getElementById('hireDate').value = staff.hire_date || '';
      document.getElementById('status').value = staff.status || 'active';
      document.getElementById('storeName').value = staff.store_name || '';
      document.getElementById('password').value = '';
      document.getElementById('passwordGroup').style.display = 'block';
      document.getElementById('passwordRequired').textContent = '';
      document.getElementById('passwordHint').textContent = 'Leave blank to keep existing password.';
      document.getElementById('staffModal').classList.add('active');
    };

    window.deleteStaff = async function(staffId, staffName) {
      if (!confirm(`Are you sure you want to deactivate ${staffName}?`)) return;

      try {
        const { error } = await supabase
          .from('profiles')
          .update({ status: 'inactive', updated_at: new Date().toISOString() })
          .eq('id', staffId);

        if (error) throw error;
        showToast(`${staffName} has been deactivated`, 'success');
        await fetchStaff();
      } catch (err) {
        showToast('Failed to deactivate: ' + err.message, 'error');
      }
    };

    // =============================================
    //  SAVE STAFF
    // =============================================
    async function saveStaff(e) {
      e.preventDefault();

      const fullName = document.getElementById('fullName').value.trim();
      const email = document.getElementById('email').value.trim();
      const role = document.getElementById('role').value;
      const position = document.getElementById('position').value.trim();
      const employeeCode = document.getElementById('employeeCode').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const hireDate = document.getElementById('hireDate').value;
      const status = document.getElementById('status').value;
      const storeName = document.getElementById('storeName').value.trim();
      const password = document.getElementById('password').value;

      if (!fullName || !email) {
        showToast('Please fill in name and email', 'error');
        return;
      }

      const saveBtn = document.getElementById('saveStaffBtn');
      saveBtn.disabled = true;
      saveBtn.innerHTML = '<i class="fas fa-spinner spinner"></i> Saving...';

      try {
        if (currentEditId) {
          // Update existing
          const { error } = await supabase
            .from('profiles')
            .update({
              full_name: fullName,
              role: role,
              position: position,
              employee_code: employeeCode,
              phone: phone,
              hire_date: hireDate || null,
              status: status,
              store_name: storeName,
              updated_at: new Date().toISOString()
            })
            .eq('id', currentEditId);

          if (error) throw error;
          showToast('Staff member updated successfully!', 'success');

        } else {
          // Create new
          if (!password || password.length < 6) {
            showToast('Password must be at least 6 characters', 'error');
            saveBtn.disabled = false;
            saveBtn.innerHTML = '<i class="fas fa-save"></i> Save Staff';
            return;
          }

          const { data: authData, error: signUpError } = await supabase.auth.signUp({
            email: email,
            password: password,
            options: {
              data: { full_name: fullName, role: role }
            }
          });

          if (signUpError) throw signUpError;
          if (!authData.user) throw new Error('Failed to create user');

          const { error: profileError } = await supabase
            .from('profiles')
            .insert({
              id: authData.user.id,
              full_name: fullName,
              email: email,
              role: role,
              position: position,
              employee_code: employeeCode,
              phone: phone,
              hire_date: hireDate || null,
              status: status,
              store_name: storeName
            });

          if (profileError) throw profileError;
          showToast('Staff member added successfully!', 'success');
        }

        document.getElementById('staffModal').classList.remove('active');
        await fetchStaff();

      } catch (err) {
        console.error(err);
        showToast(err.message || 'Failed to save staff member', 'error');
      } finally {
        saveBtn.disabled = false;
        saveBtn.innerHTML = '<i class="fas fa-save"></i> Save Staff';
      }
    }

    // =============================================
    //  EVENTS
    // =============================================
    function setupEvents() {
      // Theme
      document.getElementById('themeToggle').addEventListener('click', function() {
        document.body.classList.toggle('dark-mode');
        const icon = this.querySelector('i');
        icon.classList.toggle('fa-moon');
        icon.classList.toggle('fa-sun');
        localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
      });

      if (localStorage.getItem('darkMode') === 'true') {
        document.body.classList.add('dark-mode');
        document.querySelector('#themeToggle i').classList.replace('fa-moon', 'fa-sun');
      }

      // Mobile menu
      document.getElementById('menuToggle').addEventListener('click', function() {
        document.getElementById('sidebar').classList.toggle('mobile-open');
      });

      document.addEventListener('click', function(e) {
        const sidebar = document.getElementById('sidebar');
        const toggle = document.getElementById('menuToggle');
        if (window.innerWidth <= 768 && !sidebar.contains(e.target) && !toggle.contains(e.target)) {
          sidebar.classList.remove('mobile-open');
        }
      });

      // Modal
      document.querySelectorAll('.close').forEach(btn => {
        btn.addEventListener('click', () => {
          document.getElementById('staffModal').classList.remove('active');
        });
      });

      document.getElementById('staffModal').addEventListener('click', function(e) {
        if (e.target === this) this.classList.remove('active');
      });

      document.getElementById('cancelBtn').addEventListener('click', () => {
        document.getElementById('staffModal').classList.remove('active');
      });

      document.getElementById('staffForm').addEventListener('submit', saveStaff);

      // Logout
      document.getElementById('userMenu').addEventListener('click', async function() {
        if (confirm('Logout?')) {
          await supabase.auth.signOut();
          window.location.href = 'login.html';
        }
      });

      // Keyboard shortcut
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
          document.getElementById('staffModal').classList.remove('active');
        }
        if ((e.ctrlKey || e.metaKey) && e.key === 'n') {
          e.preventDefault();
          openAddModal();
        }
      });
    }

    // =============================================
    //  START
    // =============================================
    document.addEventListener('DOMContentLoaded', init);
  })();
</script>
</body>
</html>
