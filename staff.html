<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SoulHub | Staff Management (Debug)</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #0f0; }
    .log { border-bottom: 1px solid #333; padding: 8px; margin: 4px 0; }
    .error { color: #f00; }
    .success { color: #0f0; }
    .info { color: #ff0; }
    pre { background: #000; padding: 10px; overflow-x: auto; }
  </style>
</head>
<body>
  <h1>Staff Management - Debug Mode</h1>
  <div id="logs">Loading... Please wait</div>

  <script>
    // Wait for DOM to load
    document.addEventListener('DOMContentLoaded', function() {
      const logsDiv = document.getElementById('logs');
      
      function addLog(message, type = 'info') {
        const logEntry = document.createElement('div');
        logEntry.className = `log ${type}`;
        logEntry.textContent = new Date().toLocaleTimeString() + ' - ' + message;
        logsDiv.appendChild(logEntry);
        console.log(message);
      }
      
      async function debug() {
        try {
          addLog('🔍 Starting debug...', 'info');
          
          // Check if Supabase is loaded
          if (typeof window.supabase === 'undefined') {
            addLog('❌ Supabase library not loaded! Check internet connection.', 'error');
            return;
          }
          addLog('✅ Supabase library loaded', 'success');
          
          // Initialize Supabase
          const SUPABASE_URL = "https://ulccyfajpaiuvqovvqyz.supabase.co";
          const SUPABASE_ANON_KEY = "sb_publishable_4kKDA0psp8AFpoTJlB-k8A_VS9IaWI9";
          const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
          addLog('✅ Supabase client created', 'success');
          
          // Step 1: Check authentication
          addLog('Step 1: Checking authentication...', 'info');
          const { data: { user }, error: userError } = await supabase.auth.getUser();
          
          if (userError) {
            addLog(`❌ Auth error: ${userError.message}`, 'error');
            return;
          }
          if (!user) {
            addLog('❌ No user logged in. Redirecting to login in 3 seconds...', 'error');
            setTimeout(() => { window.location.href = "login.html"; }, 3000);
            return;
          }
          addLog(`✅ Logged in as: ${user.email} (ID: ${user.id})`, 'success');
          
          // Step 2: Check profiles table
          addLog('Step 2: Checking profiles table...', 'info');
          const { data: profiles, error: profilesError } = await supabase
            .from('profiles')
            .select('*')
            .limit(3);
          
          if (profilesError) {
            addLog(`❌ Profiles table error: ${profilesError.message}`, 'error');
            addLog(`   Message: ${profilesError.message}`, 'error');
            addLog(`   Hint: Make sure the 'profiles' table exists`, 'error');
          } else {
            addLog(`✅ Profiles table accessible!`, 'success');
            addLog(`   Found ${profiles?.length || 0} records`, 'success');
            if (profiles && profiles.length > 0) {
              addLog(`   Sample: ${JSON.stringify(profiles[0])}`, 'info');
            }
          }
          
          // Step 3: Check staff table
          addLog('Step 3: Checking staff table...', 'info');
          const { data: staff, error: staffError } = await supabase
            .from('staff')
            .select('*')
            .limit(3);
          
          if (staffError) {
            addLog(`❌ Staff table error: ${staffError.message}`, 'error');
            addLog(`   Hint: Make sure the 'staff' table exists`, 'error');
          } else {
            addLog(`✅ Staff table accessible!`, 'success');
            addLog(`   Found ${staff?.length || 0} records`, 'success');
            if (staff && staff.length > 0) {
              addLog(`   Sample: ${JSON.stringify(staff[0])}`, 'info');
            }
          }
          
          addLog('🏁 Debug complete!', 'success');
          
        } catch (err) {
          addLog(`❌ Unexpected error: ${err.message}`, 'error');
          console.error(err);
        }
      }
      
      // Run debug
      debug();
    });
  </script>
</body>
</html>l
