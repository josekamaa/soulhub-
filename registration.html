<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Join SoulHub Management – Register Your Store</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;0,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #FEFCF8;
      color: #1E1B18;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .register-container {
      max-width: 580px;
      width: 100%;
      background: white;
      border-radius: 36px;
      box-shadow: 0 25px 45px -12px rgba(0,0,0,0.15);
      overflow: hidden;
      border: 1px solid #F0EAE3;
    }
    .register-header {
      background: linear-gradient(135deg, #1E1B18 0%, #2C241E 100%);
      padding: 2rem 2rem 1.8rem;
      text-align: center;
      color: white;
    }
    .register-header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.9rem;
      margin-bottom: 0.5rem;
    }
    .register-header p {
      opacity: 0.8;
      font-size: 0.9rem;
    }
    .register-form {
      padding: 2rem 2rem 2rem;
    }
    .form-group {
      margin-bottom: 1.4rem;
    }
    label {
      display: block;
      font-weight: 600;
      font-size: 0.85rem;
      margin-bottom: 0.5rem;
      color: #2A241F;
    }
    input, select {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid #E9E2D8;
      border-radius: 28px;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      transition: 0.2s;
      background: white;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #C49A6C;
      box-shadow: 0 0 0 3px rgba(196,154,108,0.2);
    }
    .role-hint {
      font-size: 0.7rem;
      color: #8F8278;
      margin-top: 6px;
    }
    .btn-register {
      width: 100%;
      background: #1E1B18;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 40px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.25s;
      margin-top: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-register:hover {
      background: #C49A6C;
      transform: translateY(-2px);
      color: #1E1B18;
    }
    .error-msg {
      background: #FEF2F0;
      color: #C23D2E;
      padding: 12px;
      border-radius: 28px;
      font-size: 0.8rem;
      margin-bottom: 1.2rem;
      display: none;
      align-items: center;
      gap: 8px;
    }
    .success-msg {
      background: #E6F4EA;
      color: #2E7D32;
      padding: 12px;
      border-radius: 28px;
      font-size: 0.8rem;
      margin-bottom: 1.2rem;
      display: none;
    }
    .login-link {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.85rem;
    }
    .login-link a {
      color: #C49A6C;
      text-decoration: none;
      font-weight: 600;
    }
    .footer-note {
      background: #F9F4ED;
      padding: 1rem;
      text-align: center;
      font-size: 0.7rem;
      color: #6B5E54;
    }
    i.loading-icon {
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="register-container">
  <div class="register-header">
    <h1><i class="fas fa-chart-line"></i> SoulHub Management</h1>
    <p>Create your store account & join the future of shoe retail</p>
  </div>
  <div class="register-form">
    <div id="errorBox" class="error-msg"><i class="fas fa-exclamation-circle"></i> <span id="errorText"></span></div>
    <div id="successBox" class="success-msg"><i class="fas fa-check-circle"></i> <span id="successText"></span></div>
    
    <form id="registerForm">
      <div class="form-group">
        <label><i class="fas fa-user"></i> Full name *</label>
        <input type="text" id="fullName" placeholder="Alex Morgan" required>
      </div>
      <div class="form-group">
        <label><i class="fas fa-envelope"></i> Email address *</label>
        <input type="email" id="email" placeholder="hello@soulhub.com" required>
      </div>
      <div class="form-group">
        <label><i class="fas fa-lock"></i> Password *</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <div class="form-group">
        <label><i class="fas fa-check-circle"></i> Confirm password *</label>
        <input type="password" id="confirmPassword" placeholder="••••••••" required>
      </div>
      <div class="form-group">
        <label><i class="fas fa-tag"></i> Role *</label>
        <select id="role" required>
          <option value="staff">👟 Staff (Store associate)</option>
          <option value="manager">📊 Manager (Inventory & team)</option>
          <option value="admin">⚙️ Admin (Full system access)</option>
        </select>
        <div class="role-hint">Choose the right access level for your dashboard.</div>
      </div>
      <div class="form-group">
        <label><i class="fas fa-store"></i> Store name (optional)</label>
        <input type="text" id="storeName" placeholder="Sole Haven NYC">
      </div>
      <div class="form-group">
        <label><i class="fas fa-phone-alt"></i> Phone number (optional)</label>
        <input type="tel" id="phone" placeholder="+1 555 123 4567">
      </div>
      <button type="submit" class="btn-register" id="submitBtn"><i class="fas fa-user-plus"></i> Register store account</button>
    </form>
    <div class="login-link">
      Already have an account? <a href="login.html">Sign in →</a>
    </div>
  </div>
  <div class="footer-note">
    <i class="fas fa-shield-alt"></i> Your data is secure. By registering you agree to our terms.
  </div>
</div>

<script>
  // ========= REPLACE WITH YOUR SUPABASE CREDENTIALS =========
  const SUPABASE_URL = "https://cvjeuiimisqopsieqmex.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_o9aUlBnVhU4C_N-QWyRoOg_6Dufr5JY";
  // ==========================================================
  
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  
  const form = document.getElementById('registerForm');
  const errorBox = document.getElementById('errorBox');
  const errorText = document.getElementById('errorText');
  const successBox = document.getElementById('successBox');
  const successText = document.getElementById('successText');
  const submitBtn = document.getElementById('submitBtn');
  
  function hideAlerts() {
    errorBox.style.display = 'none';
    successBox.style.display = 'none';
  }
  
  function showError(msg) {
    errorText.innerText = msg;
    errorBox.style.display = 'flex';
    setTimeout(() => { errorBox.style.display = 'none'; }, 5000);
  }
  
  function showSuccess(msg) {
    successText.innerText = msg;
    successBox.style.display = 'flex';
  }
  
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideAlerts();
    
    const fullName = document.getElementById('fullName').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirmPassword').value;
    const role = document.getElementById('role').value;
    const storeName = document.getElementById('storeName').value.trim();
    const phone = document.getElementById('phone').value.trim();
    
    if (!fullName || !email || !password || !confirm) {
      showError('Please fill all required fields (*)');
      return;
    }
    if (password !== confirm) {
      showError('Passwords do not match');
      return;
    }
    if (password.length < 6) {
      showError('Password must be at least 6 characters');
      return;
    }
    if (!['admin', 'manager', 'staff'].includes(role)) {
      showError('Invalid role selection');
      return;
    }
    
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<i class="fas fa-spinner loading-icon"></i> Creating account...';
    
    try {
      // 1. Sign up with Supabase Auth
      const { data: authData, error: signUpError } = await supabase.auth.signUp({
        email,
        password,
        options: { data: { full_name: fullName, role: role } }
      });
      
      if (signUpError) throw signUpError;
      if (!authData.user) throw new Error('Signup failed, please try again.');
      
      const userId = authData.user.id;
      
      // 2. Insert profile record into 'profiles' table
      const { error: profileError } = await supabase
        .from('profiles')
        .insert({
          id: userId,
          full_name: fullName,
          role: role,
          store_name: storeName || null,
          phone: phone || null
        });
      
      if (profileError) {
        console.error('Profile insert error:', profileError);
        // Attempt to clean up? but user already created.
        throw new Error('Account created but profile setup failed. Please contact support.');
      }
      
      // 3. Optional: sign out to force login next time (clean flow)
      await supabase.auth.signOut();
      
      showSuccess(`Welcome ${fullName}! Your ${role} account has been created.`);
      setTimeout(() => {
        window.location.href = 'login.html?registered=true';
      }, 2000);
      
    } catch (err) {
      console.error(err);
      let msg = err.message;
      if (msg.includes('User already registered')) msg = 'This email is already registered. Try logging in.';
      showError(msg);
      submitBtn.disabled = false;
      submitBtn.innerHTML = '<i class="fas fa-user-plus"></i> Register store account';
    }
  });
</script>
</body>
</html>
