<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SoulHub Management – Register Your Store</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@300;400;500;600;700;800&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #FEFCF8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .register-container {
      max-width: 580px;
      width: 100%;
      background: white;
      border-radius: 36px;
      box-shadow: 0 25px 45px -12px rgba(0,0,0,0.15);
      border: 1px solid #F0EAE3;
    }
    .register-header {
      background: linear-gradient(135deg, #1E1B18 0%, #2C241E 100%);
      padding: 2rem;
      text-align: center;
      color: white;
    }
    .register-header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.9rem;
    }
    .register-form {
      padding: 2rem;
    }
    .form-group {
      margin-bottom: 1.4rem;
    }
    label {
      display: block;
      font-weight: 600;
      font-size: 0.85rem;
      margin-bottom: 0.5rem;
      color: #2A241F;
    }
    input, select {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid #E9E2D8;
      border-radius: 28px;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #C49A6C;
    }
    .btn-register {
      width: 100%;
      background: #1E1B18;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 40px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-register:hover {
      background: #C49A6C;
      color: #1E1B18;
    }
    .alert {
      padding: 12px;
      border-radius: 28px;
      font-size: 0.8rem;
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .alert-error {
      background: #FEF2F0;
      color: #C23D2E;
    }
    .alert-success {
      background: #E6F4EA;
      color: #2E7D32;
    }
    .alert-info {
      background: #E8F0FE;
      color: #1A56DB;
    }
    .login-link {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.85rem;
    }
    .login-link a {
      color: #C49A6C;
      text-decoration: none;
      font-weight: 600;
    }
    .footer-note {
      background: #F9F4ED;
      padding: 1rem;
      text-align: center;
      font-size: 0.7rem;
      color: #6B5E54;
    }
    .spinner {
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="register-container">
  <div class="register-header">
    <h1><i class="fas fa-chart-line"></i> SoulHub Management</h1>
    <p>Create your store account & join the future of shoe retail</p>
  </div>
  <div class="register-form">
    <div id="statusMessage"></div>

    <form id="registerForm">
      <div class="form-group">
        <label><i class="fas fa-user"></i> Full name *</label>
        <input type="text" id="fullName" placeholder="Alex Morgan" required>
      </div>
      <div class="form-group">
        <label><i class="fas fa-envelope"></i> Email *</label>
        <input type="email" id="email" placeholder="hello@soulhub.com" required>
      </div>
      <div class="form-group">
        <label><i class="fas fa-lock"></i> Password *</label>
        <input type="password" id="password" placeholder="•••••••• (min 6 chars)" required>
      </div>
      <div class="form-group">
        <label><i class="fas fa-check-circle"></i> Confirm password *</label>
        <input type="password" id="confirmPassword" placeholder="••••••••" required>
      </div>
      <div class="form-group">
        <label><i class="fas fa-tag"></i> Role *</label>
        <select id="role" required>
          <option value="staff">👟 Staff (Store associate)</option>
          <option value="manager">📊 Manager (Inventory & team)</option>
          <option value="admin">⚙️ Admin (Full system access)</option>
        </select>
        <div class="role-hint" style="font-size:0.7rem; color:#8F8278; margin-top:5px;">Choose the right access level.</div>
      </div>
      <div class="form-group">
        <label><i class="fas fa-store"></i> Store name (optional)</label>
        <input type="text" id="storeName" placeholder="Sole Haven NYC">
      </div>
      <div class="form-group">
        <label><i class="fas fa-phone-alt"></i> Phone (optional)</label>
        <input type="tel" id="phone" placeholder="+1 555 123 4567">
      </div>
      <button type="submit" class="btn-register" id="submitBtn"><i class="fas fa-user-plus"></i> Register store account</button>
    </form>
    <div class="login-link">
      Already have an account? <a href="login.html">Sign in →</a>
    </div>
  </div>
  <div class="footer-note">
    <i class="fas fa-shield-alt"></i> Your data is secure. By registering you agree to our terms.
  </div>
</div>

<script>
  // ==================== CONFIGURATION ====================
  // Replace with your actual Supabase credentials
  const SUPABASE_URL = "https://cvjeuiimisqopsieqmex.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_o9aUlBnVhU4C_N-QWyRoOg_6Dufr5JY";
  // =======================================================

  // Initialize Supabase client
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
  
  // DOM elements
  const form = document.getElementById('registerForm');
  const statusDiv = document.getElementById('statusMessage');
  const submitBtn = document.getElementById('submitBtn');

  // Helper: show message
  function showMessage(text, type) {
    statusDiv.innerHTML = `<div class="alert alert-${type}"><i class="fas ${type === 'error' ? 'fa-exclamation-circle' : (type === 'success' ? 'fa-check-circle' : 'fa-info-circle')}"></i> ${text}</div>`;
    if (type !== 'error') {
      setTimeout(() => { if (statusDiv.firstChild) statusDiv.firstChild.remove(); }, 5000);
    }
  }

  // Diagnostic test on page load
  async function runDiagnostics() {
    showMessage("🔍 Testing Supabase connection...", "info");
    try {
      // Try a light query to profiles table (just existence check)
      const { error } = await supabase.from('profiles').select('count', { count: 'exact', head: true });
      if (error) {
        if (error.message.includes("relation") && error.message.includes("does not exist")) {
          showMessage("❌ 'profiles' table missing. Run the SQL CREATE TABLE command in Supabase SQL editor.", "error");
        } else if (error.message.includes("Invalid API key") || error.message.includes("JWT")) {
          showMessage("❌ Invalid publishable key. Please check your Supabase project settings → API → Publishable key.", "error");
        } else {
          showMessage(`⚠️ Connection issue: ${error.message}`, "error");
        }
        return false;
      }
      showMessage("✅ Supabase connected successfully! Ready to register.", "success");
      return true;
    } catch (err) {
      showMessage(`💥 Fatal: ${err.message} — check URL and key.`, "error");
      return false;
    }
  }

  // Registration handler
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    statusDiv.innerHTML = ''; // clear old messages

    const fullName = document.getElementById('fullName').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirmPassword').value;
    const role = document.getElementById('role').value;
    const storeName = document.getElementById('storeName').value.trim();
    const phone = document.getElementById('phone').value.trim();

    // Validation
    if (!fullName || !email || !password || !confirm) {
      showMessage("Please fill all required fields (*)", "error");
      return;
    }
    if (password !== confirm) {
      showMessage("Passwords do not match", "error");
      return;
    }
    if (password.length < 6) {
      showMessage("Password must be at least 6 characters", "error");
      return;
    }

    submitBtn.disabled = true;
    submitBtn.innerHTML = '<i class="fas fa-spinner spinner"></i> Creating account...';

    try {
      // 1. Sign up with Supabase Auth
      const { data: authData, error: signUpError } = await supabase.auth.signUp({
        email,
        password,
        options: { data: { full_name: fullName, role: role } }
      });

      if (signUpError) throw signUpError;
      if (!authData.user) throw new Error("Signup failed, no user returned");

      const userId = authData.user.id;

      // 2. Insert profile into 'profiles' table
      const { error: profileError } = await supabase
        .from('profiles')
        .insert({
          id: userId,
          full_name: fullName,
          role: role,
          store_name: storeName || null,
          phone: phone || null
        });

      if (profileError) {
        console.error("Profile insert error:", profileError);
        // The user was created but profile insertion failed – handle gracefully
        throw new Error("Account created but profile setup incomplete. Please contact support.");
      }

      // 3. Sign out to force fresh login
      await supabase.auth.signOut();

      showMessage(`✨ Welcome ${fullName}! Your ${role} account has been created. Redirecting to login...`, "success");
      setTimeout(() => {
        window.location.href = "login.html?registered=true";
      }, 2000);

    } catch (err) {
      console.error(err);
      let msg = err.message;
      if (msg.includes("User already registered")) {
        msg = "This email is already registered. Please log in instead.";
      } else if (msg.includes("23505") && msg.includes("duplicate")) {
        msg = "Email already exists in our system. Try a different one or login.";
      }
      showMessage(msg, "error");
      submitBtn.disabled = false;
      submitBtn.innerHTML = '<i class="fas fa-user-plus"></i> Register store account';
    }
  });

  // Run diagnostics when page loads
  runDiagnostics();
</script>
</body>
</html>
