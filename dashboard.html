<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SoulHub · Smart Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@300;400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    /* =============================================
                  CSS VARIABLES
    ============================================= */
    :root {
      --primary: #C49A6C;
      --primary-dark: #A2794C;
      --primary-light: #F0D5B0;
      --bg: #FEFCF8;
      --bg-card: #FFFFFF;
      --text: #1E1B18;
      --text-muted: #6B5E54;
      --border: #F0EAE3;
      --shadow: 0 4px 16px rgba(0,0,0,0.06);
      --radius: 20px;
      --radius-sm: 12px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      --font: 'Inter', sans-serif;
      --font-display: 'Playfair Display', serif;
    }

    .dark-mode {
      --bg: #121212;
      --bg-card: #1E1E1E;
      --text: #E9E2D8;
      --text-muted: #A8998E;
      --border: #333333;
      --shadow: 0 4px 16px rgba(0,0,0,0.4);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      transition: var(--transition);
      overflow-x: hidden;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--border); }
    ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 8px; }

    /* =============================================
                  SIDEBAR
    ============================================= */
    .app-container { display: flex; min-height: 100vh; }

    .sidebar {
      width: 280px;
      background: var(--bg-card);
      border-right: 1px solid var(--border);
      position: fixed;
      height: 100vh;
      overflow-y: auto;
      transition: transform 0.3s ease-in-out;
      z-index: 1000;
      padding-bottom: 40px;
    }

    .sidebar-header {
      padding: 24px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-family: var(--font-display);
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(135deg, #2C241E 0%, var(--primary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo i { -webkit-text-fill-color: var(--primary); }

    .nav-menu { padding: 20px 16px; }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      margin-bottom: 4px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: var(--transition);
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 500;
    }
    .nav-item:hover { background: var(--primary-light); color: var(--primary); }
    .nav-item.active { background: var(--primary); color: white; }
    .nav-item i { width: 24px; font-size: 1.2rem; }
    .nav-item.hidden { display: none; }

    .sidebar-footer {
      padding: 20px 24px;
      border-top: 1px solid var(--border);
      font-size: 0.75rem;
      color: var(--text-muted);
      position: absolute;
      bottom: 0;
      width: 100%;
    }

    /* =============================================
                  MAIN CONTENT
    ============================================= */
    .main-content {
      flex: 1;
      margin-left: 280px;
      min-height: 100vh;
    }

    .top-bar {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 14px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 99;
      backdrop-filter: blur(12px);
    }

    .menu-toggle {
      display: none;
      cursor: pointer;
      font-size: 1.5rem;
      color: var(--text-muted);
      background: none;
      border: none;
    }
    .menu-toggle:hover { color: var(--primary); }

    .page-title h1 {
      font-family: var(--font-display);
      font-size: 1.6rem;
      font-weight: 600;
    }
    .page-title h1 i { color: var(--primary); margin-right: 10px; }
    .page-title .greeting { font-size: 0.9rem; color: var(--text-muted); font-family: var(--font); font-weight: 400; }

    .top-bar-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .theme-toggle {
      cursor: pointer;
      font-size: 1.2rem;
      padding: 8px;
      border-radius: 50%;
      transition: var(--transition);
      background: none;
      border: none;
      color: var(--text-muted);
    }
    .theme-toggle:hover { background: var(--border); color: var(--primary); }

    .role-badge {
      padding: 4px 14px;
      border-radius: 40px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: var(--primary-light);
      color: var(--primary-dark);
    }
    .dark-mode .role-badge { background: #3d3d3d; color: #C49A6C; }

    .user-menu {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      padding: 6px 16px 6px 6px;
      border-radius: 40px;
      background: var(--border);
      transition: var(--transition);
    }
    .user-menu:hover { background: var(--primary-light); }
    .user-avatar {
      width: 32px;
      height: 32px;
      background: var(--primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 600;
      font-size: 0.8rem;
    }
    .user-name { font-weight: 500; font-size: 0.9rem; }

    /* =============================================
                  CONTENT AREA
    ============================================= */
    .content-area {
      padding: 28px 32px;
      max-width: 1440px;
      margin: 0 auto;
    }

    /* =============================================
                  WELCOME BANNER
    ============================================= */
    .welcome-banner {
      background: linear-gradient(135deg, var(--primary-dark), var(--primary));
      border-radius: var(--radius);
      padding: 32px 40px;
      color: white;
      margin-bottom: 28px;
      position: relative;
      overflow: hidden;
    }
    .welcome-banner::after {
      content: '👟';
      position: absolute;
      font-size: 120px;
      right: 20px;
      bottom: -20px;
      opacity: 0.15;
    }
    .welcome-banner h2 {
      font-family: var(--font-display);
      font-size: 1.8rem;
      font-weight: 600;
    }
    .welcome-banner p {
      opacity: 0.9;
      margin-top: 4px;
      font-size: 1rem;
    }
    .welcome-banner .quick-tip {
      margin-top: 12px;
      display: inline-block;
      background: rgba(255,255,255,0.2);
      padding: 6px 18px;
      border-radius: 40px;
      font-size: 0.8rem;
      backdrop-filter: blur(4px);
    }

    /* =============================================
                  QUICK ACTION CARDS
    ============================================= */
    .quick-actions-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }

    .quick-action-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: var(--shadow);
      text-decoration: none;
      color: var(--text);
    }
    .quick-action-card:hover {
      transform: translateY(-4px) scale(1.02);
      border-color: var(--primary);
      box-shadow: 0 8px 24px rgba(196,154,108,0.2);
    }
    .quick-action-card .icon {
      font-size: 2rem;
      color: var(--primary);
      margin-bottom: 8px;
      display: block;
    }
    .quick-action-card h4 { font-size: 0.9rem; font-weight: 600; }
    .quick-action-card p { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; }

    /* =============================================
                  WIDGETS GRID
    ============================================= */
    .widgets-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 24px;
      margin-bottom: 28px;
    }

    .widget {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      transition: var(--transition);
    }
    .widget:hover { box-shadow: 0 8px 24px rgba(0,0,0,0.08); }

    .widget-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .widget-header h3 {
      font-size: 0.9rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .widget-header h3 i { color: var(--primary); }
    .widget-header .widget-action {
      font-size: 0.75rem;
      color: var(--primary);
      cursor: pointer;
      font-weight: 500;
    }
    .widget-header .widget-action:hover { text-decoration: underline; }

    .widget-value {
      font-size: 2.2rem;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .widget-value .trend {
      font-size: 0.8rem;
      font-weight: 500;
      margin-left: 8px;
    }
    .widget-value .trend.up { color: #10b981; }
    .widget-value .trend.down { color: #ef4444; }

    .widget-sub {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .widget .mini-chart { height: 60px; margin-top: 12px; }

    /* =============================================
                  ACTIVITY FEED
    ============================================= */
    .activity-feed {
      list-style: none;
      padding: 0;
    }
    .activity-feed li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .activity-feed li:last-child { border-bottom: none; }
    .activity-feed .activity-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      flex-shrink: 0;
    }
    .activity-feed .activity-icon.sale { background: #10b98120; color: #10b981; }
    .activity-feed .activity-icon.stock { background: #f59e0b20; color: #f59e0b; }
    .activity-feed .activity-icon.customer { background: #3b82f620; color: #3b82f6; }
    .activity-feed .activity-icon.system { background: #8b5cf620; color: #8b5cf6; }
    .activity-feed .activity-content { flex: 1; }
    .activity-feed .activity-content .title { font-weight: 500; font-size: 0.9rem; }
    .activity-feed .activity-content .time { font-size: 0.75rem; color: var(--text-muted); }
    .activity-feed .activity-amount { font-weight: 600; }

    /* =============================================
                  PRODUCT SPOTLIGHT
    ============================================= */
    .spotlight-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 16px;
    }
    .spotlight-item {
      text-align: center;
      cursor: pointer;
      transition: var(--transition);
      padding: 12px;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
    }
    .spotlight-item:hover {
      border-color: var(--primary);
      background: var(--primary-light);
      transform: translateY(-2px);
    }
    .dark-mode .spotlight-item:hover { background: #3d3d3d; }
    .spotlight-item img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 8px;
    }
    .spotlight-item .name { font-size: 0.8rem; font-weight: 500; }
    .spotlight-item .price { font-size: 0.75rem; color: var(--primary); font-weight: 600; }

    /* =============================================
                  LOADING
    ============================================= */
    .loading-state {
      text-align: center;
      padding: 80px 20px;
    }
    .loading-state .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-state p { color: var(--text-muted); }

    /* =============================================
                  TOAST
    ============================================= */
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .toast {
      padding: 14px 24px;
      border-radius: var(--radius-sm);
      color: white;
      font-weight: 500;
      font-size: 0.9rem;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
      animation: slideUp 0.3s ease;
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 280px;
    }
    .toast.success { background: #10b981; }
    .toast.error { background: #ef4444; }
    .toast.info { background: #3b82f6; }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* =============================================
                  RESPONSIVE
    ============================================= */
    @media (max-width: 1024px) {
      .widgets-grid { grid-template-columns: 1fr 1fr; }
    }

    @media (max-width: 768px) {
      .sidebar {
        transform: translateX(-100%);
        width: 280px;
      }
      .sidebar.mobile-open { transform: translateX(0); }
      .main-content { margin-left: 0; }
      .menu-toggle { display: block; }
      .top-bar { padding: 12px 16px; }
      .content-area { padding: 16px; }
      .welcome-banner { padding: 24px; }
      .welcome-banner h2 { font-size: 1.4rem; }
      .welcome-banner::after { font-size: 80px; right: 10px; }
      .widgets-grid { grid-template-columns: 1fr; }
      .quick-actions-grid { grid-template-columns: 1fr 1fr; }
      .page-title .greeting { display: none; }
      .role-badge { font-size: 0.6rem; padding: 2px 10px; }
      .user-name { display: none; }
      .spotlight-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
      .spotlight-item img { width: 60px; height: 60px; }
    }

    @media (max-width: 480px) {
      .quick-actions-grid { grid-template-columns: 1fr; }
      .top-bar-actions { gap: 8px; }
      .user-menu { padding: 4px 12px 4px 4px; }
    }

    /* =============================================
                  ACCESS DENIED
    ============================================= */
    .access-denied {
      text-align: center;
      padding: 60px 20px;
    }
    .access-denied i {
      font-size: 4rem;
      color: #ef4444;
      opacity: 0.5;
      margin-bottom: 16px;
    }
    .access-denied h2 { margin-bottom: 8px; }
    .access-denied p { color: var(--text-muted); }
  </style>
</head>
<body>

<div class="app-container">
  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo"><i class="fas fa-chart-line"></i> SoulHub</div>
    </div>
    <nav class="nav-menu" id="navMenu">
      <a href="dashboard.html" class="nav-item active" data-role="all">
        <i class="fas fa-tachometer-alt"></i><span>Dashboard</span>
      </a>
      <a href="inventory.html" class="nav-item" data-role="admin,manager">
        <i class="fas fa-boxes"></i><span>Inventory</span>
      </a>
      <a href="sales.html" class="nav-item" data-role="all">
        <i class="fas fa-shopping-cart"></i><span>Sales & POS</span>
      </a>
      <a href="customers.html" class="nav-item" data-role="admin,manager,staff">
        <i class="fas fa-users"></i><span>Customers</span>
      </a>
      <a href="reports.html" class="nav-item" data-role="admin,manager">
        <i class="fas fa-chart-bar"></i><span>Reports</span>
      </a>
      <a href="staff.html" class="nav-item" data-role="admin">
        <i class="fas fa-user-cog"></i><span>Staff Management</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <i class="fas fa-shield-alt"></i> v2.0 · Secure
    </div>
  </aside>

  <!-- ============ MAIN ============ -->
  <main class="main-content">
    <!-- Top Bar -->
    <div class="top-bar">
      <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
      <div class="page-title">
        <h1>
          <i class="fas fa-home"></i> Dashboard
          <span class="greeting" id="greetingText">— Welcome back!</span>
        </h1>
      </div>
      <div class="top-bar-actions">
        <span class="role-badge" id="roleBadge">Staff</span>
        <button class="theme-toggle" id="themeToggle"><i class="fas fa-moon"></i></button>
        <div class="user-menu" id="userMenu">
          <div class="user-avatar" id="userAvatar">U</div>
          <span class="user-name" id="userName">Loading...</span>
          <i class="fas fa-chevron-down" style="font-size:0.7rem;"></i>
        </div>
      </div>
    </div>

    <!-- Content -->
    <div class="content-area" id="contentArea">
      <div class="loading-state">
        <div class="spinner"></div>
        <p>Loading your dashboard...</p>
      </div>
    </div>
  </main>
</div>

<!-- ============ TOAST CONTAINER ============ -->
<div class="toast-container" id="toastContainer"></div>

<script>
  (function() {
    'use strict';

    // =============================================
    //  CONFIGURATION
    // =============================================
    const SUPABASE_URL = "https://ulccyfajpaiuvqovvqyz.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVsY2N5ZmFqcGFpdXZxb3Z2cXl6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwNjIwMzAsImV4cCI6MjA5NTYzODAzMH0.mLGYFgTZ3ToIJD8KAiqbxr0h42H8PYN5xh1fyvTNvqo";
    const CURRENCY = 'KSH';

    let supabase = null;
    let currentUser = null;
    let userRole = 'staff';
    let allProducts = [];
    let allSales = [];
    let allCustomers = [];

    // =============================================
    //  TOAST
    // =============================================
    function showToast(message, type = 'info') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      const icons = {
        success: 'fa-check-circle',
        error: 'fa-exclamation-circle',
        info: 'fa-info-circle'
      };
      toast.innerHTML = `<i class="fas ${icons[type] || icons.info}"></i> ${message}`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(100%)';
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    }

    // =============================================
    //  ROLE-BASED ACCESS CONTROL
    // =============================================
    function hasAccess(role, requiredRoles) {
      if (requiredRoles === 'all') return true;
      const roles = requiredRoles.split(',');
      return roles.includes(role);
    }

    function updateNavigation(role) {
      document.querySelectorAll('.nav-item').forEach(item => {
        const required = item.dataset.role || 'all';
        if (hasAccess(role, required)) {
          item.classList.remove('hidden');
        } else {
          item.classList.add('hidden');
        }
      });
    }

    // =============================================
    //  GREETING
    // =============================================
    function getGreeting() {
      const hour = new Date().getHours();
      if (hour < 12) return 'Good morning 🌅';
      if (hour < 17) return 'Good afternoon ☀️';
      return 'Good evening 🌙';
    }

    // =============================================
    //  INIT
    // =============================================
    async function init() {
      try {
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const { data: { session } } = await supabase.auth.getSession();
        if (!session) { window.location.href = 'login.html'; return; }
        currentUser = session.user;

        // Get user profile with role
        const { data: profile } = await supabase
          .from('profiles')
          .select('*')
          .eq('id', currentUser.id)
          .single();

        userRole = profile?.role || 'staff';
        const name = profile?.full_name || currentUser.email?.split('@')[0] || 'User';

        // Update UI
        document.getElementById('userName').textContent = name;
        document.getElementById('userAvatar').textContent = name.charAt(0).toUpperCase();
        document.getElementById('roleBadge').textContent = userRole.charAt(0).toUpperCase() + userRole.slice(1);
        document.getElementById('greetingText').textContent = `— ${getGreeting()}, ${name}!`;

        // Update navigation based on role
        updateNavigation(userRole);

        // Load data
        await loadData();

        // Setup events
        setupEventListeners();

      } catch (err) {
        console.error('Init error:', err);
        showToast('Failed to initialize: ' + err.message, 'error');
      }
    }

    // =============================================
    //  LOAD DATA
    // =============================================
    async function loadData() {
      try {
        showLoading(true);

        const [productsRes, salesRes, customersRes] = await Promise.all([
          supabase.from('products').select('*').limit(50),
          supabase.from('sales').select('*').order('sale_date', { ascending: false }).limit(100),
          supabase.from('customers').select('*').limit(50)
        ]);

        if (productsRes.error) throw new Error(productsRes.error.message);
        if (salesRes.error) throw new Error(salesRes.error.message);
        if (customersRes.error) throw new Error(customersRes.error.message);

        allProducts = productsRes.data || [];
        allSales = salesRes.data || [];
        allCustomers = customersRes.data || [];

        renderDashboard();

      } catch (err) {
        console.error('Load error:', err);
        showToast('Failed to load data: ' + err.message, 'error');
      } finally {
        showLoading(false);
      }
    }

    // =============================================
    //  RENDER DASHBOARD
    // =============================================
    function renderDashboard() {
      const today = new Date().toDateString();
      const todaySales = allSales.filter(s => new Date(s.sale_date).toDateString() === today);
      const todayRevenue = todaySales.reduce((sum, s) => sum + (s.total_amount || 0), 0);
      const todayCount = todaySales.length;

      const lowStockItems = allProducts.filter(p => p.stock_quantity <= (p.low_stock_threshold || 5));
      const totalProducts = allProducts.length;
      const totalCustomers = allCustomers.length;

      // Top products by sales (approximate)
      const productSales = {};
      allSales.forEach(s => {
        // Since we don't have sales_items, approximate by sku if available
        if (s.sku) {
          if (!productSales[s.sku]) productSales[s.sku] = 0;
          productSales[s.sku] += s.total_amount || 0;
        }
      });
      const topProducts = Object.entries(productSales)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 5)
        .map(([sku]) => allProducts.find(p => p.sku === sku))
        .filter(Boolean);

      // Recent activity (last 5 sales)
      const recentActivity = allSales.slice(0, 5);

      // Build widgets based on role
      let widgetsHtml = '';

      // Everyone sees: Today's Revenue, Today's Sales, Low Stock Alert
      widgetsHtml += `
        <div class="widget">
          <div class="widget-header">
            <h3><i class="fas fa-coins"></i> Today's Revenue</h3>
            <span class="widget-action">details →</span>
          </div>
          <div class="widget-value">${CURRENCY} ${todayRevenue.toFixed(2)}</div>
          <div class="widget-sub">${todayCount} transactions today</div>
        </div>

        <div class="widget">
          <div class="widget-header">
            <h3><i class="fas fa-shopping-bag"></i> Today's Sales</h3>
            <span class="widget-action">view all →</span>
          </div>
          <div class="widget-value">${todayCount}</div>
          <div class="widget-sub">${todayCount > 0 ? '🟢 Active day' : '⚪ No sales yet'}</div>
        </div>

        <div class="widget">
          <div class="widget-header">
            <h3><i class="fas fa-exclamation-triangle"></i> Low Stock</h3>
            <span class="widget-action" onclick="window.location.href='inventory.html'">manage →</span>
          </div>
          <div class="widget-value" style="color:${lowStockItems.length > 0 ? '#ef4444' : '#10b981'};">${lowStockItems.length}</div>
          <div class="widget-sub">${lowStockItems.length > 0 ? '⚠️ Needs attention' : '✅ All stock levels good'}</div>
        </div>
      `;

      // Admin/Manager see extra widgets
      if (userRole === 'admin' || userRole === 'manager') {
        widgetsHtml += `
          <div class="widget">
            <div class="widget-header">
              <h3><i class="fas fa-users"></i> Customers</h3>
              <span class="widget-action" onclick="window.location.href='customers.html'">view →</span>
            </div>
            <div class="widget-value">${totalCustomers}</div>
            <div class="widget-sub">${allCustomers.length > 0 ? '🎯 ' + allCustomers.length + ' registered' : 'No customers yet'}</div>
          </div>

          <div class="widget">
            <div class="widget-header">
              <h3><i class="fas fa-box"></i> Products</h3>
              <span class="widget-action" onclick="window.location.href='inventory.html'">manage →</span>
            </div>
            <div class="widget-value">${totalProducts}</div>
            <div class="widget-sub">${totalProducts > 0 ? '📦 ' + totalProducts + ' items in catalog' : 'No products yet'}</div>
          </div>
        `;
      }

      // Build activity feed
      let activityHtml = '';
      if (recentActivity.length > 0) {
        activityHtml = recentActivity.map(s => {
          const date = new Date(s.sale_date);
          const timeStr = date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
          return `
            <li>
              <div class="activity-icon sale"><i class="fas fa-shopping-cart"></i></div>
              <div class="activity-content">
                <div class="title">Sale completed</div>
                <div class="time">${timeStr} · ${s.payment_method || 'cash'}</div>
              </div>
              <div class="activity-amount">${CURRENCY} ${(s.total_amount || 0).toFixed(2)}</div>
            </li>
          `;
        }).join('');
      } else {
        activityHtml = `
          <li style="justify-content:center; color:var(--text-muted); padding:20px;">
            No recent activity
          </li>
        `;
      }

      // Build spotlight (top products)
      let spotlightHtml = '';
      if (topProducts.length > 0) {
        spotlightHtml = topProducts.map(p => `
          <div class="spotlight-item" onclick="window.location.href='inventory.html'">
            ${p.image_url 
              ? `<img src="${p.image_url}" alt="${p.name}" onerror="this.style.display='none';">`
              : `<div style="width:80px;height:80px;border-radius:12px;background:var(--border);display:flex;align-items:center;justify-content:center;margin:0 auto 8px;font-size:2rem;color:#ccc;"><i class="fas fa-image"></i></div>`
            }
            <div class="name">${p.name}</div>
            <div class="price">${CURRENCY} ${(p.selling_price || 0).toFixed(2)}</div>
          </div>
        `).join('');
      } else {
        spotlightHtml = `
          <div style="grid-column:1/-1;text-align:center;color:var(--text-muted);padding:20px;">
            No products with sales yet
          </div>
        `;
      }

      // Build quick actions based on role
      let quickActions = `
        <a href="sales.html" class="quick-action-card">
          <span class="icon"><i class="fas fa-cash-register"></i></span>
          <h4>New Sale</h4>
          <p>Process a transaction</p>
        </a>
        <a href="inventory.html" class="quick-action-card">
          <span class="icon"><i class="fas fa-plus-circle"></i></span>
          <h4>Add Product</h4>
          <p>Add to inventory</p>
        </a>
      `;

      if (userRole === 'admin' || userRole === 'manager') {
        quickActions += `
          <a href="staff.html" class="quick-action-card">
            <span class="icon"><i class="fas fa-user-plus"></i></span>
            <h4>Manage Staff</h4>
            <p>Team management</p>
          </a>
        `;
      }

      quickActions += `
        <a href="reports.html" class="quick-action-card">
          <span class="icon"><i class="fas fa-file-alt"></i></span>
          <h4>View Reports</h4>
          <p>Sales analytics</p>
        </a>
      `;

      const html = `
        <!-- Welcome Banner -->
        <div class="welcome-banner">
          <h2>👋 Welcome to SoulHub</h2>
          <p>You're logged in as <strong>${userRole}</strong> · Here's what's happening today</p>
          <span class="quick-tip">
            <i class="fas fa-lightbulb"></i> 
            ${userRole === 'admin' ? 'You have full access to manage everything' :
              userRole === 'manager' ? 'You can manage inventory, sales, and customers' :
              'Process sales and manage customers'}
          </span>
        </div>

        <!-- Quick Actions -->
        <div class="quick-actions-grid">
          ${quickActions}
        </div>

        <!-- Widgets -->
        <div class="widgets-grid">
          ${widgetsHtml}
        </div>

        <!-- Bottom Row: Activity + Spotlight -->
        <div class="widgets-grid" style="grid-template-columns: 1fr 1fr;">
          <div class="widget">
            <div class="widget-header">
              <h3><i class="fas fa-clock"></i> Recent Activity</h3>
              <span class="widget-action">view all →</span>
            </div>
            <ul class="activity-feed">
              ${activityHtml}
            </ul>
          </div>

          <div class="widget">
            <div class="widget-header">
              <h3><i class="fas fa-star"></i> Top Products</h3>
              <span class="widget-action" onclick="window.location.href='reports.html'">view all →</span>
            </div>
            <div class="spotlight-grid">
              ${spotlightHtml}
            </div>
          </div>
        </div>
      `;

      document.getElementById('contentArea').innerHTML = html;
    }

    // =============================================
    //  UI HELPERS
    // =============================================
    function showLoading(show) {
      const loading = document.querySelector('.loading-state');
      const content = document.getElementById('contentArea');
      if (show) {
        content.innerHTML = `
          <div class="loading-state">
            <div class="spinner"></div>
            <p>Loading your dashboard...</p>
          </div>
        `;
      }
    }

    // =============================================
    //  EVENT LISTENERS
    // =============================================
    function setupEventListeners() {
      // Theme toggle
      document.getElementById('themeToggle').addEventListener('click', function() {
        document.body.classList.toggle('dark-mode');
        const icon = this.querySelector('i');
        icon.classList.toggle('fa-moon');
        icon.classList.toggle('fa-sun');
        localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
      });

      if (localStorage.getItem('darkMode') === 'true') {
        document.body.classList.add('dark-mode');
        document.querySelector('#themeToggle i').classList.replace('fa-moon', 'fa-sun');
      }

      // Mobile menu
      document.getElementById('menuToggle').addEventListener('click', function() {
        document.getElementById('sidebar').classList.toggle('mobile-open');
      });

      document.addEventListener('click', function(e) {
        const sidebar = document.getElementById('sidebar');
        const toggle = document.getElementById('menuToggle');
        if (window.innerWidth <= 768) {
          if (!sidebar.contains(e.target) && !toggle.contains(e.target)) {
            sidebar.classList.remove('mobile-open');
          }
        }
      });

      // Logout
      document.getElementById('userMenu').addEventListener('click', async function() {
        if (confirm('Are you sure you want to logout?')) {
          await supabase.auth.signOut();
          window.location.href = 'login.html';
        }
      });

      // Auto-refresh every 60 seconds
      setInterval(async () => {
        await loadData();
      }, 60000);
    }

    // =============================================
    //  START
    // =============================================
    document.addEventListener('DOMContentLoaded', init);
  })();
</script>
</body>
</html>
