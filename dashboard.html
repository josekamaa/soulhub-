<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SoulHub · Visual Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@300;400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* =============================================
                  CSS VARIABLES
    ============================================= */
    :root {
      --primary: #C49A6C;
      --primary-dark: #A2794C;
      --primary-light: #F0D5B0;
      --primary-glow: rgba(196,154,108,0.25);
      --bg: #F5F0EB;
      --bg-card: #FFFFFF;
      --text: #1E1B18;
      --text-muted: #6B5E54;
      --border: #E9E2D8;
      --shadow: 0 8px 32px rgba(0,0,0,0.08);
      --shadow-hover: 0 12px 48px rgba(0,0,0,0.15);
      --radius: 24px;
      --radius-sm: 14px;
      --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      --font: 'Inter', sans-serif;
      --font-display: 'Playfair Display', serif;
    }

    .dark-mode {
      --bg: #0d0d0d;
      --bg-card: #1a1a1a;
      --text: #F0EAE3;
      --text-muted: #A8998E;
      --border: #2a2a2a;
      --shadow: 0 8px 32px rgba(0,0,0,0.4);
      --shadow-hover: 0 12px 48px rgba(0,0,0,0.6);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      transition: var(--transition);
      overflow-x: hidden;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--border); }
    ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 8px; }

    /* =============================================
                  SIDEBAR
    ============================================= */
    .app-container { display: flex; min-height: 100vh; }

    .sidebar {
      width: 280px;
      background: var(--bg-card);
      border-right: 1px solid var(--border);
      position: fixed;
      height: 100vh;
      overflow-y: auto;
      transition: transform 0.3s ease-in-out;
      z-index: 1000;
      padding-bottom: 40px;
    }

    .sidebar-header {
      padding: 24px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-family: var(--font-display);
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(135deg, #2C241E 0%, var(--primary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo i { -webkit-text-fill-color: var(--primary); }

    .nav-menu { padding: 20px 16px; }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      margin-bottom: 4px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: var(--transition);
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 500;
      position: relative;
    }
    .nav-item:hover { background: var(--primary-light); color: var(--primary); }
    .nav-item.active { background: var(--primary); color: white; }
    .nav-item i { width: 24px; font-size: 1.2rem; }
    .nav-item.hidden { display: none; }
    .nav-item .badge-dot {
      position: absolute;
      right: 16px;
      width: 8px;
      height: 8px;
      background: #ef4444;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }

    .sidebar-footer {
      padding: 20px 24px;
      border-top: 1px solid var(--border);
      font-size: 0.7rem;
      color: var(--text-muted);
      position: absolute;
      bottom: 0;
      width: 100%;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    /* =============================================
                  TOP BAR
    ============================================= */
    .main-content {
      flex: 1;
      margin-left: 280px;
      min-height: 100vh;
    }

    .top-bar {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 12px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 99;
      backdrop-filter: blur(16px);
      background: rgba(255,255,255,0.85);
    }
    .dark-mode .top-bar { background: rgba(26,26,26,0.85); }

    .menu-toggle {
      display: none;
      cursor: pointer;
      font-size: 1.5rem;
      color: var(--text-muted);
      background: none;
      border: none;
    }
    .menu-toggle:hover { color: var(--primary); }

    .top-bar-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .top-bar-left .greeting {
      font-size: 0.9rem;
      color: var(--text-muted);
    }
    .top-bar-left .greeting strong { color: var(--text); }

    .top-bar-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .role-badge {
      padding: 4px 14px;
      border-radius: 40px;
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: var(--primary-light);
      color: var(--primary-dark);
    }
    .dark-mode .role-badge { background: #2a2a2a; color: #C49A6C; }

    .theme-toggle {
      cursor: pointer;
      font-size: 1.1rem;
      padding: 8px 10px;
      border-radius: 50%;
      transition: var(--transition);
      background: none;
      border: none;
      color: var(--text-muted);
    }
    .theme-toggle:hover { background: var(--border); }

    .user-menu {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      padding: 4px 14px 4px 4px;
      border-radius: 40px;
      background: var(--border);
      transition: var(--transition);
    }
    .user-menu:hover { background: var(--primary-light); }
    .user-avatar {
      width: 34px;
      height: 34px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 0.8rem;
    }
    .user-name { font-weight: 500; font-size: 0.85rem; }

    /* =============================================
                  CONTENT AREA
    ============================================= */
    .content-area {
      padding: 24px 32px 40px;
      max-width: 1440px;
      margin: 0 auto;
    }

    /* =============================================
                  HERO BANNER
    ============================================= */
    .hero-banner {
      position: relative;
      border-radius: var(--radius);
      padding: 36px 44px;
      margin-bottom: 28px;
      overflow: hidden;
      min-height: 180px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(135deg, #2C241E 0%, var(--primary-dark) 100%);
      color: white;
    }
    .hero-banner .hero-content { position: relative; z-index: 2; }
    .hero-banner .hero-content h2 {
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 700;
    }
    .hero-banner .hero-content p {
      opacity: 0.85;
      margin-top: 4px;
      font-size: 1rem;
    }
    .hero-banner .hero-content .hero-tip {
      display: inline-block;
      margin-top: 12px;
      background: rgba(255,255,255,0.15);
      padding: 6px 18px;
      border-radius: 40px;
      font-size: 0.8rem;
      backdrop-filter: blur(4px);
    }
    .hero-banner .hero-emoji {
      font-size: 100px;
      opacity: 0.12;
      position: absolute;
      right: 30px;
      bottom: -10px;
      z-index: 1;
    }
    .hero-banner .hero-stats {
      display: flex;
      gap: 32px;
      position: relative;
      z-index: 2;
    }
    .hero-banner .hero-stats .stat {
      text-align: center;
    }
    .hero-banner .hero-stats .stat .number {
      font-size: 1.8rem;
      font-weight: 700;
    }
    .hero-banner .hero-stats .stat .label {
      font-size: 0.7rem;
      opacity: 0.7;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* =============================================
                  SECTION TITLES
    ============================================= */
    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 28px 0 16px;
    }
    .section-title h3 {
      font-size: 1.1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-title h3 i { color: var(--primary); }
    .section-title .see-all {
      font-size: 0.8rem;
      color: var(--primary);
      cursor: pointer;
      font-weight: 500;
      transition: var(--transition);
    }
    .section-title .see-all:hover { text-decoration: underline; }

    /* =============================================
                  QUICK ACTION TILES
    ============================================= */
    .quick-tiles {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }

    .quick-tile {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 20px 16px;
      text-align: center;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: var(--shadow);
      text-decoration: none;
      color: var(--text);
    }
    .quick-tile:hover {
      transform: translateY(-6px);
      border-color: var(--primary);
      box-shadow: var(--shadow-hover);
    }
    .quick-tile .tile-icon {
      font-size: 2.2rem;
      color: var(--primary);
      margin-bottom: 8px;
      display: block;
    }
    .quick-tile .tile-icon .fa-stack { font-size: 1.8rem; }
    .quick-tile h4 { font-size: 0.85rem; font-weight: 600; }
    .quick-tile p { font-size: 0.7rem; color: var(--text-muted); margin-top: 2px; }

    /* =============================================
                  VISUAL CARDS GRID
    ============================================= */
    .visual-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 24px;
    }

    .visual-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: var(--transition);
      box-shadow: var(--shadow);
    }
    .visual-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-hover);
    }

    .visual-card .card-image {
      width: 100%;
      height: 160px;
      object-fit: cover;
      background: var(--border);
    }
    .visual-card .card-image-placeholder {
      width: 100%;
      height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--primary-light), var(--border));
      font-size: 3rem;
      color: var(--primary);
    }
    .visual-card .card-body {
      padding: 16px 20px 20px;
    }
    .visual-card .card-body .card-title {
      font-weight: 600;
      font-size: 1rem;
    }
    .visual-card .card-body .card-sub {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .visual-card .card-body .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    .visual-card .card-body .card-meta .price {
      font-weight: 700;
      color: var(--primary);
      font-size: 1.1rem;
    }
    .visual-card .card-body .card-meta .stock {
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    .visual-card .card-body .card-meta .stock .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 4px;
    }
    .visual-card .card-body .card-meta .stock .dot.green { background: #10b981; }
    .visual-card .card-body .card-meta .stock .dot.yellow { background: #f59e0b; }
    .visual-card .card-body .card-meta .stock .dot.red { background: #ef4444; }

    /* =============================================
                  ACTIVITY STRIP
    ============================================= */
    .activity-strip {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 24px;
      box-shadow: var(--shadow);
      margin-bottom: 24px;
    }
    .activity-strip .strip-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .activity-strip .strip-header h4 {
      font-size: 0.9rem;
      font-weight: 600;
    }
    .activity-strip .strip-items {
      display: flex;
      gap: 20px;
      overflow-x: auto;
      padding: 4px 0;
    }
    .activity-strip .strip-items::-webkit-scrollbar { height: 3px; }
    .activity-strip .strip-items::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 4px; }
    .activity-item {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      padding: 8px 16px;
      background: var(--bg);
      border-radius: var(--radius-sm);
      min-width: 200px;
    }
    .dark-mode .activity-item { background: #222; }
    .activity-item .a-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .activity-item .a-icon.sale { background: #10b98120; color: #10b981; }
    .activity-item .a-icon.stock { background: #f59e0b20; color: #f59e0b; }
    .activity-item .a-icon.user { background: #3b82f620; color: #3b82f6; }
    .activity-item .a-info { flex: 1; }
    .activity-item .a-info .a-title { font-weight: 500; font-size: 0.85rem; }
    .activity-item .a-info .a-time { font-size: 0.7rem; color: var(--text-muted); }
    .activity-item .a-amount { font-weight: 600; font-size: 0.9rem; }

    /* =============================================
                  LOADING
    ============================================= */
    .loading-state {
      text-align: center;
      padding: 80px 20px;
    }
    .loading-state .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* =============================================
                  TOAST
    ============================================= */
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .toast {
      padding: 14px 24px;
      border-radius: var(--radius-sm);
      color: white;
      font-weight: 500;
      font-size: 0.9rem;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
      animation: slideUp 0.3s ease;
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 280px;
    }
    .toast.success { background: #10b981; }
    .toast.error { background: #ef4444; }
    .toast.info { background: #3b82f6; }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* =============================================
                  RESPONSIVE
    ============================================= */
    @media (max-width: 1024px) {
      .visual-grid { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
    }

    @media (max-width: 768px) {
      .sidebar {
        transform: translateX(-100%);
        width: 280px;
      }
      .sidebar.mobile-open { transform: translateX(0); }
      .main-content { margin-left: 0; }
      .menu-toggle { display: block; }
      .top-bar { padding: 10px 16px; }
      .content-area { padding: 16px; }
      .hero-banner { padding: 24px; flex-direction: column; text-align: center; min-height: auto; }
      .hero-banner .hero-content h2 { font-size: 1.4rem; }
      .hero-banner .hero-stats { gap: 16px; margin-top: 12px; flex-wrap: wrap; justify-content: center; }
      .hero-banner .hero-stats .stat .number { font-size: 1.2rem; }
      .hero-banner .hero-emoji { font-size: 60px; right: 10px; bottom: -5px; }
      .visual-grid { grid-template-columns: 1fr 1fr; }
      .quick-tiles { grid-template-columns: 1fr 1fr; }
      .activity-strip .strip-items { gap: 12px; }
      .activity-item { min-width: 160px; padding: 6px 12px; }
      .top-bar-left .greeting { display: none; }
      .user-name { display: none; }
      .role-badge { font-size: 0.55rem; padding: 2px 10px; }
    }

    @media (max-width: 480px) {
      .visual-grid { grid-template-columns: 1fr; }
      .quick-tiles { grid-template-columns: 1fr; }
      .hero-banner .hero-stats { flex-direction: column; gap: 8px; }
      .activity-item { min-width: 140px; }
      .top-bar-actions { gap: 6px; }
    }
  </style>
</head>

<script>

    // =============================================

    function showToast(message, type = 'info') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', info: 'fa-info-circle' };
      toast.innerHTML = `<i class="fas ${icons[type] || icons.info}"></i> ${message}`;
      container.appendChild(toast);

    // =============================================
    //  ROLE-BASED ACCESS
    // =============================================
    function hasAccess(role, required) {
      if (required === 'all') return true;
      return required.split(',').includes(role);
    }

    function updateNavigation(role) {
      document.querySelectorAll('.nav-item').forEach(item => {
        const required = item.dataset.role || 'all';
        item.classList.toggle('hidden', !hasAccess(role, required));
      });
    }

    // =============================================
    //  LIVE CLOCK
    // =============================================
    function updateClock() {
      const now = new Date();
      document.getElementById('liveTime').textContent = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
    }
    setInterval(updateClock, 1000);

    // =============================================
    //  GREETING
    // =============================================
    function getGreeting() {
      const h = new Date().getHours();
      if (h < 12) return '🌅 Good morning';
      if (h < 17) return '☀️ Good afternoon';
      return '🌙 Good evening';
    }

    // =============================================
    //  INIT
    // =============================================
    async function init() {
      try {
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const { data: { session } } = await supabase.auth.getSession();
        if (!session) { window.location.href = 'login.html'; return; }
        currentUser = session.user;

        const { data: profile } = await supabase.from('profiles').select('*').eq('id', currentUser.id).single();
        userRole = profile?.role || 'staff';
        const name = profile?.full_name || currentUser.email?.split('@')[0] || 'User';

        document.getElementById('userName').textContent = name;
        document.getElementById('userAvatar').textContent = name.charAt(0).toUpperCase();
        document.getElementById('roleBadge').textContent = userRole.charAt(0).toUpperCase() + userRole.slice(1);
        document.getElementById('greetingText').innerHTML = `${getGreeting()}, <strong>${name}</strong>`;

        updateNavigation(userRole);
        await loadData();
        setupEvents();

      } catch (err) {
        console.error('Init error:', err);
        showToast('Failed to initialize: ' + err.message, 'error');
      }
    }

    // =============================================
    //  LOAD DATA
    // =============================================
    async function loadData() {
      try {
        const [productsRes, salesRes, customersRes] = await Promise.all([
          supabase.from('products').select('*').limit(30),
          supabase.from('sales').select('*').order('sale_date', { ascending: false }).limit(50),
          supabase.from('customers').select('*').limit(30)
        ]);

        if (productsRes.error) throw new Error(productsRes.error.message);
        if (salesRes.error) throw new Error(salesRes.error.message);
        if (customersRes.error) throw new Error(customersRes.error.message);

        allProducts = productsRes.data || [];
        allSales = salesRes.data || [];
        allCustomers = customersRes.data || [];

        renderDashboard();
      } catch (err) {
        console.error('Load error:', err);
        showToast('Failed to load data: ' + err.message, 'error');
      }
    }

    // =============================================
    //  RENDER DASHBOARD - VISUAL FIRST
    // =============================================
    function renderDashboard() {
      const today = new Date().toDateString();
      const todaySales = allSales.filter(s => new Date(s.sale_date).toDateString() === today);
      const todayRevenue = todaySales.reduce((sum, s) => sum + (s.total_amount || 0), 0);
      const todayCount = todaySales.length;

      const lowStockItems = allProducts.filter(p => p.stock_quantity <= (p.low_stock_threshold || 5));
      const totalProducts = allProducts.length;
      const totalCustomers = allCustomers.length;

      // Show stock dot if low stock
      const dot = document.getElementById('stockDot');
      if (lowStockItems.length > 0) dot.style.display = 'block'; else dot.style.display = 'none';

      // Top products with images
      const productSales = {};
      allSales.forEach(s => {
        if (s.sku) {
          if (!productSales[s.sku]) productSales[s.sku] = 0;
          productSales[s.sku] += s.total_amount || 0;
        }
      });
      const topProducts = Object.entries(productSales)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 6)
        .map(([sku]) => allProducts.find(p => p.sku === sku))
        .filter(Boolean);

      // Build visual cards
      let productCards = '';
      if (topProducts.length > 0) {
        productCards = topProducts.map(p => `
          <div class="visual-card" onclick="window.location.href='inventory.html'">
            ${p.image_url 
              ? `<img src="${p.image_url}" class="card-image" alt="${p.name}" onerror="this.onerror=null;this.outerHTML='<div class=\\'card-image-placeholder\\'><i class=\\'fas fa-image\\'></i></div>';">`
              : `<div class="card-image-placeholder"><i class="fas fa-image"></i></div>`
            }
            <div class="card-body">
              <div class="card-title">${p.name}</div>
              <div class="card-sub">${p.sku} · ${p.category || 'Uncategorized'}</div>
              <div class="card-meta">
                <span class="price">${CURRENCY} ${(p.selling_price || 0).toFixed(2)}</span>
                <span class="stock">
                  <span class="dot ${p.stock_quantity <= (p.low_stock_threshold || 5) ? 'red' : p.stock_quantity <= (p.low_stock_threshold || 5) * 2 ? 'yellow' : 'green'}"></span>
                  ${p.stock_quantity || 0} in stock
                </span>
              </div>
            </div>
          </div>
        `).join('');
      } else {
        productCards = `
          <div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text-muted);">
            <i class="fas fa-box-open" style="font-size:2.5rem;display:block;margin-bottom:12px;opacity:0.3;"></i>
            No products sold yet. Start making sales!
          </div>
        `;
      }

      // Build activity strip
      let activityItems = '';
      if (allSales.length > 0) {
        activityItems = allSales.slice(0, 8).map(s => {
          const date = new Date(s.sale_date);
          const timeStr = date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
          return `
            <div class="activity-item">
              <div class="a-icon sale"><i class="fas fa-shopping-cart"></i></div>
              <div class="a-info">
                <div class="a-title">Sale</div>
                <div class="a-time">${timeStr} · ${s.payment_method || 'cash'}</div>
              </div>
              <div class="a-amount">${CURRENCY} ${(s.total_amount || 0).toFixed(2)}</div>
            </div>
          `;
        }).join('');
      } else {
        activityItems = `<div style="padding:12px;color:var(--text-muted);text-align:center;width:100%;">No recent activity</div>`;
      }

      // Quick tiles based on role
      let quickTiles = `
        <a href="sales.html" class="quick-tile">
          <span class="tile-icon"><i class="fas fa-cash-register"></i></span>
          <h4>New Sale</h4>
          <p>Process transaction</p>
        </a>
        <a href="inventory.html" class="quick-tile">
          <span class="tile-icon"><i class="fas fa-plus-circle"></i></span>
          <h4>Add Product</h4>
          <p>Add to inventory</p>
        </a>
      `;
      if (userRole === 'admin' || userRole === 'manager') {
        quickTiles += `
          <a href="staff.html" class="quick-tile">
            <span class="tile-icon"><i class="fas fa-user-plus"></i></span>
            <h4>Manage Staff</h4>
            <p>Team management</p>
          </a>
        `;
      }
      quickTiles += `
        <a href="reports.html" class="quick-tile">
          <span class="tile-icon"><i class="fas fa-file-alt"></i></span>
          <h4>Reports</h4>
          <p>Analytics & insights</p>
        </a>
      `;

      const html = `
        <!-- HERO BANNER -->
        <div class="hero-banner">
          <div class="hero-content">
            <h2>👟 SoulHub Dashboard</h2>
            <p>${todayCount} sales today · ${CURRENCY} ${todayRevenue.toFixed(2)} revenue</p>
            <span class="hero-tip">
              <i class="fas fa-lightbulb"></i> 
              ${lowStockItems.length > 0 ? `${lowStockItems.length} items need restocking` : 'All stock levels are healthy!'}
            </span>
          </div>
          <div class="hero-emoji">👟</div>
          <div class="hero-stats">
            <div class="stat">
              <div class="number">${todayCount}</div>
              <div class="label">Today's Sales</div>
            </div>
            <div class="stat">
              <div class="number">${totalCustomers}</div>
              <div class="label">Customers</div>
            </div>
            <div class="stat">
              <div class="number">${totalProducts}</div>
              <div class="label">Products</div>
            </div>
          </div>
        </div>

        <!-- QUICK TILES -->
        <div class="quick-tiles">${quickTiles}</div>

        <!-- SECTION: TOP PRODUCTS -->
        <div class="section-title">
          <h3><i class="fas fa-star"></i> Top Selling Products</h3>
          <span class="see-all" onclick="window.location.href='inventory.html'">View All →</span>
        </div>
        <div class="visual-grid">${productCards}</div>

        <!-- SECTION: RECENT ACTIVITY -->
        <div class="section-title">
          <h3><i class="fas fa-clock"></i> Recent Activity</h3>
          <span class="see-all" onclick="window.location.href='sales.html'">View All →</span>
        </div>
        <div class="activity-strip">
          <div class="strip-items">${activityItems}</div>
        </div>
      `;

      document.getElementById('contentArea').innerHTML = html;
    }

    // =============================================
    //  EVENTS
    // =============================================
    function setupEvents() {
      // Theme
      document.getElementById('themeToggle').addEventListener('click', function() {
        document.body.classList.toggle('dark-mode');
        const icon = this.querySelector('i');
        icon.classList.toggle('fa-moon');
        icon.classList.toggle('fa-sun');
        localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
      });
      if (localStorage.getItem('darkMode') === 'true') {
        document.body.classList.add('dark-mode');
        document.querySelector('#themeToggle i').classList.replace('fa-moon', 'fa-sun');
      }

      // Mobile menu
      document.getElementById('menuToggle').addEventListener('click', function() {
        document.getElementById('sidebar').classList.toggle('mobile-open');
      });
      document.addEventListener('click', function(e) {
        const sidebar = document.getElementById('sidebar');
        const toggle = document.getElementById('menuToggle');
        if (window.innerWidth <= 768 && !sidebar.contains(e.target) && !toggle.contains(e.target)) {
          sidebar.classList.remove('mobile-open');
        }
      });

      // Logout
      document.getElementById('userMenu').addEventListener('click', async function() {
        if (confirm('Logout?')) { await supabase.auth.signOut(); window.location.href = 'login.html'; }
      });

      // Auto-refresh
      setInterval(loadData, 60000);
    }

    // =============================================
    //  START
    // =============================================
    document.addEventListener('DOMContentLoaded', init);
  })();
</script>
</body>
</html>
