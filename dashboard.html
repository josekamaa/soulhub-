<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SoulHub | Dashboard - Shoe Store Management</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #FEFCF8;
      color: #1E1B18;
      overflow-x: hidden;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #E9E2D8;
    }
    ::-webkit-scrollbar-thumb {
      background: #C8A27A;
      border-radius: 8px;
    }

    /* Navbar */
    .navbar {
      background: rgba(254, 252, 248, 0.98);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(0,0,0,0.05);
      padding: 16px 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 24px;
    }

    .nav-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      font-weight: 700;
      background: linear-gradient(135deg, #2C241E 0%, #A2794C 100%);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .logo i {
      background: none;
      color: #C49A6C;
      font-size: 1.4rem;
    }

    .user-menu {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #F9F4ED;
      padding: 8px 16px;
      border-radius: 40px;
    }

    .user-avatar {
      width: 36px;
      height: 36px;
      background: #C49A6C;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 600;
    }

    .logout-btn {
      background: transparent;
      border: 1px solid #E9E2D8;
      padding: 8px 20px;
      border-radius: 40px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
    }

    .logout-btn:hover {
      background: #C23D2E;
      border-color: #C23D2E;
      color: white;
    }

    /* Dashboard Content */
    .dashboard-header {
      margin: 32px 0 24px;
    }

    .dashboard-header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      font-weight: 600;
    }

    .welcome-badge {
      color: #C49A6C;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 24px;
      margin-bottom: 40px;
    }

    .stat-card {
      background: white;
      border-radius: 24px;
      padding: 24px;
      border: 1px solid #F0EAE3;
      transition: all 0.3s ease;
    }

    .stat-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px -8px rgba(0,0,0,0.1);
    }

    .stat-icon {
      font-size: 2rem;
      color: #C49A6C;
      margin-bottom: 16px;
    }

    .stat-value {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .stat-label {
      color: #6B5E54;
      font-size: 0.9rem;
    }

    .quick-actions {
      background: #F9F4ED;
      border-radius: 28px;
      padding: 32px;
      margin-bottom: 40px;
    }

    .quick-actions h3 {
      margin-bottom: 20px;
      font-size: 1.3rem;
    }

    .action-buttons {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    .action-btn {
      background: white;
      border: none;
      padding: 12px 24px;
      border-radius: 40px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'Inter', sans-serif;
    }

    .action-btn:hover {
      background: #1E1B18;
      color: white;
      transform: translateY(-2px);
    }

    .recent-section {
      background: white;
      border-radius: 28px;
      padding: 32px;
      border: 1px solid #F0EAE3;
    }

    .recent-section h3 {
      margin-bottom: 20px;
    }

    .profile-card {
      background: linear-gradient(135deg, #1E1B18 0%, #2C241E 100%);
      border-radius: 24px;
      padding: 24px;
      color: white;
      margin-bottom: 24px;
    }

    .profile-card h3 {
      margin-bottom: 16px;
      font-family: 'Playfair Display', serif;
    }

    .profile-details {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
    }

    .profile-detail-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 0;
    }

    .profile-detail-item i {
      width: 24px;
      color: #C49A6C;
    }

    .loading-screen {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      gap: 20px;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 3px solid #E9E2D8;
      border-top-color: #C49A6C;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error-screen {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      gap: 20px;
      text-align: center;
      padding: 20px;
    }

    .error-screen i {
      font-size: 4rem;
      color: #C23D2E;
    }

    .error-screen button {
      margin-top: 20px;
      padding: 12px 24px;
      background: #1E1B18;
      color: white;
      border: none;
      border-radius: 40px;
      cursor: pointer;
    }

    @media (max-width: 768px) {
      .nav-container {
        flex-direction: column;
        gap: 16px;
      }
      .stats-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div id="loadingScreen" class="loading-screen">
    <div class="spinner"></div>
    <p>Loading your dashboard...</p>
  </div>

  <div id="errorScreen" class="error-screen" style="display: none;">
    <i class="fas fa-exclamation-circle"></i>
    <h2>Unable to Load Dashboard</h2>
    <p id="errorMessage">Something went wrong. Please try again.</p>
    <button onclick="window.location.href = 'login.html'">Go to Login</button>
  </div>

  <div id="dashboardContent" style="display: none;">
    <nav class="navbar">
      <div class="container nav-container">
        <div class="logo">
          <i class="fas fa-chart-line"></i> SoulHub
        </div>
        <div class="user-menu">
          <div class="user-info">
            <div class="user-avatar" id="userAvatar">JD</div>
            <span id="userName">Loading...</span>
          </div>
          <button class="logout-btn" id="logoutBtn">
            <i class="fas fa-sign-out-alt"></i> Logout
          </button>
        </div>
      </div>
    </nav>

    <main class="container">
      <div class="dashboard-header">
        <h1>Welcome back, <span class="welcome-badge" id="welcomeName">...</span> 👋</h1>
        <p style="color: #6B5E54; margin-top: 8px;">Here's what's happening with your shoe store today.</p>
      </div>

      <!-- Stats Grid -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-icon"><i class="fas fa-chart-line"></i></div>
          <div class="stat-value" id="todaySales">$0</div>
          <div class="stat-label">Today's Sales</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon"><i class="fas fa-box"></i></div>
          <div class="stat-value" id="lowStock">0</div>
          <div class="stat-label">Low Stock Items</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon"><i class="fas fa-users"></i></div>
          <div class="stat-value" id="totalStaff">0</div>
          <div class="stat-label">Active Staff</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon"><i class="fas fa-store"></i></div>
          <div class="stat-value" id="storeName">-</div>
          <div class="stat-label">Store Name</div>
        </div>
      </div>

      <!-- Quick Actions -->
      <div class="quick-actions">
        <h3><i class="fas fa-bolt"></i> Quick Actions</h3>
        <div class="action-buttons">
          <button class="action-btn" onclick="alert('Add Product feature coming soon!')">
            <i class="fas fa-plus-circle"></i> Add Product
          </button>
          <button class="action-btn" onclick="alert('Process Sale feature coming soon!')">
            <i class="fas fa-shopping-cart"></i> New Sale
          </button>
          <button class="action-btn" onclick="alert('View Reports feature coming soon!')">
            <i class="fas fa-chart-bar"></i> View Reports
          </button>
          <button class="action-btn" onclick="alert('Manage Staff feature coming soon!')">
            <i class="fas fa-user-plus"></i> Manage Staff
          </button>
        </div>
      </div>

      <!-- Profile Information -->
      <div class="recent-section">
        <div class="profile-card">
          <h3><i class="fas fa-user-circle"></i> Your Profile</h3>
          <div class="profile-details" id="profileDetails">
            <!-- Profile details will be inserted here -->
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    (function() {
      // Supabase configuration
      const SUPABASE_URL = "https://ulccyfajpaiuvqovvqyz.supabase.co";
      const SUPABASE_ANON_KEY = "sb_publishable_4kKDA0psp8AFpoTJlB-k8A_VS9IaWI9";
      
      let supabase;
      
      // Initialize Supabase
      try {
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        console.log("Supabase client created");
      } catch (err) {
        console.error("Failed to create Supabase client:", err);
        showError("Failed to initialize. Please refresh the page.");
        return;
      }
      
      const loadingScreen = document.getElementById('loadingScreen');
      const dashboardContent = document.getElementById('dashboardContent');
      const errorScreen = document.getElementById('errorScreen');
      
      function showError(message) {
        loadingScreen.style.display = 'none';
        dashboardContent.style.display = 'none';
        errorScreen.style.display = 'flex';
        document.getElementById('errorMessage').textContent = message;
      }
      
      function getInitials(name) {
        if (!name) return 'U';
        return name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
      }
      
      async function loadDashboard() {
        try {
          console.log("Starting dashboard load...");
          
          // Get current session
          const { data: { session }, error: sessionError } = await supabase.auth.getSession();
          
          if (sessionError) {
            console.error("Session error:", sessionError);
            throw new Error("Failed to get session: " + sessionError.message);
          }
          
          if (!session) {
            console.log("No session found, redirecting to login");
            window.location.href = "login.html";
            return;
          }
          
          console.log("Session found for user:", session.user.email);
          const user = session.user;
          
          // Try to get profile from profiles table
          let profile = null;
          let profileError = null;
          
          try {
            const { data, error } = await supabase
              .from('profiles')
              .select('*')
              .eq('id', user.id)
              .single();
            
            if (error) {
              console.warn("Profile fetch error:", error.message);
              profileError = error;
            } else {
              profile = data;
              console.log("Profile loaded:", profile);
            }
          } catch (err) {
            console.warn("Profile fetch exception:", err);
          }
          
          // Use profile data or fall back to user metadata
          const fullName = profile?.full_name || user.user_metadata?.full_name || user.email?.split('@')[0] || 'User';
          const firstName = fullName.split(' ')[0];
          const storeName = profile?.store_name || user.user_metadata?.store_name || 'Your Store';
          const role = profile?.role || user.user_metadata?.role || 'staff';
          const phone = profile?.phone || user.user_metadata?.phone || 'Not provided';
          const storeAddress = profile?.store_address || 'Not provided';
          
          console.log("User data:", { fullName, firstName, storeName, role });
          
          // Update UI elements
          document.getElementById('welcomeName').textContent = firstName;
          document.getElementById('userName').textContent = fullName;
          document.getElementById('userAvatar').textContent = getInitials(fullName);
          document.getElementById('storeName').textContent = storeName;
          
          // Demo stats (replace with real data from your database later)
          document.getElementById('todaySales').textContent = `$${Math.floor(Math.random() * 5000) + 1000}`;
          document.getElementById('lowStock').textContent = Math.floor(Math.random() * 15);
          document.getElementById('totalStaff').textContent = Math.floor(Math.random() * 20) + 5;
          
          // Profile details
          const profileDetails = document.getElementById('profileDetails');
          profileDetails.innerHTML = `
            <div class="profile-detail-item">
              <i class="fas fa-envelope"></i>
              <span><strong>Email:</strong> ${escapeHtml(user.email)}</span>
            </div>
            <div class="profile-detail-item">
              <i class="fas fa-tag"></i>
              <span><strong>Role:</strong> <span style="background: #C49A6C; padding: 4px 12px; border-radius: 20px; color: #1E1B18;">${escapeHtml(role.charAt(0).toUpperCase() + role.slice(1))}</span></span>
            </div>
            <div class="profile-detail-item">
              <i class="fas fa-store"></i>
              <span><strong>Store:</strong> ${escapeHtml(storeName)}</span>
            </div>
            <div class="profile-detail-item">
              <i class="fas fa-phone"></i>
              <span><strong>Phone:</strong> ${escapeHtml(phone)}</span>
            </div>
            <div class="profile-detail-item">
              <i class="fas fa-location-dot"></i>
              <span><strong>Address:</strong> ${escapeHtml(storeAddress)}</span>
            </div>
            <div class="profile-detail-item">
              <i class="fas fa-calendar"></i>
              <span><strong>Member since:</strong> ${new Date(user.created_at).toLocaleDateString()}</span>
            </div>
          `;
          
          // Hide loading, show dashboard
          loadingScreen.style.display = 'none';
          dashboardContent.style.display = 'block';
          console.log("Dashboard loaded successfully");
          
        } catch (err) {
          console.error("Dashboard load error:", err);
          showError(err.message || "Failed to load dashboard. Please try logging in again.");
        }
      }
      
      function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>]/g, function(m) {
          if (m === '&') return '&amp;';
          if (m === '<') return '&lt;';
          if (m === '>') return '&gt;';
          return m;
        });
      }
      
      // Logout handler
      const logoutBtn = document.getElementById('logoutBtn');
      if (logoutBtn) {
        logoutBtn.addEventListener('click', async () => {
          console.log("Logging out...");
          await supabase.auth.signOut();
          window.location.href = "login.html";
        });
      }
      
      // Start loading dashboard
      loadDashboard();
    })();
  </script>
</body>
</html>
