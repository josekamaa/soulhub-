<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SoulHub Management - Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@300;400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #FEFCF8;
      color: #1E1B18;
      overflow-x: hidden;
    }

    body.dark-mode {
      background: #1a1a1a;
      color: #FEFCF8;
    }

    body.dark-mode .sidebar,
    body.dark-mode .top-bar,
    body.dark-mode .card,
    body.dark-mode .modal-content,
    body.dark-mode .chart-container,
    body.dark-mode .data-table {
      background: #2d2d2d;
      color: #FEFCF8;
      border-color: #404040;
    }

    .app-container {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 280px;
      background: white;
      border-right: 1px solid #F0EAE3;
      position: fixed;
      height: 100vh;
      overflow-y: auto;
      transition: all 0.3s ease;
      z-index: 100;
    }

    .sidebar-header {
      padding: 24px;
      border-bottom: 1px solid #F0EAE3;
    }

    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(135deg, #2C241E 0%, #A2794C 100%);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-menu {
      padding: 24px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      margin-bottom: 8px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      color: #5E5348;
    }

    .nav-item:hover {
      background: #F9F4ED;
      color: #C49A6C;
    }

    .nav-item.active {
      background: #C49A6C;
      color: white;
    }

    .nav-item i {
      width: 24px;
    }

    .main-content {
      flex: 1;
      margin-left: 280px;
    }

    .top-bar {
      background: white;
      border-bottom: 1px solid #F0EAE3;
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 99;
    }

    .page-title h1 {
      font-size: 1.8rem;
      font-weight: 600;
    }

    .top-bar-actions {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .theme-toggle, .notifications {
      cursor: pointer;
      font-size: 1.2rem;
      padding: 8px;
      border-radius: 50%;
      transition: all 0.2s;
    }

    .user-menu {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      padding: 8px 16px;
      border-radius: 40px;
      background: #F9F4ED;
    }

    .user-avatar {
      width: 32px;
      height: 32px;
      background: #C49A6C;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }

    .content-area {
      padding: 32px;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 24px;
      margin-bottom: 32px;
    }

    .card {
      background: white;
      border: 1px solid #F0EAE3;
      border-radius: 20px;
      padding: 24px;
      transition: all 0.3s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(0,0,0,0.1);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      color: #8F8278;
    }

    .card-value {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .charts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 24px;
      margin-bottom: 32px;
    }

    .chart-container, .data-table {
      background: white;
      border: 1px solid #F0EAE3;
      border-radius: 20px;
      padding: 24px;
    }

    .chart-container h3, .data-table h3 {
      margin-bottom: 20px;
    }

    canvas {
      max-height: 300px;
    }

    .data-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 24px;
      margin-bottom: 32px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #F0EAE3;
    }

    .badge {
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
      display: inline-block;
    }

    .badge-warning {
      background: #FFF4E5;
      color: #B76E00;
    }

    .badge-success {
      background: #E6F4EA;
      color: #2E7D32;
    }

    .quick-actions {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 32px;
    }

    .action-btn {
      background: #1E1B18;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 40px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .action-btn:hover {
      background: #C49A6C;
      transform: translateY(-2px);
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: white;
      border-radius: 24px;
      padding: 32px;
      max-width: 500px;
      width: 90%;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .close-modal {
      cursor: pointer;
      font-size: 1.5rem;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 10px;
      border: 1px solid #E9E2D8;
      border-radius: 12px;
      font-family: 'Inter', sans-serif;
    }

    .loading {
      text-align: center;
      padding: 60px;
    }

    .spinner {
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @media (max-width: 768px) {
      .sidebar {
        transform: translateX(-100%);
      }
      .sidebar.mobile-open {
        transform: translateX(0);
      }
      .main-content {
        margin-left: 0;
      }
      .menu-toggle {
        display: block;
        cursor: pointer;
        font-size: 1.5rem;
      }
    }

    @media (min-width: 769px) {
      .menu-toggle {
        display: none;
      }
    }

    .error-container {
      text-align: center;
      padding: 60px;
    }

    .setup-btn {
      background: #C49A6C;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 40px;
      cursor: pointer;
      margin-top: 20px;
    }
  </style>
</head>
<body>
<div class="app-container">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <i class="fas fa-chart-line"></i> SoulHub
      </div>
    </div>
    <nav class="nav-menu">
      <div class="nav-item active" data-page="dashboard">
        <i class="fas fa-tachometer-alt"></i>
        <span>Dashboard</span>
      </div>
      <div class="nav-item" data-page="inventory">
        <i class="fas fa-boxes"></i>
        <span>Inventory</span>
      </div>
      <div class="nav-item" data-page="sales">
        <i class="fas fa-shopping-cart"></i>
        <span>Sales & POS</span>
      </div>
      <div class="nav-item" data-page="customers">
        <i class="fas fa-users"></i>
        <span>Customers</span>
      </div>
      <div class="nav-item" data-page="reports">
        <i class="fas fa-chart-bar"></i>
        <span>Reports</span>
      </div>
    </nav>
  </aside>

  <main class="main-content">
    <div class="top-bar">
      <div class="menu-toggle" id="menuToggle">
        <i class="fas fa-bars"></i>
      </div>
      <div class="page-title">
        <h1 id="pageTitle">Dashboard</h1>
      </div>
      <div class="top-bar-actions">
        <div class="theme-toggle" id="themeToggle">
          <i class="fas fa-moon"></i>
        </div>
        <div class="notifications" id="notifications">
          <i class="fas fa-bell"></i>
        </div>
        <div class="user-menu" id="userMenu">
          <div class="user-avatar">
            <i class="fas fa-user"></i>
          </div>
          <span id="userName">Loading...</span>
          <i class="fas fa-chevron-down"></i>
        </div>
      </div>
    </div>

    <div class="content-area" id="contentArea">
      <div class="loading">
        <i class="fas fa-spinner spinner" style="font-size: 2rem;"></i>
        <p style="margin-top: 20px;">Loading dashboard...</p>
      </div>
    </div>
  </main>
</div>

<div id="saleModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>New Sale</h2>
      <span class="close-modal">&times;</span>
    </div>
    <form id="saleForm">
      <div class="form-group">
        <label>Product SKU</label>
        <input type="text" id="productSku" required placeholder="e.g., NK-001">
      </div>
      <div class="form-group">
        <label>Quantity</label>
        <input type="number" id="quantity" min="1" value="1" required>
      </div>
      <div class="form-group">
        <label>Payment Method</label>
        <select id="paymentMethod">
          <option value="cash">Cash</option>
          <option value="card">Card</option>
          <option value="mobile">Mobile Payment</option>
        </select>
      </div>
      <button type="submit" class="action-btn" style="width: 100%;">Process Sale</button>
    </form>
  </div>
</div>

<script>
  (function() {
    // Supabase Configuration
    const SUPABASE_URL = "https://ulccyfajpaiuvqovvqyz.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVsY2N5ZmFqcGFpdXZxb3Z2cXl6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwNjIwMzAsImV4cCI6MjA5NTYzODAzMH0.mLGYFgTZ3ToIJD8KAiqbxr0h42H8PYN5xh1fyvTNvqo";
    
    let supabaseClient = null;
    let currentUser = null;
    let revenueChart = null;
    let categoryChart = null;

    async function initSupabase() {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      
      const { data: { session }, error } = await supabaseClient.auth.getSession();
      if (error || !session) {
        window.location.href = "login.html";
        return;
      }
      
      currentUser = session.user;
      
      const { data: profile } = await supabaseClient
        .from('profiles')
        .select('*')
        .eq('id', currentUser.id)
        .single();
      
      if (profile) {
        document.getElementById('userName').textContent = profile.full_name || currentUser.email;
      } else {
        document.getElementById('userName').textContent = currentUser.email;
      }
      
      // Initialize database and load dashboard
      await initializeDatabase();
      loadDashboard();
    }

    async function initializeDatabase() {
      // Check if products table exists and has data
      const { error } = await supabaseClient.from('products').select('count', { count: 'exact', head: true });
      
      if (error) {
        console.log("Tables may not exist yet. Please run the SQL setup script.");
        return;
      }
      
      // Check if we have any products
      const { data: products, count } = await supabaseClient.from('products').select('*', { count: 'exact' });
      
      if (!products || products.length === 0) {
        console.log("Creating sample data...");
        await createSampleData();
      }
    }

    async function createSampleData() {
      const sampleProducts = [
        { sku: 'NK-001', name: 'Nike Air Max', category: 'sneakers', selling_price: 129.99, stock_quantity: 15, low_stock_threshold: 5 },
        { sku: 'AD-001', name: 'Adidas Samba', category: 'casual', selling_price: 89.99, stock_quantity: 3, low_stock_threshold: 5 },
        { sku: 'NB-001', name: 'New Balance 574', category: 'casual', selling_price: 84.99, stock_quantity: 8, low_stock_threshold: 5 },
        { sku: 'TM-001', name: 'Timberland Boots', category: 'boots', selling_price: 159.99, stock_quantity: 2, low_stock_threshold: 5 },
        { sku: 'CON-001', name: 'Converse All Star', category: 'casual', selling_price: 54.99, stock_quantity: 12, low_stock_threshold: 5 },
        { sku: 'VANS-001', name: 'Vans Old Skool', category: 'casual', selling_price: 59.99, stock_quantity: 7, low_stock_threshold: 5 },
        { sku: 'PRADA-001', name: 'Prada Monolith', category: 'formal', selling_price: 850.00, stock_quantity: 4, low_stock_threshold: 5 },
        { sku: 'GUCCI-001', name: 'Gucci Ace', category: 'formal', selling_price: 620.00, stock_quantity: 2, low_stock_threshold: 5 }
      ];
      
      for (const product of sampleProducts) {
        const { error } = await supabaseClient.from('products').upsert([product], { onConflict: 'sku' });
        if (error) console.error('Error inserting product:', error);
      }
      
      // Create sample sales
      const sampleSales = [
        { user_id: currentUser?.id, total_amount: 129.99, payment_method: 'card', sale_date: new Date() },
        { user_id: currentUser?.id, total_amount: 89.99, payment_method: 'cash', sale_date: new Date(Date.now() - 86400000) },
        { user_id: currentUser?.id, total_amount: 159.99, payment_method: 'mobile', sale_date: new Date(Date.now() - 172800000) }
      ];
      
      for (const sale of sampleSales) {
        const { error } = await supabaseClient.from('sales').insert([sale]);
        if (error) console.error('Error inserting sale:', error);
      }
    }

    async function loadDashboard() {
      showLoading();
      
      try {
        const [productsData, salesData, customersData] = await Promise.all([
          fetchProducts(),
          fetchSales(),
          fetchCustomers()
        ]);
        
        const dashboardHtml = `
          <div class="kpi-grid">
            <div class="card">
              <div class="card-header">
                <span>Today's Revenue</span>
                <i class="fas fa-dollar-sign"></i>
              </div>
              <div class="card-value">$${calculateTodayRevenue(salesData)}</div>
            </div>
            <div class="card">
              <div class="card-header">
                <span>Today's Sales</span>
                <i class="fas fa-shopping-cart"></i>
              </div>
              <div class="card-value">${calculateTodaySales(salesData)}</div>
            </div>
            <div class="card">
              <div class="card-header">
                <span>Low Stock Alert</span>
                <i class="fas fa-exclamation-triangle"></i>
              </div>
              <div class="card-value">${getLowStockCount(productsData)}</div>
            </div>
            <div class="card">
              <div class="card-header">
                <span>Top Product</span>
                <i class="fas fa-trophy"></i>
              </div>
              <div class="card-value">${getTopProduct(productsData)}</div>
            </div>
            <div class="card">
              <div class="card-header">
                <span>Total Customers</span>
                <i class="fas fa-users"></i>
              </div>
              <div class="card-value">${customersData.length}</div>
            </div>
            <div class="card">
              <div class="card-header">
                <span>Total Products</span>
                <i class="fas fa-box"></i>
              </div>
              <div class="card-value">${productsData.length}</div>
            </div>
          </div>
          
          <div class="quick-actions">
            <button class="action-btn" onclick="window.openSaleModal()">
              <i class="fas fa-plus"></i> New Sale
            </button>
            <button class="action-btn" onclick="window.addSampleProduct()">
              <i class="fas fa-box"></i> Add Sample Product
            </button>
            <button class="action-btn" onclick="window.exportReport()">
              <i class="fas fa-download"></i> Export Report
            </button>
          </div>
          
          <div class="charts-grid">
            <div class="chart-container">
              <h3>Sales Trend (Last 7 Days)</h3>
              <canvas id="revenueChart"></canvas>
            </div>
            <div class="chart-container">
              <h3>Products by Category</h3>
              <canvas id="categoryChart"></canvas>
            </div>
          </div>
          
          <div class="data-grid">
            <div class="data-table">
              <h3>Low Stock Alerts</h3>
              <table>
                <thead>
                  <tr><th>Product</th><th>Stock</th><th>Status</th></tr>
                </thead>
                <tbody>
                  ${getLowStockTableRows(productsData)}
                </tbody>
              </table>
            </div>
            <div class="data-table">
              <h3>Recent Sales</h3>
              <table>
                <thead>
                  <tr><th>Date</th><th>Amount</th><th>Payment</th></tr>
                </thead>
                <tbody>
                  ${getRecentSalesRows(salesData)}
                </tbody>
              </table>
            </div>
          </div>
        `;
        
        document.getElementById('contentArea').innerHTML = dashboardHtml;
        
        initRevenueChart(salesData);
        initCategoryChart(productsData);
        
      } catch (error) {
        console.error('Error loading dashboard:', error);
        document.getElementById('contentArea').innerHTML = `
          <div class="error-container">
            <i class="fas fa-exclamation-triangle" style="font-size: 3rem; color: #C49A6C;"></i>
            <h3>Database Setup Required</h3>
            <p>Please run the SQL setup script in your Supabase SQL editor to create the required tables.</p>
            <button class="setup-btn" onclick="location.reload()">Retry Connection</button>
          </div>
        `;
      }
    }

    function calculateTodayRevenue(salesData) {
      const today = new Date().toDateString();
      const todaySales = salesData.filter(sale => new Date(sale.sale_date).toDateString() === today);
      return todaySales.reduce((sum, sale) => sum + (sale.total_amount || 0), 0).toFixed(2);
    }

    function calculateTodaySales(salesData) {
      const today = new Date().toDateString();
      const todaySales = salesData.filter(sale => new Date(sale.sale_date).toDateString() === today);
      return todaySales.length;
    }

    function getLowStockCount(productsData) {
      return productsData.filter(p => p.stock_quantity <= (p.low_stock_threshold || 5)).length;
    }

    function getTopProduct(productsData) {
      if (productsData.length === 0) return 'N/A';
      return productsData[0]?.name || 'Nike Air Max';
    }

    function getLowStockTableRows(productsData) {
      const lowStock = productsData.filter(p => p.stock_quantity <= (p.low_stock_threshold || 5));
      if (lowStock.length === 0) {
        return '<tr><td colspan="3">No low stock items</td></tr>';
      }
      return lowStock.slice(0, 5).map(p => `
        <tr>
          <td>${p.name}</td>
          <td>${p.stock_quantity} left</td>
          <td><span class="badge badge-warning">Low Stock</span></td>
        </tr>
      `).join('');
    }

    function getRecentSalesRows(salesData) {
      if (salesData.length === 0) {
        return '<tr><td colspan="3">No sales yet</td></tr>';
      }
      return salesData.slice(0, 5).map(sale => `
        <tr>
          <td>${new Date(sale.sale_date).toLocaleDateString()}</td>
          <td>$${sale.total_amount}</td>
          <td><span class="badge badge-success">${sale.payment_method}</span></td>
        </tr>
      `).join('');
    }

    function initRevenueChart(salesData) {
      const ctx = document.getElementById('revenueChart')?.getContext('2d');
      if (!ctx) return;
      
      const last7Days = Array.from({length: 7}, (_, i) => {
        const d = new Date();
        d.setDate(d.getDate() - (6 - i));
        return d;
      });
      
      const revenueByDay = last7Days.map(day => {
        const daySales = salesData.filter(sale => {
          const saleDate = new Date(sale.sale_date);
          return saleDate.toDateString() === day.toDateString();
        });
        return daySales.reduce((sum, sale) => sum + (sale.total_amount || 0), 0);
      });
      
      if (revenueChart) revenueChart.destroy();
      revenueChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: last7Days.map(d => d.toLocaleDateString('en-US', { weekday: 'short' })),
          datasets: [{
            label: 'Revenue ($)',
            data: revenueByDay,
            borderColor: '#C49A6C',
            backgroundColor: 'rgba(196,154,108,0.1)',
            tension: 0.4,
            fill: true
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: true
        }
      });
    }

    function initCategoryChart(productsData) {
      const ctx = document.getElementById('categoryChart')?.getContext('2d');
      if (!ctx) return;
      
      const categories = {};
      productsData.forEach(p => {
        const cat = p.category || 'other';
        categories[cat] = (categories[cat] || 0) + 1;
      });
      
      if (categoryChart) categoryChart.destroy();
      categoryChart = new Chart(ctx, {
        type: 'pie',
        data: {
          labels: Object.keys(categories).map(c => c.toUpperCase()),
          datasets: [{
            data: Object.values(categories),
            backgroundColor: ['#C49A6C', '#E2B386', '#F0D5B0', '#A2794C', '#D4A574']
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: true
        }
      });
    }

    async function fetchProducts() {
      const { data, error } = await supabaseClient.from('products').select('*').limit(100);
      if (error) return [];
      return data || [];
    }

    async function fetchSales() {
      const { data, error } = await supabaseClient.from('sales').select('*').order('sale_date', { ascending: false }).limit(50);
      if (error) return [];
      return data || [];
    }

    async function fetchCustomers() {
      const { data, error } = await supabaseClient.from('customers').select('*').limit(100);
      if (error) return [];
      return data || [];
    }

    function showLoading() {
      document.getElementById('contentArea').innerHTML = `
        <div class="loading">
          <i class="fas fa-spinner spinner" style="font-size: 2rem;"></i>
          <p style="margin-top: 20px;">Loading dashboard...</p>
        </div>
      `;
    }

    function openSaleModal() {
      document.getElementById('saleModal').classList.add('active');
    }

    async function addSampleProduct() {
      const name = prompt('Enter product name:', 'Sample Shoe');
      if (!name) return;
      
      const price = parseFloat(prompt('Enter selling price:', '99.99'));
      if (!price) return;
      
      const sku = name.substring(0, 3).toUpperCase() + '-' + Math.floor(Math.random() * 1000);
      
      const { error } = await supabaseClient.from('products').insert([{
        sku: sku,
        name: name,
        category: 'casual',
        selling_price: price,
        stock_quantity: 10,
        low_stock_threshold: 5
      }]);
      
      if (error) {
        alert('Error: ' + error.message);
      } else {
        alert('Product added successfully!');
        loadDashboard();
      }
    }

    function exportReport() {
      alert('📊 Export feature: This would generate a CSV/PDF report of all sales and inventory data.');
    }

    // Event Listeners
    document.getElementById('themeToggle')?.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
      const icon = document.querySelector('#themeToggle i');
      if (document.body.classList.contains('dark-mode')) {
        icon.classList.remove('fa-moon');
        icon.classList.add('fa-sun');
      } else {
        icon.classList.remove('fa-sun');
        icon.classList.add('fa-moon');
      }
    });

    document.getElementById('menuToggle')?.addEventListener('click', () => {
      document.getElementById('sidebar').classList.toggle('mobile-open');
    });

    document.querySelectorAll('.close-modal').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.modal').forEach(modal => modal.classList.remove('active'));
      });
    });

    document.getElementById('saleForm')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const sku = document.getElementById('productSku').value;
      const quantity = parseInt(document.getElementById('quantity').value);
      const paymentMethod = document.getElementById('paymentMethod').value;
      
      const { data: product } = await supabaseClient.from('products').select('*').eq('sku', sku).single();
      
      if (!product) {
        alert('Product not found!');
        return;
      }
      
      if (product.stock_quantity < quantity) {
        alert('Insufficient stock! Available: ' + product.stock_quantity);
        return;
      }
      
      const totalAmount = product.selling_price * quantity;
      
      const { error: saleError } = await supabaseClient.from('sales').insert([{
        user_id: currentUser.id,
        total_amount: totalAmount,
        payment_method: paymentMethod
      }]);
      
      if (saleError) {
        alert('Error: ' + saleError.message);
        return;
      }
      
      await supabaseClient.from('products').update({ stock_quantity: product.stock_quantity - quantity }).eq('sku', sku);
      
      alert('Sale completed! Total: $' + totalAmount);
      document.getElementById('saleModal').classList.remove('active');
      loadDashboard();
    });

    document.getElementById('userMenu')?.addEventListener('click', async () => {
      if (confirm('Logout?')) {
        await supabaseClient.auth.signOut();
        window.location.href = 'login.html';
      }
    });

    document.getElementById('notifications')?.addEventListener('click', () => {
      alert('🔔 Welcome to SoulHub! Start by adding products and processing sales.');
    });

    // Navigation
    document.querySelectorAll('.nav-item').forEach(item => {
      item.addEventListener('click', () => {
        document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
        item.classList.add('active');
        const page = item.dataset.page;
        document.getElementById('pageTitle').textContent = page.charAt(0).toUpperCase() + page.slice(1);
        
        if (page !== 'dashboard') {
          document.getElementById('contentArea').innerHTML = `
            <div class="loading">
              <i class="fas fa-spinner spinner" style="font-size: 2rem;"></i>
              <p style="margin-top: 20px;">${page.toUpperCase()} page coming soon!</p>
              <button class="action-btn" style="margin-top: 20px;" onclick="window.loadDashboard()">Back to Dashboard</button>
            </div>
          `;
        } else {
          loadDashboard();
        }
      });
    });

    // Make functions global for onclick handlers
    window.openSaleModal = openSaleModal;
    window.addSampleProduct = addSampleProduct;
    window.exportReport = exportReport;
    window.loadDashboard = loadDashboard;

    // Start the app
    initSupabase();
  })();
</script>
</body>
</html>
