<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SoulHub Management - Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@300;400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: #FEFCF8;
      color: #1E1B18;
      overflow-x: hidden;
    }

    body.dark-mode {
      background: #1a1a1a;
      color: #FEFCF8;
    }

    body.dark-mode .sidebar,
    body.dark-mode .top-bar,
    body.dark-mode .card,
    body.dark-mode .modal-content,
    body.dark-mode .chart-container,
    body.dark-mode .data-table,
    body.dark-mode .product-showcase-card {
      background: #2d2d2d;
      color: #FEFCF8;
      border-color: #404040;
    }

    .app-container { display: flex; min-height: 100vh; }

    .sidebar {
      width: 280px;
      background: white;
      border-right: 1px solid #F0EAE3;
      position: fixed;
      height: 100vh;
      overflow-y: auto;
      transition: transform 0.3s ease-in-out;
      z-index: 1000;
    }

    body.dark-mode .sidebar { background: #2d2d2d; border-right-color: #404040; }

    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); }
      .sidebar.mobile-open { transform: translateX(0); box-shadow: 2px 0 10px rgba(0,0,0,0.1); }
      .main-content { margin-left: 0 !important; }
    }

    @media (min-width: 769px) {
      .sidebar { transform: translateX(0) !important; }
      .main-content { margin-left: 280px; }
      .mobile-overlay { display: none; }
    }

    .mobile-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 999;
    }
    .mobile-overlay.active { display: block; }

    .sidebar-header { padding: 24px; border-bottom: 1px solid #F0EAE3; }
    body.dark-mode .sidebar-header { border-bottom-color: #404040; }

    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(135deg, #2C241E 0%, #A2794C 100%);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-menu { padding: 24px; }
    .nav-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px; margin-bottom: 8px;
      border-radius: 12px; cursor: pointer;
      transition: all 0.2s ease; color: #5E5348; text-decoration: none;
    }
    body.dark-mode .nav-item { color: #B0A89F; }
    .nav-item:hover { background: #F9F4ED; color: #C49A6C; }
    body.dark-mode .nav-item:hover { background: #3d3d3d; }
    .nav-item.active { background: #C49A6C; color: white; }
    .nav-item i { width: 24px; font-size: 1.2rem; }

    .main-content { flex: 1; transition: margin-left 0.3s ease; }

    .top-bar {
      background: white; border-bottom: 1px solid #F0EAE3;
      padding: 16px 32px; display: flex;
      justify-content: space-between; align-items: center;
      position: sticky; top: 0; z-index: 99;
    }
    body.dark-mode .top-bar { background: #2d2d2d; border-bottom-color: #404040; }

    .menu-toggle { display: none; cursor: pointer; font-size: 1.5rem; color: #5E5348; }
    .menu-toggle:hover { color: #C49A6C; }
    @media (max-width: 768px) { .menu-toggle { display: block; } }

    .page-title h1 { font-size: 1.8rem; font-weight: 600; }
    .top-bar-actions { display: flex; align-items: center; gap: 20px; }

    .theme-toggle, .notifications {
      cursor: pointer; font-size: 1.2rem; padding: 8px; border-radius: 50%;
      transition: all 0.2s;
    }
    .theme-toggle:hover, .notifications:hover { background: #F9F4ED; color: #C49A6C; }

    .user-menu {
      display: flex; align-items: center; gap: 12px; cursor: pointer;
      padding: 8px 16px; border-radius: 40px; background: #F9F4ED;
    }
    .user-menu:hover { background: #F0EAE3; }
    body.dark-mode .user-menu { background: #3d3d3d; }

    .user-avatar {
      width: 32px; height: 32px; background: #C49A6C;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      color: white;
    }

    .content-area { padding: 32px; }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 24px; margin-bottom: 32px;
    }

    .card {
      background: white; border: 1px solid #F0EAE3;
      border-radius: 20px; padding: 24px; transition: all 0.3s ease;
    }
    .card:hover { transform: translateY(-4px); box-shadow: 0 12px 24px rgba(0,0,0,0.1); }
    .card-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 16px; color: #8F8278;
    }
    .card-value { font-size: 2.5rem; font-weight: 700; margin-bottom: 8px; }
    .card-change { font-size: 0.85rem; color: #4CAF50; }

    /* Top Product Card with Image */
    .top-product-card {
      display: flex; gap: 16px; align-items: center;
    }
    .top-product-img {
      width: 80px; height: 80px; object-fit: cover; border-radius: 16px;
      background: #F0EAE3;
    }
    body.dark-mode .top-product-img { background: #404040; }
    .top-product-info { flex: 1; }

    .charts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 24px; margin-bottom: 32px;
    }

    .chart-container, .data-table {
      background: white; border: 1px solid #F0EAE3;
      border-radius: 20px; padding: 24px;
    }
    body.dark-mode .chart-container,
    body.dark-mode .data-table { background: #2d2d2d; border-color: #404040; }
    .chart-container h3, .data-table h3 { margin-bottom: 20px; font-size: 1.2rem; }
    canvas { max-height: 300px; }

    .data-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 24px; margin-bottom: 32px;
    }

    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #F0EAE3; }
    body.dark-mode th, body.dark-mode td { border-bottom-color: #404040; }

    .badge {
      padding: 4px 12px; border-radius: 12px;
      font-size: 0.75rem; font-weight: 600; display: inline-block;
    }
    .badge-warning { background: #FFF4E5; color: #B76E00; }
    .badge-success { background: #E6F4EA; color: #2E7D32; }

    .quick-actions {
      display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 32px;
    }

    .action-btn {
      background: #1E1B18; color: white; border: none;
      padding: 12px 24px; border-radius: 40px; cursor: pointer;
      display: flex; align-items: center; gap: 8px;
      transition: all 0.2s; font-family: 'Inter', sans-serif; font-weight: 500;
    }
    .action-btn:hover { background: #C49A6C; transform: translateY(-2px); }

    /* Product Showcase Grid */
    .product-showcase {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }
    .product-showcase-card {
      background: white;
      border: 1px solid #F0EAE3;
      border-radius: 20px;
      overflow: hidden;
      transition: all 0.3s ease;
      cursor: pointer;
    }
    .product-showcase-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(0,0,0,0.1);
    }
    .product-showcase-img-wrapper {
      width: 100%;
      height: 160px;
      background: #F5F0EB;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    body.dark-mode .product-showcase-img-wrapper { background: #3d3d3d; }
    .product-showcase-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }
    .product-showcase-card:hover .product-showcase-img {
      transform: scale(1.05);
    }
    .product-showcase-placeholder {
      font-size: 3rem;
      color: #ccc;
    }
    .product-showcase-info {
      padding: 14px;
    }
    .product-showcase-name {
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .product-showcase-details {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: #8F8278;
    }
    .product-showcase-price {
      font-weight: 700;
      color: #C49A6C;
      font-size: 1rem;
    }

    /* Image thumbnail in tables */
    .product-img-thumb {
      width: 44px;
      height: 44px;
      object-fit: cover;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.2s;
      border: 2px solid transparent;
    }
    .product-img-thumb:hover {
      transform: scale(1.15);
      border-color: #C49A6C;
      z-index: 1;
      position: relative;
    }
    .img-placeholder-icon {
      font-size: 1.5rem;
      color: #ccc;
      width: 44px;
      text-align: center;
      display: inline-block;
    }

    /* Lightbox Modal */
    .lightbox-modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.9);
      z-index: 2000;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
    .lightbox-modal.active { display: flex; }
    .lightbox-close {
      position: absolute;
      top: 20px; right: 30px;
      font-size: 2.5rem;
      color: white;
      cursor: pointer;
      z-index: 2001;
      transition: color 0.2s;
    }
    .lightbox-close:hover { color: #C49A6C; }
    .lightbox-image {
      max-width: 90%;
      max-height: 75vh;
      object-fit: contain;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .lightbox-info {
      color: white;
      text-align: center;
      margin-top: 20px;
      font-size: 1.1rem;
    }
    .lightbox-info .lightbox-name {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .lightbox-info .lightbox-meta {
      color: #B0A89F;
      font-size: 0.95rem;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 1001;
      justify-content: center; align-items: center;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: white; border-radius: 24px; padding: 32px;
      max-width: 500px; width: 90%; max-height: 80vh; overflow-y: auto;
    }
    body.dark-mode .modal-content { background: #2d2d2d; }

    .modal-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 24px;
    }
    .close-modal { cursor: pointer; font-size: 1.5rem; transition: color 0.2s; }
    .close-modal:hover { color: #C49A6C; }

    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 8px; font-weight: 500; }
    .form-group input,
    .form-group select {
      width: 100%; padding: 10px;
      border: 1px solid #E9E2D8; border-radius: 12px;
      font-family: 'Inter', sans-serif;
    }

    .image-upload-container {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; border: 2px dashed #E9E2D8;
      border-radius: 12px; padding: 20px; text-align: center;
      cursor: pointer; transition: all 0.2s;
    }
    .image-upload-container:hover { border-color: #C49A6C; }
    .image-upload-container i { font-size: 2rem; color: #8F8278; margin-bottom: 8px; }
    .image-preview {
      width: 120px; height: 120px; object-fit: cover;
      border-radius: 12px; margin-top: 10px; display: none;
    }

    .section-title {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .section-title i { color: #C49A6C; }

    .loading { text-align: center; padding: 60px; }
    .spinner { animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    @media (max-width: 768px) {
      .content-area { padding: 16px; }
      .kpi-grid { gap: 16px; }
      .card { padding: 16px; }
      .card-value { font-size: 1.8rem; }
      .charts-grid { grid-template-columns: 1fr; }
      .data-grid { grid-template-columns: 1fr; }
      .product-showcase { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
      .product-showcase-img-wrapper { height: 130px; }
      .quick-actions { gap: 12px; }
      .action-btn { padding: 10px 16px; font-size: 0.9rem; }
      .top-product-img { width: 60px; height: 60px; }
    }
  </style>
</head>
<body>
<div class="mobile-overlay" id="mobileOverlay"></div>
<div class="app-container">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo"><i class="fas fa-chart-line"></i> SoulHub</div>
    </div>
    <nav class="nav-menu">
      <a href="dashboard.html" class="nav-item active">
        <i class="fas fa-tachometer-alt"></i><span>Dashboard</span>
      </a>
      <a href="inventory.html" class="nav-item">
        <i class="fas fa-boxes"></i><span>Inventory</span>
      </a>
      <a href="sales.html" class="nav-item">
        <i class="fas fa-shopping-cart"></i><span>Sales & POS</span>
      </a>
      <a href="customers.html" class="nav-item">
        <i class="fas fa-users"></i><span>Customers</span>
      </a>
      <a href="reports.html" class="nav-item">
        <i class="fas fa-chart-bar"></i><span>Reports</span>
      </a>
    </nav>
  </aside>

  <main class="main-content">
    <div class="top-bar">
      <div class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></div>
      <div class="page-title"><h1 id="pageTitle">Dashboard</h1></div>
      <div class="top-bar-actions">
        <div class="theme-toggle" id="themeToggle"><i class="fas fa-moon"></i></div>
        <div class="notifications" id="notifications"><i class="fas fa-bell"></i></div>
        <div class="user-menu" id="userMenu">
          <div class="user-avatar"><i class="fas fa-user"></i></div>
          <span id="userName">Loading...</span>
          <i class="fas fa-chevron-down"></i>
        </div>
      </div>
    </div>

    <div class="content-area" id="contentArea">
      <div class="loading">
        <i class="fas fa-spinner spinner" style="font-size: 2rem;"></i>
        <p style="margin-top: 20px;">Loading dashboard...</p>
      </div>
    </div>
  </main>
</div>

<!-- Lightbox for full-size image viewing -->
<div id="lightboxModal" class="lightbox-modal">
  <span class="lightbox-close" onclick="window.closeLightbox()">&times;</span>
  <img id="lightboxImage" class="lightbox-image" src="" alt="Product Image">
  <div class="lightbox-info">
    <div class="lightbox-name" id="lightboxName"></div>
    <div class="lightbox-meta" id="lightboxMeta"></div>
  </div>
</div>

<!-- Sale Modal -->
<div id="saleModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>New Sale</h2>
      <span class="close-modal">&times;</span>
    </div>
    <form id="saleForm">
      <div class="form-group"><label>Product SKU</label><input type="text" id="productSku" required placeholder="e.g., NK-001"></div>
      <div class="form-group"><label>Quantity</label><input type="number" id="quantity" min="1" value="1" required></div>
      <div class="form-group"><label>Payment Method</label><select id="paymentMethod"><option value="cash">Cash</option><option value="card">Card</option><option value="mobile">Mobile Payment</option></select></div>
      <button type="submit" class="action-btn" style="width: 100%;">Process Sale</button>
    </form>
  </div>
</div>

<!-- Add Product Modal -->
<div id="addProductModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Add New Product</h2>
      <span class="close-modal" onclick="window.closeAddProductModal()">&times;</span>
    </div>
    <form id="addProductForm">
      <div class="form-group"><label>Product Name *</label><input type="text" id="productName" required placeholder="e.g., Nike Air Max"></div>
      <div class="form-group"><label>SKU *</label><input type="text" id="productSkuNew" required placeholder="e.g., NK-002"></div>
      <div class="form-group"><label>Category</label><select id="productCategory"><option value="casual">Casual</option><option value="sneakers">Sneakers</option><option value="boots">Boots</option><option value="formal">Formal</option><option value="other">Other</option></select></div>
      <div class="form-group"><label>Selling Price *</label><input type="number" id="productPrice" step="0.01" required placeholder="99.99"></div>
      <div class="form-group"><label>Stock Quantity</label><input type="number" id="productStock" value="10" min="0"></div>
      <div class="form-group">
        <label>Product Image</label>
        <div class="image-upload-container" id="imageUploadContainer" onclick="document.getElementById('productImageInput').click()">
          <i class="fas fa-cloud-upload-alt"></i>
          <p>Click to upload image</p>
          <p style="font-size:0.8rem; color:#8F8278;">(optional)</p>
          <input type="file" id="productImageInput" accept="image/*" style="display:none" onchange="window.previewImage(event)">
          <img id="imagePreview" class="image-preview" src="#" alt="Preview">
        </div>
      </div>
      <button type="submit" class="action-btn" style="width: 100%;">Add Product</button>
    </form>
  </div>
</div>

<script>
  (function() {
    const SUPABASE_URL = "https://ulccyfajpaiuvqovvqyz.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVsY2N5ZmFqcGFpdXZxb3Z2cXl6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwNjIwMzAsImV4cCI6MjA5NTYzODAzMH0.mLGYFgTZ3ToIJD8KAiqbxr0h42H8PYN5xh1fyvTNvqo";
    
    let supabaseClient = null;
    let currentUser = null;
    let revenueChart = null;
    let categoryChart = null;

    async function initSupabase() {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      const { data: { session }, error } = await supabaseClient.auth.getSession();
      if (error || !session) { window.location.href = "login.html"; return; }
      currentUser = session.user;
      const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', currentUser.id).single();
      document.getElementById('userName').textContent = profile?.full_name || currentUser.email;
      await initializeDatabase();
      loadDashboard();
    }

    async function initializeDatabase() {
      const { error } = await supabaseClient.from('products').select('count', { count: 'exact', head: true });
      if (error) { console.log("Tables may not exist yet."); return; }
      const { data: products } = await supabaseClient.from('products').select('*', { count: 'exact' });
      if (!products || products.length === 0) { await createSampleData(); }
    }

    async function createSampleData() {
      const sampleProducts = [
        { sku: 'NK-001', name: 'Nike Air Max', category: 'sneakers', selling_price: 129.99, stock_quantity: 15, low_stock_threshold: 5 },
        { sku: 'AD-001', name: 'Adidas Samba', category: 'casual', selling_price: 89.99, stock_quantity: 3, low_stock_threshold: 5 },
        { sku: 'NB-001', name: 'New Balance 574', category: 'casual', selling_price: 84.99, stock_quantity: 8, low_stock_threshold: 5 },
        { sku: 'TM-001', name: 'Timberland Boots', category: 'boots', selling_price: 159.99, stock_quantity: 2, low_stock_threshold: 5 },
        { sku: 'CON-001', name: 'Converse All Star', category: 'casual', selling_price: 54.99, stock_quantity: 12, low_stock_threshold: 5 },
        { sku: 'VANS-001', name: 'Vans Old Skool', category: 'casual', selling_price: 59.99, stock_quantity: 7, low_stock_threshold: 5 },
        { sku: 'PRADA-001', name: 'Prada Monolith', category: 'formal', selling_price: 850.00, stock_quantity: 4, low_stock_threshold: 5 },
        { sku: 'GUCCI-001', name: 'Gucci Ace', category: 'formal', selling_price: 620.00, stock_quantity: 2, low_stock_threshold: 5 }
      ];
      for (const product of sampleProducts) {
        await supabaseClient.from('products').upsert([product], { onConflict: 'sku' });
      }
      const sampleSales = [
        { user_id: currentUser?.id, total_amount: 129.99, payment_method: 'card', sale_date: new Date() },
        { user_id: currentUser?.id, total_amount: 89.99, payment_method: 'cash', sale_date: new Date(Date.now() - 86400000) },
        { user_id: currentUser?.id, total_amount: 159.99, payment_method: 'mobile', sale_date: new Date(Date.now() - 172800000) }
      ];
      for (const sale of sampleSales) {
        await supabaseClient.from('sales').insert([sale]);
      }
    }

    /* ============ LIGHTBOX FUNCTIONS ============ */
    window.openLightbox = function(imageUrl, productName, productDetails) {
      document.getElementById('lightboxImage').src = imageUrl;
      document.getElementById('lightboxName').textContent = productName || '';
      document.getElementById('lightboxMeta').textContent = productDetails || '';
      document.getElementById('lightboxModal').classList.add('active');
      document.body.style.overflow = 'hidden';
    };

    window.closeLightbox = function() {
      document.getElementById('lightboxModal').classList.remove('active');
      document.body.style.overflow = '';
    };

    document.getElementById('lightboxModal')?.addEventListener('click', function(e) {
      if (e.target === this) { window.closeLightbox(); }
    });

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') { window.closeLightbox(); }
    });

    /* ============ IMAGE PREVIEW ============ */
    window.previewImage = function(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const preview = document.getElementById('imagePreview');
          preview.src = e.target.result;
          preview.style.display = 'block';
          document.querySelector('#imageUploadContainer i').style.display = 'none';
          document.querySelectorAll('#imageUploadContainer p').forEach(p => p.style.display = 'none');
        };
        reader.readAsDataURL(file);
      }
    };

    window.closeAddProductModal = function() {
      document.getElementById('addProductModal').classList.remove('active');
      document.getElementById('addProductForm').reset();
      document.getElementById('imagePreview').style.display = 'none';
      const container = document.getElementById('imageUploadContainer');
      container.querySelector('i').style.display = 'block';
      container.querySelectorAll('p').forEach(p => p.style.display = 'block');
    };

    /* ============ DASHBOARD LOADING ============ */
    async function loadDashboard() {
      showLoading();
      try {
        const [productsData, salesData, customersData] = await Promise.all([
          fetchProducts(), fetchSales(), fetchCustomers()
        ]);

        // Sort products for top product (by stock quantity as proxy for popularity)
        const sortedByStock = [...productsData].sort((a, b) => (b.stock_quantity || 0) - (a.stock_quantity || 0));
        const topProduct = sortedByStock[0] || { name: 'N/A', selling_price: 0, image_url: null, category: '' };

        const dashboardHtml = `
          <!-- KPI Cards -->
          <div class="kpi-grid">
            <div class="card">
              <div class="card-header"><span>Today's Revenue</span><i class="fas fa-dollar-sign"></i></div>
              <div class="card-value">$${calculateTodayRevenue(salesData)}</div>
              <div class="card-change">+12% vs yesterday</div>
            </div>
            <div class="card">
              <div class="card-header"><span>Units Sold</span><i class="fas fa-shoe-prints"></i></div>
              <div class="card-value">${calculateTodayUnits(salesData)}</div>
              <div class="card-change">${calculateTodayUnits(salesData)} today</div>
            </div>
            <div class="card">
              <div class="card-header"><span>Low Stock Alert</span><i class="fas fa-exclamation-triangle"></i></div>
              <div class="card-value">${getLowStockCount(productsData)}</div>
              <div class="card-change">items below threshold</div>
            </div>
            <div class="card">
              <div class="card-header"><span>Top Product</span><i class="fas fa-trophy"></i></div>
              <div class="top-product-card">
                ${topProduct.image_url 
                  ? `<img src="${topProduct.image_url}" class="top-product-img" alt="${topProduct.name}" onclick="window.openLightbox('${topProduct.image_url}', '${topProduct.name.replace(/'/g, "\\'")}', '$${topProduct.selling_price} | ${topProduct.category}')" onerror="this.onerror=null;this.style.display='none';">`
                  : ''
                }
                <div class="top-product-info">
                  <div class="card-value" style="font-size:1.5rem;">${topProduct.name}</div>
                  <div class="card-change">$${topProduct.selling_price} · ${topProduct.category || 'N/A'}</div>
                </div>
              </div>
            </div>
            <div class="card">
              <div class="card-header"><span>Total Customers</span><i class="fas fa-users"></i></div>
              <div class="card-value">${customersData.length}</div>
              <div class="card-change">total registered</div>
            </div>
            <div class="card">
              <div class="card-header"><span>Total Products</span><i class="fas fa-box"></i></div>
              <div class="card-value">${productsData.length}</div>
              <div class="card-change">in catalog</div>
            </div>
          </div>

          <!-- Quick Actions -->
          <div class="quick-actions">
            <button class="action-btn" onclick="window.openSaleModal()"><i class="fas fa-plus"></i> New Sale</button>
            <button class="action-btn" onclick="window.openAddProductModal()"><i class="fas fa-box"></i> Add Product</button>
            <button class="action-btn" onclick="window.exportReport()"><i class="fas fa-download"></i> Export Report</button>
          </div>

          <!-- Product Showcase Grid -->
          <div class="section-title"><i class="fas fa-images"></i> Product Showcase</div>
          <div class="product-showcase">
            ${productsData.slice(0, 8).map(p => `
              <div class="product-showcase-card" onclick="${p.image_url ? `window.openLightbox('${p.image_url}', '${p.name.replace(/'/g, "\\'")}', 'SKU: ${p.sku} | $${p.selling_price} | Stock: ${p.stock_quantity}')` : ''}" title="${p.name}">
                <div class="product-showcase-img-wrapper">
                  ${p.image_url 
                    ? `<img src="${p.image_url}" class="product-showcase-img" alt="${p.name}" onerror="this.onerror=null;this.parentElement.innerHTML='<i class=\\'fas fa-image product-showcase-placeholder\\'></i>';">`
                    : '<i class="fas fa-image product-showcase-placeholder"></i>'
                  }
                </div>
                <div class="product-showcase-info">
                  <div class="product-showcase-name">${p.name}</div>
                  <div class="product-showcase-details">
                    <span>${p.stock_quantity} in stock</span>
                    <span class="product-showcase-price">$${p.selling_price}</span>
                  </div>
                </div>
              </div>
            `).join('')}
            ${productsData.length === 0 ? '<div style="grid-column:1/-1;text-align:center;padding:40px;color:#8F8278;">No products yet. Click "Add Product" to get started!</div>' : ''}
          </div>

          <!-- Charts -->
          <div class="charts-grid">
            <div class="chart-container">
              <h3>Sales Trend (Last 7 Days)</h3>
              <canvas id="revenueChart"></canvas>
            </div>
            <div class="chart-container">
              <h3>Products by Category</h3>
              <canvas id="categoryChart"></canvas>
            </div>
          </div>

          <!-- Tables -->
          <div class="data-grid">
            <div class="data-table">
              <h3>Low Stock Alerts</h3>
              <table>
                <thead><tr><th>Image</th><th>Product</th><th>SKU</th><th>Stock</th><th>Price</th><th>Status</th></tr></thead>
                <tbody>
                  ${getLowStockTableRows(productsData)}
                </tbody>
              </table>
            </div>
            <div class="data-table">
              <h3>Recent Sales</h3>
              <table>
                <thead><tr><th>Date</th><th>Amount</th><th>Payment</th></tr></thead>
                <tbody>
                  ${getRecentSalesRows(salesData)}
                </tbody>
              </table>
            </div>
          </div>
        `;

        document.getElementById('contentArea').innerHTML = dashboardHtml;
        initRevenueChart(salesData);
        initCategoryChart(productsData);
      } catch (error) {
        console.error('Error loading dashboard:', error);
        document.getElementById('contentArea').innerHTML = `
          <div class="error-container" style="text-align:center; padding:60px;">
            <i class="fas fa-exclamation-triangle" style="font-size: 3rem; color: #C49A6C;"></i>
            <h3>Database Setup Required</h3>
            <p>Please run the SQL setup script in your Supabase SQL editor.</p>
            <button class="action-btn" style="margin-top:20px;" onclick="location.reload()">Retry Connection</button>
          </div>
        `;
      }
    }

    function calculateTodayRevenue(salesData) {
      const today = new Date().toDateString();
      return salesData.filter(s => new Date(s.sale_date).toDateString() === today)
        .reduce((sum, s) => sum + (s.total_amount || 0), 0).toFixed(2);
    }

    function calculateTodayUnits(salesData) {
      const today = new Date().toDateString();
      return salesData.filter(s => new Date(s.sale_date).toDateString() === today).length;
    }

    function getLowStockCount(productsData) {
      return productsData.filter(p => p.stock_quantity <= (p.low_stock_threshold || 5)).length;
    }

    function getLowStockTableRows(productsData) {
      const lowStock = productsData.filter(p => p.stock_quantity <= (p.low_stock_threshold || 5));
      if (lowStock.length === 0) {
        return '<tr><td colspan="6" style="text-align:center;">No low stock items 🎉</td></tr>';
      }
      return lowStock.slice(0, 5).map(p => `
        <tr>
          <td>
            ${p.image_url 
              ? `<img src="${p.image_url}" class="product-img-thumb" alt="${p.name}" onclick="event.stopPropagation();window.openLightbox('${p.image_url}', '${p.name.replace(/'/g, "\\'")}', 'SKU: ${p.sku} | $${p.selling_price} | Stock: ${p.stock_quantity}')" onerror="this.onerror=null;this.outerHTML='<i class=\\'fas fa-image img-placeholder-icon\\'></i>';">`
              : '<i class="fas fa-image img-placeholder-icon"></i>'
            }
          </td>
          <td><strong>${p.name}</strong></td>
          <td>${p.sku}</td>
          <td>${p.stock_quantity} left</td>
          <td>$${p.selling_price}</td>
          <td><span class="badge badge-warning">Low Stock</span></td>
        </tr>
      `).join('');
    }

    function getRecentSalesRows(salesData) {
      if (salesData.length === 0) return '<tr><td colspan="3">No sales yet</td></tr>';
      return salesData.slice(0, 5).map(sale => `
        <tr>
          <td>${new Date(sale.sale_date).toLocaleDateString()}</td>
          <td>$${sale.total_amount}</td>
          <td><span class="badge badge-success">${sale.payment_method}</span></td>
        </tr>
      `).join('');
    }

    function initRevenueChart(salesData) {
      const ctx = document.getElementById('revenueChart')?.getContext('2d');
      if (!ctx) return;
      const last7Days = Array.from({length: 7}, (_, i) => {
        const d = new Date(); d.setDate(d.getDate() - (6 - i)); return d;
      });
      const revenueByDay = last7Days.map(day => {
        return salesData.filter(s => new Date(s.sale_date).toDateString() === day.toDateString())
          .reduce((sum, s) => sum + (s.total_amount || 0), 0);
      });
      if (revenueChart) revenueChart.destroy();
      revenueChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: last7Days.map(d => d.toLocaleDateString('en-US', { weekday: 'short' })),
          datasets: [{
            label: 'Revenue ($)', data: revenueByDay,
            borderColor: '#C49A6C', backgroundColor: 'rgba(196,154,108,0.1)',
            tension: 0.4, fill: true
          }]
        },
        options: { responsive: true, maintainAspectRatio: true }
      });
    }

    function initCategoryChart(productsData) {
      const ctx = document.getElementById('categoryChart')?.getContext('2d');
      if (!ctx) return;
      const categories = {};
      productsData.forEach(p => {
        const cat = p.category || 'other';
        categories[cat] = (categories[cat] || 0) + 1;
      });
      if (categoryChart) categoryChart.destroy();
      categoryChart = new Chart(ctx, {
        type: 'pie',
        data: {
          labels: Object.keys(categories).map(c => c.toUpperCase()),
          datasets: [{
            data: Object.values(categories),
            backgroundColor: ['#C49A6C', '#E2B386', '#F0D5B0', '#A2794C', '#D4A574']
          }]
        },
        options: { responsive: true, maintainAspectRatio: true }
      });
    }

    async function fetchProducts() {
      const { data } = await supabaseClient.from('products').select('*').limit(100);
      return data || [];
    }

    async function fetchSales() {
      const { data } = await supabaseClient.from('sales').select('*').order('sale_date', { ascending: false }).limit(50);
      return data || [];
    }

    async function fetchCustomers() {
      const { data } = await supabaseClient.from('customers').select('*').limit(100);
      return data || [];
    }

    function showLoading() {
      document.getElementById('contentArea').innerHTML = `
        <div class="loading"><i class="fas fa-spinner spinner" style="font-size: 2rem;"></i><p style="margin-top: 20px;">Loading dashboard...</p></div>`;
    }

    window.openSaleModal = function() { document.getElementById('saleModal').classList.add('active'); };
    window.openAddProductModal = function() { document.getElementById('addProductModal').classList.add('active'); };
    window.exportReport = function() { alert('📊 Export feature: This would generate a CSV/PDF report.'); };

    // Add Product Form
    document.getElementById('addProductForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('productName').value.trim();
      const sku = document.getElementById('productSkuNew').value.trim();
      const category = document.getElementById('productCategory').value;
      const price = parseFloat(document.getElementById('productPrice').value);
      const stock = parseInt(document.getElementById('productStock').value);
      const imageFile = document.getElementById('productImageInput').files[0];
      if (!name || !sku || !price) { alert('Please fill in all required fields.'); return; }
      let image_url = null;
      if (imageFile) {
        try {
          const fileExt = imageFile.name.split('.').pop();
          const fileName = `${Date.now()}-${Math.random().toString(36).substring(2)}.${fileExt}`;
          const { error: uploadError } = await supabaseClient.storage.from('product-images').upload(fileName, imageFile, { cacheControl: '3600', upsert: false });
          if (uploadError) {
            alert('Image upload failed. Adding product without image.');
          } else {
            const { data: publicUrlData } = supabaseClient.storage.from('product-images').getPublicUrl(fileName);
            image_url = publicUrlData.publicUrl;
          }
        } catch (err) { alert('Image upload error. Adding product without image.'); }
      }
      const productData = { sku, name, category, selling_price: price, stock_quantity: stock, low_stock_threshold: 5 };
      if (image_url) productData.image_url = image_url;
      const { error: insertError } = await supabaseClient.from('products').insert([productData]);
      if (insertError) { alert('Error: ' + insertError.message); } else {
        alert('Product added!');
        window.closeAddProductModal();
        loadDashboard();
      }
    });

    // Sale Form
    document.getElementById('saleForm')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const sku = document.getElementById('productSku').value;
      const quantity = parseInt(document.getElementById('quantity').value);
      const paymentMethod = document.getElementById('paymentMethod').value;
      const { data: product } = await supabaseClient.from('products').select('*').eq('sku', sku).single();
      if (!product) { alert('Product not found!'); return; }
      if (product.stock_quantity < quantity) { alert('Insufficient stock!'); return; }
      const totalAmount = product.selling_price * quantity;
      const { error: saleError } = await supabaseClient.from('sales').insert([{ user_id: currentUser.id, total_amount: totalAmount, payment_method: paymentMethod }]);
      if (saleError) { alert('Error: ' + saleError.message); return; }
      await supabaseClient.from('products').update({ stock_quantity: product.stock_quantity - quantity }).eq('sku', sku);
      alert('Sale completed! Total: $' + totalAmount);
      document.getElementById('saleModal').classList.remove('active');
      loadDashboard();
    });

    // Sidebar
    function initSidebar() {
      const sidebar = document.getElementById('sidebar');
      const menuToggle = document.getElementById('menuToggle');
      const mobileOverlay = document.getElementById('mobileOverlay');
      menuToggle?.addEventListener('click', (e) => { e.stopPropagation(); sidebar.classList.toggle('mobile-open'); mobileOverlay.classList.toggle('active'); });
      mobileOverlay?.addEventListener('click', () => { sidebar.classList.remove('mobile-open'); mobileOverlay.classList.remove('active'); });
      document.querySelectorAll('.nav-item').forEach(link => {
        link.addEventListener('click', () => { if (window.innerWidth <= 768) { sidebar.classList.remove('mobile-open'); mobileOverlay.classList.remove('active'); } });
      });
      window.addEventListener('resize', () => { if (window.innerWidth > 768) { sidebar.classList.remove('mobile-open'); mobileOverlay.classList.remove('active'); } });
    }

    // Theme toggle
    document.getElementById('themeToggle')?.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
      const icon = document.querySelector('#themeToggle i');
      icon.classList.toggle('fa-moon'); icon.classList.toggle('fa-sun');
    });

    // Close modals
    document.querySelectorAll('.close-modal').forEach(btn => {
      btn.addEventListener('click', () => {
        const modal = btn.closest('.modal');
        if (modal) modal.classList.remove('active');
        if (modal && modal.id === 'addProductModal') {
          document.getElementById('addProductForm').reset();
          document.getElementById('imagePreview').style.display = 'none';
          const container = document.getElementById('imageUploadContainer');
          container.querySelector('i').style.display = 'block';
          container.querySelectorAll('p').forEach(p => p.style.display = 'block');
        }
      });
    });

    // Logout
    document.getElementById('userMenu')?.addEventListener('click', async () => {
      if (confirm('Logout?')) { await supabaseClient.auth.signOut(); window.location.href = 'login.html'; }
    });

    // Notifications
    document.getElementById('notifications')?.addEventListener('click', () => {
      alert('🔔 Notifications:\n- Check low stock items\n- Review sales\n- Update inventory');
    });

    initSidebar();
    initSupabase();
  })();
</script>
</body>
</html>
