<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SoulHub Management - Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@300;400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #FEFCF8;
      color: #1E1B18;
      overflow-x: hidden;
    }

    /* Dark Mode Styles */
    body.dark-mode {
      background: #1a1a1a;
      color: #FEFCF8;
    }

    body.dark-mode .sidebar,
    body.dark-mode .top-bar,
    body.dark-mode .card,
    body.dark-mode .modal-content {
      background: #2d2d2d;
      color: #FEFCF8;
    }

    body.dark-mode .card {
      background: #2d2d2d;
      border-color: #404040;
    }

    /* Layout */
    .app-container {
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 280px;
      background: white;
      border-right: 1px solid #F0EAE3;
      position: fixed;
      height: 100vh;
      overflow-y: auto;
      transition: all 0.3s ease;
      z-index: 100;
    }

    body.dark-mode .sidebar {
      background: #2d2d2d;
      border-right-color: #404040;
    }

    .sidebar-header {
      padding: 24px;
      border-bottom: 1px solid #F0EAE3;
    }

    body.dark-mode .sidebar-header {
      border-bottom-color: #404040;
    }

    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(135deg, #2C241E 0%, #A2794C 100%);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-menu {
      padding: 24px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      margin-bottom: 8px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      color: #5E5348;
    }

    body.dark-mode .nav-item {
      color: #B0A89F;
    }

    .nav-item:hover {
      background: #F9F4ED;
      color: #C49A6C;
    }

    body.dark-mode .nav-item:hover {
      background: #3d3d3d;
    }

    .nav-item.active {
      background: #C49A6C;
      color: white;
    }

    .nav-item i {
      width: 24px;
      font-size: 1.2rem;
    }

    /* Main Content */
    .main-content {
      flex: 1;
      margin-left: 280px;
      transition: all 0.3s ease;
    }

    /* Top Bar */
    .top-bar {
      background: white;
      border-bottom: 1px solid #F0EAE3;
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 99;
    }

    body.dark-mode .top-bar {
      background: #2d2d2d;
      border-bottom-color: #404040;
    }

    .page-title h1 {
      font-size: 1.8rem;
      font-weight: 600;
    }

    .top-bar-actions {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .theme-toggle, .notifications {
      cursor: pointer;
      font-size: 1.2rem;
      padding: 8px;
      border-radius: 50%;
      transition: all 0.2s;
    }

    .theme-toggle:hover, .notifications:hover {
      background: #F9F4ED;
      color: #C49A6C;
    }

    .user-menu {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      padding: 8px 16px;
      border-radius: 40px;
      background: #F9F4ED;
    }

    body.dark-mode .user-menu {
      background: #3d3d3d;
    }

    .user-avatar {
      width: 32px;
      height: 32px;
      background: #C49A6C;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }

    /* Content Area */
    .content-area {
      padding: 32px;
    }

    /* KPI Cards */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 24px;
      margin-bottom: 32px;
    }

    .card {
      background: white;
      border: 1px solid #F0EAE3;
      border-radius: 20px;
      padding: 24px;
      transition: all 0.3s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(0,0,0,0.1);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      color: #8F8278;
    }

    .card-value {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .card-change {
      font-size: 0.85rem;
      color: #4CAF50;
    }

    /* Charts Grid */
    .charts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 24px;
      margin-bottom: 32px;
    }

    .chart-container {
      background: white;
      border: 1px solid #F0EAE3;
      border-radius: 20px;
      padding: 24px;
    }

    body.dark-mode .chart-container {
      background: #2d2d2d;
      border-color: #404040;
    }

    .chart-container h3 {
      margin-bottom: 20px;
      font-size: 1.2rem;
    }

    canvas {
      max-height: 300px;
    }

    /* Tables and Lists */
    .data-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 24px;
      margin-bottom: 32px;
    }

    .data-table {
      background: white;
      border: 1px solid #F0EAE3;
      border-radius: 20px;
      padding: 24px;
    }

    body.dark-mode .data-table {
      background: #2d2d2d;
      border-color: #404040;
    }

    .data-table h3 {
      margin-bottom: 16px;
      font-size: 1.2rem;
    }

    .data-table table {
      width: 100%;
      border-collapse: collapse;
    }

    .data-table th,
    .data-table td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #F0EAE3;
    }

    body.dark-mode .data-table th,
    body.dark-mode .data-table td {
      border-bottom-color: #404040;
    }

    .badge {
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .badge-warning {
      background: #FFF4E5;
      color: #B76E00;
    }

    .badge-success {
      background: #E6F4EA;
      color: #2E7D32;
    }

    /* Quick Actions */
    .quick-actions {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 32px;
    }

    .action-btn {
      background: #1E1B18;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 40px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .action-btn:hover {
      background: #C49A6C;
      transform: translateY(-2px);
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: white;
      border-radius: 24px;
      padding: 32px;
      max-width: 500px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
    }

    body.dark-mode .modal-content {
      background: #2d2d2d;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .close-modal {
      cursor: pointer;
      font-size: 1.5rem;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 10px;
      border: 1px solid #E9E2D8;
      border-radius: 12px;
      font-family: 'Inter', sans-serif;
    }

    /* Mobile Responsive */
    @media (max-width: 768px) {
      .sidebar {
        transform: translateX(-100%);
      }
      .sidebar.mobile-open {
        transform: translateX(0);
      }
      .main-content {
        margin-left: 0;
      }
      .charts-grid,
      .data-grid {
        grid-template-columns: 1fr;
      }
      .kpi-grid {
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      }
      .top-bar {
        padding: 12px 16px;
      }
      .content-area {
        padding: 16px;
      }
      .menu-toggle {
        display: block;
        cursor: pointer;
        font-size: 1.5rem;
      }
    }

    @media (min-width: 769px) {
      .menu-toggle {
        display: none;
      }
    }

    .loading {
      text-align: center;
      padding: 40px;
    }

    .spinner {
      animation: spin 1s linear infinite;
    }
  </style>
</head>
<body>
<div class="app-container">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <i class="fas fa-chart-line"></i> SoulHub
      </div>
    </div>
    <nav class="nav-menu">
      <div class="nav-item active" data-page="dashboard">
        <i class="fas fa-tachometer-alt"></i>
        <span>Dashboard</span>
      </div>
      <div class="nav-item" data-page="inventory">
        <i class="fas fa-boxes"></i>
        <span>Inventory</span>
      </div>
      <div class="nav-item" data-page="sales">
        <i class="fas fa-shopping-cart"></i>
        <span>Sales & POS</span>
      </div>
      <div class="nav-item" data-page="customers">
        <i class="fas fa-users"></i>
        <span>Customers</span>
      </div>
      <div class="nav-item" data-page="staff" id="staffNav" style="display: none;">
        <i class="fas fa-user-tie"></i>
        <span>Staff Management</span>
      </div>
      <div class="nav-item" data-page="reports">
        <i class="fas fa-chart-bar"></i>
        <span>Reports</span>
      </div>
      <div class="nav-item" data-page="settings" id="settingsNav" style="display: none;">
        <i class="fas fa-cog"></i>
        <span>Settings</span>
      </div>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <div class="top-bar">
      <div class="menu-toggle" id="menuToggle">
        <i class="fas fa-bars"></i>
      </div>
      <div class="page-title">
        <h1 id="pageTitle">Dashboard</h1>
      </div>
      <div class="top-bar-actions">
        <div class="theme-toggle" id="themeToggle">
          <i class="fas fa-moon"></i>
        </div>
        <div class="notifications" id="notifications">
          <i class="fas fa-bell"></i>
        </div>
        <div class="user-menu" id="userMenu">
          <div class="user-avatar">
            <i class="fas fa-user"></i>
          </div>
          <span id="userName">Loading...</span>
          <i class="fas fa-chevron-down"></i>
        </div>
      </div>
    </div>

    <div class="content-area" id="contentArea">
      <!-- Dashboard Content will be loaded here -->
    </div>
  </main>
</div>

<!-- Modals -->
<div id="saleModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>New Sale</h2>
      <span class="close-modal">&times;</span>
    </div>
    <form id="saleForm">
      <div class="form-group">
        <label>Product SKU</label>
        <input type="text" id="productSku" required>
      </div>
      <div class="form-group">
        <label>Quantity</label>
        <input type="number" id="quantity" min="1" value="1" required>
      </div>
      <div class="form-group">
        <label>Customer Email (optional)</label>
        <input type="email" id="customerEmail">
      </div>
      <div class="form-group">
        <label>Payment Method</label>
        <select id="paymentMethod">
          <option value="cash">Cash</option>
          <option value="card">Card</option>
          <option value="mobile">Mobile Payment</option>
        </select>
      </div>
      <button type="submit" class="action-btn" style="width: 100%;">Process Sale</button>
    </form>
  </div>
</div>

<div id="stockModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Add Stock</h2>
      <span class="close-modal">&times;</span>
    </div>
    <form id="stockForm">
      <div class="form-group">
        <label>Product SKU</label>
        <input type="text" id="stockSku" required>
      </div>
      <div class="form-group">
        <label>Quantity to Add</label>
        <input type="number" id="addQuantity" min="1" required>
      </div>
      <button type="submit" class="action-btn" style="width: 100%;">Update Stock</button>
    </form>
  </div>
</div>

<script>
  // Supabase Configuration
  const SUPABASE_URL = "https://ulccyfajpaiuvqovvqyz.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVsY2N5ZmFqcGFpdXZxb3Z2cXl6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwNjIwMzAsImV4cCI6MjA5NTYzODAzMH0.mLGYFgTZ3ToIJD8KAiqbxr0h42H8PYN5xh1fyvTNvqo";
  
  let supabase;
  let currentUser = null;
  let revenueChart = null;
  let categoryChart = null;

  // Initialize Supabase
  async function initSupabase() {
    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    // Check current session
    const { data: { session }, error } = await supabase.auth.getSession();
    if (error || !session) {
      window.location.href = "login.html";
      return;
    }
    
    currentUser = session.user;
    
    // Get user profile
    const { data: profile } = await supabase
      .from('profiles')
      .select('*')
      .eq('id', currentUser.id)
      .single();
    
    if (profile) {
      document.getElementById('userName').textContent = profile.full_name || currentUser.email;
      
      // Show/hide admin-only nav items
      if (profile.role === 'admin') {
        document.getElementById('staffNav').style.display = 'flex';
        document.getElementById('settingsNav').style.display = 'flex';
      } else if (profile.role === 'manager') {
        document.getElementById('staffNav').style.display = 'flex';
      }
    }
    
    // Load dashboard
    loadDashboard();
    
    // Setup realtime subscriptions
    setupRealtime();
  }
  
  // Setup real-time updates
  function setupRealtime() {
    const channel = supabase.channel('db-changes');
    channel
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'sales' }, () => {
        loadDashboard();
      })
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'products' }, () => {
        loadDashboard();
      })
      .subscribe();
  }
  
  // Load Dashboard
  async function loadDashboard() {
    showLoading();
    
    // Fetch all required data
    const [salesData, productsData, customersData] = await Promise.all([
      fetchSalesData(),
      fetchProductsData(),
      fetchCustomersData()
    ]);
    
    const dashboardHtml = `
      <!-- KPI Cards -->
      <div class="kpi-grid">
        <div class="card">
          <div class="card-header">
            <span>Today's Revenue</span>
            <i class="fas fa-dollar-sign"></i>
          </div>
          <div class="card-value">$${calculateTodayRevenue(salesData)}</div>
          <div class="card-change">+12% vs yesterday</div>
        </div>
        <div class="card">
          <div class="card-header">
            <span>Units Sold</span>
            <i class="fas fa-shoe-prints"></i>
          </div>
          <div class="card-value">${calculateTodayUnits(salesData)}</div>
          <div class="card-change">${calculateTodayUnits(salesData)} today</div>
        </div>
        <div class="card">
          <div class="card-header">
            <span>Low Stock Alert</span>
            <i class="fas fa-exclamation-triangle"></i>
          </div>
          <div class="card-value">${getLowStockCount(productsData)}</div>
          <div class="card-change">items below threshold</div>
        </div>
        <div class="card">
          <div class="card-header">
            <span>Top Product</span>
            <i class="fas fa-trophy"></i>
          </div>
          <div class="card-value">${getTopProduct(productsData, salesData)}</div>
          <div class="card-change">best seller</div>
        </div>
        <div class="card">
          <div class="card-header">
            <span>Profit Margin</span>
            <i class="fas fa-chart-line"></i>
          </div>
          <div class="card-value">42%</div>
          <div class="card-change">+5% this month</div>
        </div>
        <div class="card">
          <div class="card-header">
            <span>Active Customers</span>
            <i class="fas fa-users"></i>
          </div>
          <div class="card-value">${customersData.length}</div>
          <div class="card-change">total registered</div>
        </div>
      </div>
      
      <!-- Quick Actions -->
      <div class="quick-actions">
        <button class="action-btn" onclick="openSaleModal()">
          <i class="fas fa-plus"></i> New Sale
        </button>
        <button class="action-btn" onclick="openStockModal()">
          <i class="fas fa-box"></i> Add Stock
        </button>
        <button class="action-btn" onclick="addCustomer()">
          <i class="fas fa-user-plus"></i> Add Customer
        </button>
        <button class="action-btn" onclick="exportReport()">
          <i class="fas fa-download"></i> Export Report
        </button>
      </div>
      
      <!-- Charts -->
      <div class="charts-grid">
        <div class="chart-container">
          <h3>Sales Trend (Last 7 Days)</h3>
          <canvas id="revenueChart"></canvas>
        </div>
        <div class="chart-container">
          <h3>Sales by Category</h3>
          <canvas id="categoryChart"></canvas>
        </div>
      </div>
      
      <!-- Data Tables -->
      <div class="data-grid">
        <div class="data-table">
          <h3>Low Stock Alerts</h3>
          <table>
            <thead>
              <tr><th>Product</th><th>Stock</th><th>Action</th></tr>
            </thead>
            <tbody>
              ${getLowStockTableRows(productsData)}
            </tbody>
          </table>
        </div>
        <div class="data-table">
          <h3>Recent Sales</h3>
          <table>
            <thead>
              <tr><th>Time</th><th>Amount</th><th>Items</th></tr>
            </thead>
            <tbody>
              ${getRecentSalesRows(salesData)}
            </tbody>
          </table>
        </div>
      </div>
    `;
    
    document.getElementById('contentArea').innerHTML = dashboardHtml;
    
    // Initialize charts
    initRevenueChart(salesData);
    initCategoryChart(productsData, salesData);
  }
  
  // Helper functions for data processing
  function calculateTodayRevenue(salesData) {
    const today = new Date().toDateString();
    const todaySales = salesData.filter(sale => new Date(sale.sale_date).toDateString() === today);
    return todaySales.reduce((sum, sale) => sum + sale.total_amount, 0).toFixed(2);
  }
  
  function calculateTodayUnits(salesData) {
    const today = new Date().toDateString();
    const todaySales = salesData.filter(sale => new Date(sale.sale_date).toDateString() === today);
    // This would need sale_items table, using placeholder
    return todaySales.length * 2;
  }
  
  function getLowStockCount(productsData) {
    return productsData.filter(p => p.stock_quantity <= (p.low_stock_threshold || 5)).length;
  }
  
  function getTopProduct(productsData, salesData) {
    if (productsData.length === 0) return 'N/A';
    return productsData[0]?.name || 'Nike Air Max';
  }
  
  function getLowStockTableRows(productsData) {
    const lowStock = productsData.filter(p => p.stock_quantity <= (p.low_stock_threshold || 5));
    if (lowStock.length === 0) {
      return '<tr><td colspan="3">No low stock items</td></tr>';
    }
    return lowStock.slice(0, 5).map(p => `
      <tr>
        <td>${p.name}</td>
        <td>${p.stock_quantity} left</td>
        <td><button class="badge badge-warning" onclick="reorderStock('${p.sku}')">Reorder</button></td>
      </tr>
    `).join('');
  }
  
  function getRecentSalesRows(salesData) {
    if (salesData.length === 0) {
      return '<tr><td colspan="3">No sales yet</td></tr>';
    }
    return salesData.slice(0, 5).map(sale => `
      <tr>
        <td>${new Date(sale.sale_date).toLocaleTimeString()}</td>
        <td>$${sale.total_amount}</td>
        <td>${sale.items_count || 2} items</td>
      </tr>
    `).join('');
  }
  
  function initRevenueChart(salesData) {
    const ctx = document.getElementById('revenueChart')?.getContext('2d');
    if (!ctx) return;
    
    const last7Days = Array.from({length: 7}, (_, i) => {
      const d = new Date();
      d.setDate(d.getDate() - i);
      return d.toDateString();
    }).reverse();
    
    const revenueByDay = last7Days.map(day => {
      const daySales = salesData.filter(sale => new Date(sale.sale_date).toDateString() === day);
      return daySales.reduce((sum, sale) => sum + sale.total_amount, 0);
    });
    
    if (revenueChart) revenueChart.destroy();
    revenueChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: last7Days.map(d => d.slice(0, 3)),
        datasets: [{
          label: 'Revenue',
          data: revenueByDay,
          borderColor: '#C49A6C',
          backgroundColor: 'rgba(196,154,108,0.1)',
          tension: 0.4,
          fill: true
        }]
      }
    });
  }
  
  function initCategoryChart(productsData, salesData) {
    const ctx = document.getElementById('categoryChart')?.getContext('2d');
    if (!ctx) return;
    
    const categories = ['sneakers', 'boots', 'casual', 'formal', 'sandals'];
    const categoryCounts = categories.map(cat => 
      productsData.filter(p => p.category === cat).length
    );
    
    if (categoryChart) categoryChart.destroy();
    categoryChart = new Chart(ctx, {
      type: 'pie',
      data: {
        labels: ['Sneakers', 'Boots', 'Casual', 'Formal', 'Sandals'],
        datasets: [{
          data: categoryCounts,
          backgroundColor: ['#C49A6C', '#E2B386', '#F0D5B0', '#A2794C', '#D4A574']
        }]
      }
    });
  }
  
  // API fetch functions
  async function fetchSalesData() {
    const { data, error } = await supabase
      .from('sales')
      .select('*')
      .order('sale_date', { ascending: false })
      .limit(50);
    
    if (error) console.error('Error fetching sales:', error);
    return data || [];
  }
  
  async function fetchProductsData() {
    const { data, error } = await supabase
      .from('products')
      .select('*')
      .limit(100);
    
    if (error) console.error('Error fetching products:', error);
    return data || [];
  }
  
  async function fetchCustomersData() {
    const { data, error } = await supabase
      .from('customers')
      .select('*')
      .limit(100);
    
    if (error) console.error('Error fetching customers:', error);
    return data || [];
  }
  
  // Modal functions
  function openSaleModal() {
    document.getElementById('saleModal').classList.add('active');
  }
  
  function openStockModal() {
    document.getElementById('stockModal').classList.add('active');
  }
  
  async function addCustomer() {
    const email = prompt('Enter customer email:');
    if (!email) return;
    
    const name = prompt('Enter customer name:');
    if (!name) return;
    
    const { error } = await supabase
      .from('customers')
      .insert([{ full_name: name, email: email, loyalty_points: 0 }]);
    
    if (error) {
      alert('Error adding customer: ' + error.message);
    } else {
      alert('Customer added successfully!');
      loadDashboard();
    }
  }
  
  async function reorderStock(sku) {
    const quantity = prompt('Enter reorder quantity:');
    if (!quantity) return;
    
    // Get current product
    const { data: product } = await supabase
      .from('products')
      .select('*')
      .eq('sku', sku)
      .single();
    
    if (product) {
      const { error } = await supabase
        .from('products')
        .update({ stock_quantity: product.stock_quantity + parseInt(quantity) })
        .eq('sku', sku);
      
      if (error) {
        alert('Error updating stock: ' + error.message);
      } else {
        alert('Stock updated successfully!');
        loadDashboard();
      }
    }
  }
  
  function exportReport() {
    alert('Export feature: Would generate CSV/PDF report of all sales and inventory');
  }
  
  function showLoading() {
    document.getElementById('contentArea').innerHTML = '<div class="loading"><i class="fas fa-spinner spinner"></i> Loading dashboard...</div>';
  }
  
  // Navigation
  document.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', async () => {
      document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
      item.classList.add('active');
      const page = item.dataset.page;
      document.getElementById('pageTitle').textContent = page.charAt(0).toUpperCase() + page.slice(1);
      
      if (page === 'dashboard') {
        loadDashboard();
      } else {
        document.getElementById('contentArea').innerHTML = `<div class="loading"><i class="fas fa-spinner spinner"></i> Loading ${page} page...<br><br>This feature is coming soon!</div>`;
      }
    });
  });
  
  // Theme toggle
  document.getElementById('themeToggle').addEventListener('click', () => {
    document.body.classList.toggle('dark-mode');
    const icon = document.querySelector('#themeToggle i');
    if (document.body.classList.contains('dark-mode')) {
      icon.classList.remove('fa-moon');
      icon.classList.add('fa-sun');
    } else {
      icon.classList.remove('fa-sun');
      icon.classList.add('fa-moon');
    }
  });
  
  // Mobile menu toggle
  document.getElementById('menuToggle').addEventListener('click', () => {
    document.getElementById('sidebar').classList.toggle('mobile-open');
  });
  
  // Close modals
  document.querySelectorAll('.close-modal').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.modal').forEach(modal => modal.classList.remove('active'));
    });
  });
  
  // Handle sale form submission
  document.getElementById('saleForm')?.addEventListener('submit', async (e) => {
    e.preventDefault();
    const sku = document.getElementById('productSku').value;
    const quantity = parseInt(document.getElementById('quantity').value);
    const paymentMethod = document.getElementById('paymentMethod').value;
    
    // Get product price
    const { data: product } = await supabase
      .from('products')
      .select('*')
      .eq('sku', sku)
      .single();
    
    if (!product) {
      alert('Product not found!');
      return;
    }
    
    if (product.stock_quantity < quantity) {
      alert('Insufficient stock!');
      return;
    }
    
    const totalAmount = product.selling_price * quantity;
    
    // Create sale
    const { data: sale, error: saleError } = await supabase
      .from('sales')
      .insert([{
        user_id: currentUser.id,
        total_amount: totalAmount,
        payment_method: paymentMethod
      }])
      .select()
      .single();
    
    if (saleError) {
      alert('Error processing sale: ' + saleError.message);
      return;
    }
    
    // Update stock
    await supabase
      .from('products')
      .update({ stock_quantity: product.stock_quantity - quantity })
      .eq('sku', sku);
    
    alert('Sale completed! Total: $' + totalAmount);
    document.getElementById('saleModal').classList.remove('active');
    loadDashboard();
  });
  
  // Handle stock form submission
  document.getElementById('stockForm')?.addEventListener('submit', async (e) => {
    e.preventDefault();
    const sku = document.getElementById('stockSku').value;
    const quantity = parseInt(document.getElementById('addQuantity').value);
    
    const { data: product } = await supabase
      .from('products')
      .select('*')
      .eq('sku', sku)
      .single();
    
    if (!product) {
      alert('Product not found!');
      return;
    }
    
    const { error } = await supabase
      .from('products')
      .update({ stock_quantity: product.stock_quantity + quantity })
      .eq('sku', sku);
    
    if (error) {
      alert('Error updating stock: ' + error.message);
    } else {
      alert('Stock updated successfully!');
      document.getElementById('stockModal').classList.remove('active');
      loadDashboard();
    }
  });
  
  // Logout (from user menu)
  document.getElementById('userMenu')?.addEventListener('click', async () => {
    if (confirm('Are you sure you want to logout?')) {
      await supabase.auth.signOut();
      window.location.href = 'login.html';
    }
  });
  
  // Notifications
  document.getElementById('notifications')?.addEventListener('click', () => {
    alert('🔔 Notifications:\n- Check low stock items\n- Review today\'s sales\n- Update inventory');
  });
  
  // Initialize
  initSupabase();
  
  // Sample data creator for empty database

    const sampleProducts = [
      { sku: 'NK-001', name: 'Nike Air Max', category: 'sneakers', selling_price: 129.99, stock_quantity: 15 },
      { sku: 'AD-001', name: 'Adidas Samba', category: 'casual', selling_price: 89.99, stock_quantity: 3 },
      { sku: 'NB-001', name: 'New Balance 574', category: 'casual', selling_price: 84.99, stock_quantity: 8 },
      { sku: 'TM-001', name: 'Timberland Boots', category: 'boots', selling_price: 159.99, stock_quantity: 2 }
    ];
    
    for (const product of sampleProducts) {
      const { error } = await supabase.from('products').upsert([product]);
      if (error) console.error('Error inserting sample:', error);
    }
  }
</script>
