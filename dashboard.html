<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SoulHub | Dashboard - Shoe Store Management</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #F5F0EA;
      color: #1E1B18;
    }
    .app-wrapper { display: flex; min-height: 100vh; }
    .sidebar {
      width: 280px;
      background: #1E1B18;
      color: #E9E2D8;
      position: fixed;
      height: 100vh;
      overflow-y: auto;
      z-index: 100;
    }
    .sidebar-header { padding: 28px 24px; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .sidebar-logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(135deg, #F5F0EA 0%, #C49A6C 100%);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sidebar-logo i { color: #C49A6C; font-size: 1.6rem; }
    .nav-menu { padding: 24px 0; }
    .nav-item {
      padding: 12px 24px;
      margin: 4px 12px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: all 0.2s;
      cursor: pointer;
      color: #C8C0B8;
    }
    .nav-item i { width: 24px; font-size: 1.2rem; }
    .nav-item.active { background: #C49A6C; color: #1E1B18; }
    .nav-item:hover:not(.active) { background: rgba(196,154,108,0.2); color: #F5F0EA; }
    .main-content {
      flex: 1;
      margin-left: 280px;
      padding: 24px 32px;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
    }
    .page-title h1 { font-family: 'Playfair Display', serif; font-size: 1.8rem; font-weight: 600; }
    .user-menu {
      display: flex;
      align-items: center;
      gap: 20px;
      background: white;
      padding: 6px 16px 6px 12px;
      border-radius: 60px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }
    .user-avatar {
      width: 40px;
      height: 40px;
      background: #C49A6C;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: white;
    }
    .logout-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.2rem;
      color: #8F8278;
      transition: 0.2s;
    }
    .logout-btn:hover { color: #C23D2E; }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 24px;
      margin-bottom: 40px;
    }
    .stat-card {
      background: white;
      border-radius: 28px;
      padding: 24px;
      transition: all 0.3s;
      border: 1px solid #EDE5DC;
    }
    .stat-card:hover { transform: translateY(-4px); box-shadow: 0 20px 30px -12px rgba(0,0,0,0.1); }
    .stat-icon { font-size: 2rem; color: #C49A6C; margin-bottom: 16px; }
    .stat-value { font-size: 2.2rem; font-weight: 800; margin-bottom: 6px; }
    .stat-label { color: #6B5E54; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px; }
    .section-card {
      background: white;
      border-radius: 28px;
      padding: 28px;
      margin-bottom: 32px;
      border: 1px solid #EDE5DC;
    }
    .section-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .low-stock-item {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #F0EAE3;
    }
    .btn-outline-sm, .action-btn {
      background: #1E1B18;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 40px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'Inter', sans-serif;
    }
    .btn-outline-sm {
      background: transparent;
      border: 1px solid #C49A6C;
      color: #1E1B18;
    }
    .btn-outline-sm:hover, .action-btn:hover { background: #C49A6C; color: #1E1B18; transform: translateY(-2px); }
    .loading-spinner { text-align: center; padding: 40px; }
    .error-box {
      background: #FEF2F0;
      border-left: 4px solid #C23D2E;
      padding: 16px;
      border-radius: 16px;
      margin-bottom: 20px;
    }
    @media (max-width: 900px) {
      .sidebar { transform: translateX(-100%); position: fixed; }
      .main-content { margin-left: 0; }
    }
  </style>
</head>
<body>
<div class="app-wrapper">
  <aside class="sidebar">
    <div class="sidebar-header"><div class="sidebar-logo"><i class="fas fa-chart-line"></i> SoulHub</div></div>
    <nav class="nav-menu">
      <div class="nav-item active" data-page="dashboard"><i class="fas fa-tachometer-alt"></i> Dashboard</div>
      <div class="nav-item" data-page="inventory"><i class="fas fa-boxes"></i> Inventory</div>
      <div class="nav-item" data-page="sales"><i class="fas fa-shopping-cart"></i> Sales</div>
      <div class="nav-item" data-page="staff"><i class="fas fa-users"></i> Staff</div>
      <div class="nav-item" data-page="reports"><i class="fas fa-chart-line"></i> Reports</div>
    </nav>
  </aside>

  <main class="main-content">
    <div class="top-bar">
      <div class="page-title"><h1>Dashboard</h1></div>
      <div class="user-menu">
        <div class="user-avatar" id="userAvatar">U</div>
        <span id="userName">User</span>
        <button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i></button>
      </div>
    </div>
    <div id="dashboardContent">
      <div class="loading-spinner"><i class="fas fa-spinner fa-pulse fa-2x"></i> Loading dashboard...</div>
    </div>
  </main>
</div>

<script>
  const SUPABASE_URL = "https://ulccyfajpaiuvqovvqyz.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_4kKDA0psp8AFpoTJlB-k8A_VS9IaWI9";
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let currentUser = null;

  // Helper: safely fetch count from a table
  async function safeCount(tableName) {
    try {
      const { count, error } = await supabase.from(tableName).select('*', { count: 'exact', head: true });
      if (error) throw error;
      return count || 0;
    } catch (err) {
      console.warn(`Error counting ${tableName}:`, err.message);
      return 0;
    }
  }

  // Helper: fetch low stock products (stock_quantity < 10, if column exists)
  async function fetchLowStockProducts() {
    try {
      // First check if 'stock_quantity' column exists by trying to select it
      const { data, error } = await supabase.from('products').select('name, stock_quantity').lt('stock_quantity', 10).limit(20);
      if (error) {
        if (error.message.includes('column') && error.message.includes('does not exist')) {
          return { items: [], count: 0, error: 'Products table exists but no stock_quantity column yet.' };
        }
        throw error;
      }
      return { items: data || [], count: data?.length || 0, error: null };
    } catch (err) {
      console.warn("Low stock fetch error:", err);
      return { items: [], count: 0, error: err.message };
    }
  }

  // Helper: fetch today's sales total
  async function fetchTodaySales() {
    try {
      const today = new Date().toISOString().split('T')[0];
      const { data, error } = await supabase
        .from('sales')
        .select('total_amount')
        .gte('sale_date', today);
      if (error) throw error;
      const total = data?.reduce((sum, s) => sum + parseFloat(s.total_amount || 0), 0) || 0;
      return { total, error: null };
    } catch (err) {
      console.warn("Today's sales error:", err);
      return { total: 0, error: err.message };
    }
  }

  async function renderDashboard() {
    const container = document.getElementById('dashboardContent');
    container.innerHTML = '<div class="loading-spinner"><i class="fas fa-spinner fa-pulse fa-2x"></i> Loading data...</div>';
    
    // Fetch all data in parallel
    const [totalProducts, staffCount, lowStockResult, salesResult] = await Promise.all([
      safeCount('products'),
      safeCount('staff'),
      fetchLowStockProducts(),
      fetchTodaySales()
    ]);
    
    const hasErrors = (lowStockResult.error || salesResult.error);
    const errorMessages = [];
    if (lowStockResult.error && lowStockResult.error !== 'Products table exists but no stock_quantity column yet.') 
      errorMessages.push(`Products: ${lowStockResult.error}`);
    if (salesResult.error) errorMessages.push(`Sales: ${salesResult.error}`);
    
    let lowStockHtml = '';
    if (lowStockResult.error && lowStockResult.error.includes('no stock_quantity column')) {
      lowStockHtml = '<p>⚠️ The "products" table is missing the <strong>stock_quantity</strong> column. Run the setup SQL to add it.</p>';
    } else if (lowStockResult.items.length === 0) {
      lowStockHtml = '<p>✅ All products have sufficient stock (10+ units).</p>';
    } else {
      lowStockHtml = `<ul class="low-stock-list">${lowStockResult.items.map(p => `<li class="low-stock-item"><span>${escapeHtml(p.name)}</span><span><strong>${p.stock_quantity}</strong> left</span></li>`).join('')}</ul>`;
    }
    
    const dashboardHtml = `
      ${hasErrors ? `<div class="error-box"><i class="fas fa-exclamation-triangle"></i> Some data could not be loaded: ${errorMessages.join('; ')}</div>` : ''}
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-icon"><i class="fas fa-shoe-prints"></i></div><div class="stat-value">${totalProducts}</div><div class="stat-label">Total Products</div></div>
        <div class="stat-card"><div class="stat-icon"><i class="fas fa-exclamation-triangle"></i></div><div class="stat-value">${lowStockResult.count}</div><div class="stat-label">Low Stock Items</div></div>
        <div class="stat-card"><div class="stat-icon"><i class="fas fa-dollar-sign"></i></div><div class="stat-value">$${salesResult.total.toFixed(2)}</div><div class="stat-label">Today's Sales</div></div>
        <div class="stat-card"><div class="stat-icon"><i class="fas fa-users"></i></div><div class="stat-value">${staffCount}</div><div class="stat-label">Staff Members</div></div>
      </div>
      <div class="section-card">
        <div class="section-title"><i class="fas fa-box-open"></i> Low Stock Alerts</div>
        ${lowStockHtml}
        <button class="btn-outline-sm" style="margin-top:16px" onclick="window.location.href='inventory.html'">Manage Inventory →</button>
      </div>
      <div class="section-card">
        <div class="section-title"><i class="fas fa-chart-simple"></i> Quick Actions</div>
        <div style="display:flex; gap:12px; flex-wrap:wrap">
          <button class="action-btn" onclick="window.location.href='sales.html'"><i class="fas fa-plus-circle"></i> New Sale</button>
          <button class="action-btn" onclick="window.location.href='inventory.html'"><i class="fas fa-edit"></i> Update Stock</button>
          <button class="action-btn" onclick="window.location.href='staff.html'"><i class="fas fa-user-plus"></i> Manage Staff</button>
        </div>
      </div>
    `;
    container.innerHTML = dashboardHtml;
  }

  function escapeHtml(str) { return String(str || '').replace(/[&<>]/g, function(m){ if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }

  async function loadUserProfile() {
    const { data: { user }, error } = await supabase.auth.getUser();
    if (error || !user) {
      window.location.href = 'login.html';
      return;
    }
    currentUser = user;
    const { data: profile } = await supabase.from('profiles').select('full_name').eq('id', user.id).single();
    const name = profile?.full_name || user.email.split('@')[0];
    document.getElementById('userName').innerText = name;
    document.getElementById('userAvatar').innerText = name.charAt(0).toUpperCase();
  }

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await supabase.auth.signOut();
    window.location.href = 'login.html';
  });

  document.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', () => {
      const page = item.dataset.page;
      if (page === 'dashboard') renderDashboard();
      else window.location.href = `${page}.html`;
    });
  });

  loadUserProfile().then(() => renderDashboard());
</script>
</body>
</html>
