<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SoulHub Management – Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #FEFCF8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .login-card {
      max-width: 460px;
      width: 100%;
      background: white;
      border-radius: 36px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.08);
      border: 1px solid #F0EAE3;
      overflow: hidden;
    }
    .login-header {
      background: #1E1B18;
      padding: 2rem;
      text-align: center;
      color: white;
    }
    .login-header h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
    }
    .login-body {
      padding: 2rem;
    }
    .form-group {
      margin-bottom: 1.3rem;
    }
    label {
      font-weight: 600;
      font-size: 0.85rem;
      margin-bottom: 0.4rem;
      display: block;
    }
    input {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid #E9E2D8;
      border-radius: 32px;
      font-family: 'Inter', sans-serif;
      transition: all 0.3s ease;
    }
    input:focus {
      outline: none;
      border-color: #C49A6C;
      box-shadow: 0 0 0 3px rgba(196,154,108,0.1);
    }
    .btn-login {
      width: 100%;
      background: #1E1B18;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 40px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: all 0.3s ease;
    }
    .btn-login:hover:not(:disabled) {
      background: #C49A6C;
      color: #1E1B18;
      transform: translateY(-2px);
    }
    .btn-login:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }
    .alert {
      padding: 10px;
      border-radius: 28px;
      font-size: 0.8rem;
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .alert-error {
      background: #FEF2F0;
      color: #C23D2E;
    }
    .alert-success {
      background: #E6F4EA;
      color: #2E7D32;
    }
    .register-link {
      text-align: center;
      margin-top: 1.2rem;
      font-size: 0.85rem;
    }
    .register-link a {
      color: #C49A6C;
      text-decoration: none;
      font-weight: 600;
    }
    .register-link a:hover {
      text-decoration: underline;
    }
    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid #f3f3f3;
      border-top: 2px solid #C49A6C;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
<div class="login-card" id="loginCard">
  <div class="login-header">
    <h2><i class="fas fa-chart-line"></i> SoulHub</h2>
    <p>Sign in to your management console</p>
  </div>
  <div class="login-body">
    <div id="messageArea"></div>
    <form id="loginForm">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="loginEmail" required autocomplete="email">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" required autocomplete="current-password">
      </div>
      <button type="button" class="btn-login" id="loginBtn">
        <i class="fas fa-arrow-right-to-bracket"></i> Login
      </button>
    </form>
    <div class="register-link">
      Don't have an account? <a href="registration.html">Register now →</a>
    </div>
  </div>
</div>

<script>
  // Supabase configuration
  const SUPABASE_URL = "https://ulccyfajpaiuvqovvqyz.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_4kKDA0psp8AFpoTJlB-k8A_VS9IaWI9";
  
  console.log("Supabase URL:", SUPABASE_URL);
  console.log("Supabase Key exists:", !!SUPABASE_ANON_KEY);
  
  let supabase;
  
  try {
    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    console.log("Supabase client created successfully");
  } catch (err) {
    console.error("Failed to create Supabase client:", err);
    alert("Failed to initialize. Please check console.");
  }
  
  const messageArea = document.getElementById('messageArea');
  const loginBtn = document.getElementById('loginBtn');
  const emailInput = document.getElementById('loginEmail');
  const passwordInput = document.getElementById('loginPassword');

  function showMessage(text, type) {
    messageArea.innerHTML = `<div class="alert alert-${type}"><i class="fas ${type === 'error' ? 'fa-exclamation-circle' : 'fa-check-circle'}"></i> ${text}</div>`;
    setTimeout(() => { 
      if (messageArea.firstChild) messageArea.firstChild.remove(); 
    }, 5000);
  }

  // Check if user is already logged in
  async function checkExistingSession() {
    if (!supabase) return;
    
    try {
      console.log("Checking existing session...");
      const { data: { session }, error } = await supabase.auth.getSession();
      if (error) {
        console.error("Session check error:", error);
        return;
      }
      if (session) {
        console.log("Existing session found, redirecting to dashboard");
        window.location.href = "dashboard.html";
      } else {
        console.log("No existing session");
      }
    } catch (err) {
      console.error("Session check exception:", err);
    }
  }

  // Handle login
  async function handleLogin() {
    console.log("Login button clicked");
    
    const email = emailInput.value.trim();
    const password = passwordInput.value;
    
    console.log("Email entered:", email);
    
    if (!email) {
      showMessage("Please enter your email", "error");
      return;
    }
    
    if (!password) {
      showMessage("Please enter your password", "error");
      return;
    }
    
    if (!supabase) {
      showMessage("System not initialized. Please refresh the page.", "error");
      console.error("Supabase client is null");
      return;
    }
    
    // Show loading state
    loginBtn.disabled = true;
    loginBtn.innerHTML = '<span class="loading"></span> Logging in...';
    
    try {
      console.log("Attempting to sign in with password...");
      const { data, error } = await supabase.auth.signInWithPassword({ 
        email, 
        password 
      });
      
      console.log("Login response:", { data: data ? { user: data.user?.email } : null, error: error?.message });
      
      if (error) {
        console.error("Login error:", error);
        showMessage(error.message, "error");
        loginBtn.disabled = false;
        loginBtn.innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i> Login';
      } else {
        console.log("Login successful! User:", data.user?.email);
        showMessage("Login successful! Redirecting to dashboard...", "success");
        // Redirect to dashboard after successful login
        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 1000);
      }
    } catch (err) {
      console.error("Exception during login:", err);
      showMessage("An unexpected error occurred. Please try again.", "error");
      loginBtn.disabled = false;
      loginBtn.innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i> Login';
    }
  }

  // Attach event listener to button (using type="button" so no form submission)
  if (loginBtn) {
    console.log("Attaching click handler to login button");
    loginBtn.addEventListener('click', handleLogin);
  } else {
    console.error("loginBtn not found!");
  }
  
  // Also allow Enter key to submit
  if (emailInput && passwordInput) {
    const inputs = [emailInput, passwordInput];
    inputs.forEach(input => {
      input.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          console.log("Enter key pressed");
          e.preventDefault();
          handleLogin();
        }
      });
    });
  }

  // Show registration success message if redirected
  if (window.location.search.includes('registered=true')) {
    const emailParam = new URLSearchParams(window.location.search).get('email');
    showMessage(`✅ Account created successfully for ${emailParam || 'you'}! Please log in.`, "success");
  }

  // Check for existing session on page load
  checkExistingSession();
  
  console.log("Login page script loaded successfully");
</script>
</body>
</html>
