<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SoulHub Management – Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #FEFCF8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .login-card {
      max-width: 460px;
      width: 100%;
      background: white;
      border-radius: 36px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.08);
      border: 1px solid #F0EAE3;
      overflow: hidden;
    }
    .login-header {
      background: #1E1B18;
      padding: 2rem;
      text-align: center;
      color: white;
    }
    .login-header h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
    }
    .login-header p {
      opacity: 0.9;
      margin-top: 8px;
      font-size: 0.9rem;
    }
    .login-body {
      padding: 2rem;
    }
    .form-group {
      margin-bottom: 1.3rem;
    }
    label {
      font-weight: 600;
      font-size: 0.85rem;
      margin-bottom: 0.4rem;
      display: block;
      color: #2A241F;
    }
    input {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid #E9E2D8;
      border-radius: 32px;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      transition: all 0.3s ease;
    }
    input:focus {
      outline: none;
      border-color: #C49A6C;
      box-shadow: 0 0 0 3px rgba(196,154,108,0.1);
    }
    .btn-login {
      width: 100%;
      background: #1E1B18;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 40px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-login:hover:not(:disabled) {
      background: #C49A6C;
      color: #1E1B18;
      transform: translateY(-2px);
    }
    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .alert {
      padding: 12px 16px;
      border-radius: 28px;
      font-size: 0.85rem;
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
      gap: 10px;
      animation: slideIn 0.3s ease;
    }
    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .alert-error {
      background: #FEF2F0;
      color: #C23D2E;
      border-left: 4px solid #C23D2E;
    }
    .alert-success {
      background: #E6F4EA;
      color: #2E7D32;
      border-left: 4px solid #2E7D32;
    }
    .alert-info {
      background: #E8F0FE;
      color: #1A56DB;
      border-left: 4px solid #1A56DB;
    }
    .register-link {
      text-align: center;
      margin-top: 1.5rem;
      padding-top: 1rem;
      border-top: 1px solid #F0EAE3;
      font-size: 0.85rem;
    }
    .register-link a {
      color: #C49A6C;
      text-decoration: none;
      font-weight: 600;
    }
    .register-link a:hover {
      text-decoration: underline;
    }
    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid #fff;
      border-top-color: #C49A6C;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .spinner-dark {
      border: 2px solid #1E1B18;
      border-top-color: #C49A6C;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .debug-info {
      margin-top: 1rem;
      padding: 8px;
      background: #F9F4ED;
      border-radius: 8px;
      font-size: 0.7rem;
      color: #6B5E54;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>
<div class="login-card">
  <div class="login-header">
    <h2><i class="fas fa-chart-line"></i> SoulHub</h2>
    <p>Sign in to your management console</p>
  </div>
  <div class="login-body">
    <div id="messageArea"></div>
    
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="loginEmail" placeholder="hello@soulhub.com" autocomplete="email">
    </div>
    
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="Enter your password" autocomplete="current-password">
    </div>
    
    <button class="btn-login" id="loginBtn">
      <i class="fas fa-arrow-right-to-bracket"></i> Login
    </button>
    
    <div class="register-link">
      Don't have an account? <a href="registration.html">Register now →</a>
    </div>
    
    <div class="debug-info" id="debugInfo">
      <i class="fas fa-terminal"></i> Debug console ready
    </div>
  </div>
</div>

<script>
  (function() {
    // ==================== CONFIGURATION ====================
    const SUPABASE_URL = "https://ulccyfajpaiuvqovvqyz.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_4kKDA0psp8AFpoTJlB-k8A_VS9IaWI9";
    // ========================================================
    
    let supabase = null;
    let initializationError = null;
    
    // Debug function
    function debugLog(message, type = 'info') {
      console.log(`[${type.toUpperCase()}] ${message}`);
      const debugDiv = document.getElementById('debugInfo');
      if (debugDiv) {
        debugDiv.style.display = 'block';
        debugDiv.innerHTML = `<i class="fas fa-terminal"></i> ${message}`;
        setTimeout(() => {
          if (debugDiv.innerHTML.includes(message)) {
            // Keep last message
          }
        }, 3000);
      }
    }
    
    // Initialize Supabase
    try {
      if (typeof window.supabase !== 'undefined' && window.supabase.createClient) {
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        debugLog('✅ Supabase client initialized successfully', 'success');
      } else {
        initializationError = 'Supabase library not loaded';
        debugLog('❌ Supabase library not found', 'error');
      }
    } catch (err) {
      initializationError = err.message;
      debugLog(`❌ Supabase init error: ${err.message}`, 'error');
    }
    
    // DOM elements
    const emailInput = document.getElementById('loginEmail');
    const passwordInput = document.getElementById('loginPassword');
    const loginBtn = document.getElementById('loginBtn');
    const messageArea = document.getElementById('messageArea');
    
    // Show message function
    function showMessage(text, type) {
      const icon = {
        'error': 'fa-exclamation-circle',
        'success': 'fa-check-circle',
        'info': 'fa-info-circle'
      };
      messageArea.innerHTML = `<div class="alert alert-${type}"><i class="fas ${icon[type]}"></i> ${text}</div>`;
      setTimeout(() => {
        if (messageArea.firstChild) {
          messageArea.firstChild.remove();
        }
      }, 5000);
    }
    
    // Check existing session
    async function checkExistingSession() {
      if (!supabase) {
        debugLog('Cannot check session: Supabase not ready', 'error');
        return false;
      }
      
      try {
        debugLog('Checking for existing session...', 'info');
        const { data: { session }, error } = await supabase.auth.getSession();
        
        if (error) {
          debugLog(`Session check error: ${error.message}`, 'error');
          return false;
        }
        
        if (session) {
          debugLog(`Existing session found for: ${session.user.email}`, 'success');
          showMessage('You are already logged in! Redirecting...', 'success');
          setTimeout(() => {
            window.location.href = "dashboard.html";
          }, 1000);
          return true;
        }
        
        debugLog('No existing session found', 'info');
        return false;
      } catch (err) {
        debugLog(`Session check exception: ${err.message}`, 'error');
        return false;
      }
    }
    
    // Login function
    async function handleLogin() {
      // Clear previous messages
      messageArea.innerHTML = '';
      
      // Get values
      const email = emailInput ? emailInput.value.trim() : '';
      const password = passwordInput ? passwordInput.value : '';
      
      debugLog(`Login attempt for: ${email}`, 'info');
      
      // Validation
      if (!email) {
        showMessage('Please enter your email address', 'error');
        debugLog('Validation failed: No email provided', 'error');
        return;
      }
      
      if (!password) {
        showMessage('Please enter your password', 'error');
        debugLog('Validation failed: No password provided', 'error');
        return;
      }
      
      if (!supabase) {
        showMessage('System not initialized. Please refresh the page.', 'error');
        debugLog(`Login failed: Supabase not initialized - ${initializationError}`, 'error');
        return;
      }
      
      // Disable button and show loading
      loginBtn.disabled = true;
      loginBtn.innerHTML = '<span class="spinner"></span> Logging in...';
      
      try {
        debugLog('Calling supabase.auth.signInWithPassword...', 'info');
        
        const { data, error } = await supabase.auth.signInWithPassword({
          email: email,
          password: password
        });
        
        if (error) {
          debugLog(`Login error: ${error.message}`, 'error');
          showMessage(error.message, 'error');
          loginBtn.disabled = false;
          loginBtn.innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i> Login';
          return;
        }
        
        if (data && data.user) {
          debugLog(`Login successful for: ${data.user.email}`, 'success');
          showMessage('Login successful! Redirecting to dashboard...', 'success');
          
          setTimeout(() => {
            window.location.href = "dashboard.html";
          }, 1500);
        } else {
          debugLog('Login returned success but no user data', 'error');
          showMessage('Login failed. Please try again.', 'error');
          loginBtn.disabled = false;
          loginBtn.innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i> Login';
        }
        
      } catch (err) {
        debugLog(`Login exception: ${err.message}`, 'error');
        showMessage(`Login error: ${err.message}`, 'error');
        loginBtn.disabled = false;
        loginBtn.innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i> Login';
      }
    }
    
    // Attach event listeners
    if (loginBtn) {
      loginBtn.addEventListener('click', handleLogin);
      debugLog('Login button event listener attached', 'info');
    } else {
      debugLog('ERROR: Login button not found in DOM', 'error');
    }
    
    // Enter key support
    if (emailInput) {
      emailInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          debugLog('Enter key pressed on email field', 'info');
          handleLogin();
        }
      });
    }
    
    if (passwordInput) {
      passwordInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          debugLog('Enter key pressed on password field', 'info');
          handleLogin();
        }
      });
    }
    
    // Check for registration success message
    if (window.location.search.includes('registered=true')) {
      const urlParams = new URLSearchParams(window.location.search);
      const email = urlParams.get('email');
      if (email) {
        showMessage(`✅ Account created successfully for ${email}! Please log in.`, 'success');
        debugLog(`Registration success detected for: ${email}`, 'success');
      } else {
        showMessage('✅ Account created successfully! Please log in.', 'success');
        debugLog('Registration success detected', 'success');
      }
    }
    
    // Test Supabase connection
    async function testConnection() {
      if (!supabase) {
        debugLog('Cannot test connection: Supabase not ready', 'error');
        return;
      }
      
      try {
        debugLog('Testing Supabase connection...', 'info');
        const { error } = await supabase.from('profiles').select('count', { count: 'exact', head: true });
        
        if (error) {
          debugLog(`Connection test warning: ${error.message}`, 'warning');
          showMessage(`Note: ${error.message}. You may need to setup your database.`, 'info');
        } else {
          debugLog('✅ Supabase connection test passed!', 'success');
        }
      } catch (err) {
        debugLog(`Connection test failed: ${err.message}`, 'error');
      }
    }
    
    // Initialize on page load
    window.addEventListener('DOMContentLoaded', async () => {
      debugLog('Page loaded, initializing...', 'info');
      await testConnection();
      await checkExistingSession();
      debugLog('Ready for login', 'success');
    });
    
  })();
</script>
</body>
</html>
