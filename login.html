<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SoulHub Management – Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #FEFCF8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .login-card {
      max-width: 460px;
      width: 100%;
      background: white;
      border-radius: 36px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.08);
      border: 1px solid #F0EAE3;
      overflow: hidden;
    }
    .login-header {
      background: #1E1B18;
      padding: 2rem;
      text-align: center;
      color: white;
    }
    .login-header h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
    }
    .login-body {
      padding: 2rem;
    }
    .form-group {
      margin-bottom: 1.3rem;
    }
    label {
      font-weight: 600;
      font-size: 0.85rem;
      margin-bottom: 0.4rem;
      display: block;
    }
    input {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid #E9E2D8;
      border-radius: 32px;
      font-family: 'Inter', sans-serif;
    }
    input:focus {
      outline: none;
      border-color: #C49A6C;
    }
    .btn-login {
      width: 100%;
      background: #1E1B18;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 40px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 0.5rem;
    }
    .btn-login:hover {
      background: #C49A6C;
      color: #1E1B18;
    }
    .alert {
      padding: 10px;
      border-radius: 28px;
      font-size: 0.8rem;
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .alert-error {
      background: #FEF2F0;
      color: #C23D2E;
    }
    .alert-success {
      background: #E6F4EA;
      color: #2E7D32;
    }
    .profile-box {
      background: #F9F4ED;
      border-radius: 24px;
      padding: 1rem;
      margin-bottom: 1.2rem;
    }
    .logout-btn {
      background: transparent;
      border: 1px solid #C49A6C;
      color: #C49A6C;
      padding: 8px 16px;
      border-radius: 40px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      margin-top: 1rem;
    }
    .register-link {
      text-align: center;
      margin-top: 1.2rem;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
<div class="login-card" id="loginCard">
  <div class="login-header">
    <h2><i class="fas fa-chart-line"></i> SoulHub</h2>
    <p>Sign in to your management console</p>
  </div>
  <div class="login-body" id="loginFormContainer">
    <div id="messageArea"></div>
    <form id="loginForm">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="loginEmail" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" required>
      </div>
      <button type="submit" class="btn-login"><i class="fas fa-arrow-right-to-bracket"></i> Login</button>
    </form>
    <div class="register-link">
      Don't have an account? <a href="registration.html" style="color:#C49A6C;">Register now →</a>
    </div>
  </div>

  <div class="login-body" id="dashboardContainer" style="display: none;">
    <div id="profileCard" class="profile-box"></div>
    <button id="logoutBtn" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Sign out</button>
    <div class="register-link">
      <a href="index.html" style="color:#C49A6C;">← Back to SoulHub landing</a>
    </div>
  </div>
</div>

<script>
  // CORRECT Supabase configuration from your .env.local
  const SUPABASE_URL = "https://ulccyfajpaiuvqovvqyz.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_4kKDA0psp8AFpoTJlB-k8A_VS9IaWI9";
  
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const loginContainer = document.getElementById('loginFormContainer');
  const dashboardContainer = document.getElementById('dashboardContainer');
  const profileDiv = document.getElementById('profileCard');
  const messageArea = document.getElementById('messageArea');

  function showMessage(text, type) {
    messageArea.innerHTML = `<div class="alert alert-${type}"><i class="fas ${type === 'error' ? 'fa-exclamation-circle' : 'fa-check-circle'}"></i> ${text}</div>`;
    setTimeout(() => { if (messageArea.firstChild) messageArea.firstChild.remove(); }, 4000);
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  async function loadUserDashboard(user) {
    // Try to get profile from profiles table
    const { data: profile, error } = await supabase
      .from('profiles')
      .select('full_name, role, store_name, phone, store_address, established_year')
      .eq('id', user.id)
      .single();

    if (error || !profile) {
      // If profile doesn't exist yet, use user metadata from auth
      const userMeta = user.user_metadata || {};
      profileDiv.innerHTML = `
        <div style="display:flex; align-items:center; gap:12px; margin-bottom:12px;">
          <i class="fas fa-user-circle" style="font-size:2.2rem; color:#C49A6C;"></i>
          <div><strong style="font-size:1.2rem;">${escapeHtml(userMeta.full_name || user.email?.split('@')[0] || 'User')}</strong><br>${escapeHtml(user.email)}</div>
        </div>
        <div style="display:grid; gap:8px;">
          <div><i class="fas fa-tag"></i> <strong>Role:</strong> <span style="background:#E9D9CC; padding:2px 10px; border-radius:40px;">${escapeHtml(userMeta.role || 'staff')}</span></div>
          ${userMeta.store_name ? `<div><i class="fas fa-store"></i> ${escapeHtml(userMeta.store_name)}</div>` : ''}
        </div>
        <p style="margin-top:12px; font-size:0.8rem; color:#8F8278;"><i class="fas fa-info-circle"></i> Profile setup in progress</p>
      `;
    } else {
      profileDiv.innerHTML = `
        <div style="display:flex; align-items:center; gap:12px; margin-bottom:12px;">
          <i class="fas fa-user-circle" style="font-size:2.2rem; color:#C49A6C;"></i>
          <div><strong style="font-size:1.2rem;">${escapeHtml(profile.full_name)}</strong><br>${escapeHtml(user.email)}</div>
        </div>
        <div style="display:grid; gap:8px;">
          <div><i class="fas fa-tag"></i> <strong>Role:</strong> <span style="background:#E9D9CC; padding:2px 10px; border-radius:40px;">${escapeHtml(profile.role)}</span></div>
          ${profile.store_name ? `<div><i class="fas fa-store"></i> ${escapeHtml(profile.store_name)}</div>` : ''}
          ${profile.phone ? `<div><i class="fas fa-phone"></i> ${escapeHtml(profile.phone)}</div>` : ''}
          ${profile.store_address ? `<div><i class="fas fa-location-dot"></i> ${escapeHtml(profile.store_address)}</div>` : ''}
        </div>
      `;
    }
    loginContainer.style.display = 'none';
    dashboardContainer.style.display = 'block';
  }

  async function checkSession() {
    const { data: { session } } = await supabase.auth.getSession();
    if (session) {
      await loadUserDashboard(session.user);
    } else {
      loginContainer.style.display = 'block';
      dashboardContainer.style.display = 'none';
    }
  }

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPassword').value;
    
    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
    if (error) {
      showMessage(error.message, "error");
    } else {
      showMessage("Login successful! Redirecting...", "success");
      await loadUserDashboard(data.user);
    }
  });

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await supabase.auth.signOut();
    loginContainer.style.display = 'block';
    dashboardContainer.style.display = 'none';
    document.getElementById('loginForm').reset();
    showMessage("You have been signed out.", "success");
  });

  // Show registration success message if redirected
  if (window.location.search.includes('registered=true')) {
    const emailParam = new URLSearchParams(window.location.search).get('email');
    showMessage(`✅ Account created successfully for ${emailParam || 'you'}! Please log in.`, "success");
  }

  checkSession();
</script>
</body>
</html>
