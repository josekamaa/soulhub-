<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SoulHub Management – Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #FEFCF8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .login-card {
      max-width: 460px;
      width: 100%;
      background: white;
      border-radius: 36px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.08);
      border: 1px solid #F0EAE3;
      overflow: hidden;
    }
    .login-header {
      background: #1E1B18;
      padding: 2rem;
      text-align: center;
      color: white;
    }
    .login-header h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
    }
    .login-body {
      padding: 2rem;
    }
    .form-group {
      margin-bottom: 1.3rem;
    }
    label {
      font-weight: 600;
      font-size: 0.85rem;
      margin-bottom: 0.4rem;
      display: block;
    }
    input {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid #E9E2D8;
      border-radius: 32px;
      font-family: 'Inter', sans-serif;
      transition: all 0.3s ease;
    }
    input:focus {
      outline: none;
      border-color: #C49A6C;
      box-shadow: 0 0 0 3px rgba(196,154,108,0.1);
    }
    .btn-login {
      width: 100%;
      background: #1E1B18;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 40px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: all 0.3s ease;
    }
    .btn-login:hover {
      background: #C49A6C;
      color: #1E1B18;
      transform: translateY(-2px);
    }
    .alert {
      padding: 10px;
      border-radius: 28px;
      font-size: 0.8rem;
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .alert-error {
      background: #FEF2F0;
      color: #C23D2E;
    }
    .alert-success {
      background: #E6F4EA;
      color: #2E7D32;
    }
    .register-link {
      text-align: center;
      margin-top: 1.2rem;
      font-size: 0.85rem;
    }
    .register-link a {
      color: #C49A6C;
      text-decoration: none;
      font-weight: 600;
    }
    .register-link a:hover {
      text-decoration: underline;
    }
    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid #f3f3f3;
      border-top: 2px solid #C49A6C;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
<div class="login-card" id="loginCard">
  <div class="login-header">
    <h2><i class="fas fa-chart-line"></i> SoulHub</h2>
    <p>Sign in to your management console</p>
  </div>
  <div class="login-body">
    <div id="messageArea"></div>
    <form id="loginForm">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="loginEmail" required autocomplete="email">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-login" id="loginBtn">
        <i class="fas fa-arrow-right-to-bracket"></i> Login
      </button>
    </form>
    <div class="register-link">
      Don't have an account? <a href="registration.html">Register now →</a>
    </div>
  </div>
</div>

<script>
  // Supabase configuration
  const SUPABASE_URL = "https://ulccyfajpaiuvqovvqyz.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_4kKDA0psp8AFpoTJlB-k8A_VS9IaWI9";
  
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const messageArea = document.getElementById('messageArea');
  const loginBtn = document.getElementById('loginBtn');

  function showMessage(text, type) {
    messageArea.innerHTML = `<div class="alert alert-${type}"><i class="fas ${type === 'error' ? 'fa-exclamation-circle' : 'fa-check-circle'}"></i> ${text}</div>`;
    setTimeout(() => { 
      if (messageArea.firstChild) messageArea.firstChild.remove(); 
    }, 5000);
  }

  // Check if user is already logged in
  async function checkExistingSession() {
    const { data: { session } } = await supabase.auth.getSession();
    if (session) {
      // User is already logged in, redirect to dashboard
      window.location.href = "dashboard.html";
    }
  }

  // Handle login form submission
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const email = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPassword').value;
    
    // Show loading state
    loginBtn.disabled = true;
    loginBtn.innerHTML = '<span class="loading"></span> Logging in...';
    
    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
    
    if (error) {
      showMessage(error.message, "error");
      loginBtn.disabled = false;
      loginBtn.innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i> Login';
    } else {
      showMessage("Login successful! Redirecting to dashboard...", "success");
      // Redirect to dashboard after successful login
      setTimeout(() => {
        window.location.href = "dashboard.html";
      }, 1000);
    }
  });

  // Show registration success message if redirected
  if (window.location.search.includes('registered=true')) {
    const emailParam = new URLSearchParams(window.location.search).get('email');
    showMessage(`✅ Account created successfully for ${emailParam || 'you'}! Please log in.`, "success");
  }

  // Check for existing session on page load
  checkExistingSession();
</script>
</body>
</html>
