<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SoulHub Management – Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #FEFCF8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .login-card {
      max-width: 460px;
      width: 100%;
      background: white;
      border-radius: 36px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.08);
      border: 1px solid #F0EAE3;
      overflow: hidden;
    }
    .login-header {
      background: #1E1B18;
      padding: 2rem;
      text-align: center;
      color: white;
    }
    .login-header h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
    }
    .login-body {
      padding: 2rem;
    }
    .form-group {
      margin-bottom: 1.3rem;
    }
    label {
      font-weight: 600;
      font-size: 0.85rem;
      margin-bottom: 0.4rem;
      display: block;
    }
    input {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid #E9E2D8;
      border-radius: 32px;
      font-family: 'Inter', sans-serif;
      transition: all 0.3s ease;
    }
    input:focus {
      outline: none;
      border-color: #C49A6C;
      box-shadow: 0 0 0 3px rgba(196,154,108,0.1);
    }
    .btn-login {
      width: 100%;
      background: #1E1B18;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 40px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: all 0.3s ease;
    }
    .btn-login:hover:not(:disabled) {
      background: #C49A6C;
      color: #1E1B18;
      transform: translateY(-2px);
    }
    .btn-login:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }
    .alert {
      padding: 10px;
      border-radius: 28px;
      font-size: 0.8rem;
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .alert-error {
      background: #FEF2F0;
      color: #C23D2E;
    }
    .alert-success {
      background: #E6F4EA;
      color: #2E7D32;
    }
    .register-link {
      text-align: center;
      margin-top: 1.2rem;
      font-size: 0.85rem;
    }
    .register-link a {
      color: #C49A6C;
      text-decoration: none;
      font-weight: 600;
    }
    .register-link a:hover {
      text-decoration: underline;
    }
    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid #f3f3f3;
      border-top: 2px solid #C49A6C;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
<div class="login-card" id="loginCard">
  <div class="login-header">
    <h2><i class="fas fa-chart-line"></i> SoulHub</h2>
    <p>Sign in to your management console</p>
  </div>
  <div class="login-body">
    <div id="messageArea"></div>
    <form id="loginForm">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="loginEmail" required autocomplete="email">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" required autocomplete="current-password">
      </div>
      <button type="button" class="btn-login" id="loginBtn">
        <i class="fas fa-arrow-right-to-bracket"></i> Login
      </button>
    </form>
    <div class="register-link">
      Don't have an account? <a href="registration.html">Register now →</a>
    </div>
  </div>
</div>

<script>
(function () {
  console.log("Login script starting...");

  // ==================== SUPABASE CONFIGURATION ====================
  const SUPABASE_URL = "https://ulccyfajpaiuvqovvqyz.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_4kKDA0psp8AFpoTJlB-k8A_VS9IaWI9";
  // =================================================================

  function initSupabase() {
    if (
      typeof window.supabase !== "undefined" &&
      window.supabase.createClient
    ) {
      console.log("Supabase library loaded");
      return window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );
    }

    console.error("Supabase library not loaded");
    return null;
  }

  let supabase = initSupabase();

  // DOM Elements
  const messageArea = document.getElementById("messageArea");
  const loginBtn = document.getElementById("loginBtn");
  const emailInput = document.getElementById("loginEmail");
  const passwordInput = document.getElementById("loginPassword");

  function showMessage(text, type) {
    const icon =
      type === "error"
        ? "fa-exclamation-circle"
        : "fa-check-circle";

    messageArea.innerHTML = `
      <div class="alert alert-${type}">
        <i class="fas ${icon}"></i>
        ${text}
      </div>
    `;
  }

  async function checkExistingSession() {
    try {
      if (!supabase) return;

      const {
        data: { session },
        error,
      } = await supabase.auth.getSession();

      if (error) {
        console.error("Session error:", error);
        return;
      }

      if (session) {
        console.log("Existing session found");

        showMessage(
          "Existing session detected. Redirecting...",
          "success"
        );

        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 1000);
      }
    } catch (err) {
      console.error("Session check failed:", err);
    }
  }

  async function handleLogin() {
    console.log("Login clicked");

    if (!supabase) {
      supabase = initSupabase();

      if (!supabase) {
        showMessage(
          "Unable to connect to authentication service.",
          "error"
        );
        return;
      }
    }

    const email = emailInput.value.trim();
    const password = passwordInput.value;

    if (!email) {
      showMessage("Please enter your email address.", "error");
      emailInput.focus();
      return;
    }

    if (!password) {
      showMessage("Please enter your password.", "error");
      passwordInput.focus();
      return;
    }

    loginBtn.disabled = true;
    loginBtn.innerHTML =
      '<i class="fas fa-spinner fa-spin"></i> Logging in...';

    try {
      console.log("Attempting login:", email);

      const { data, error } =
        await supabase.auth.signInWithPassword({
          email,
          password,
        });

      console.log("Login result:", data);
      console.log("Login error:", error);

      if (error) {
        throw error;
      }

      if (!data.user) {
        throw new Error(
          "Login failed. No user returned."
        );
      }

      console.log("User authenticated:", data.user.email);

      // Verify session
      const {
        data: { session },
      } = await supabase.auth.getSession();

      console.log("Session:", session);

      if (!session) {
        throw new Error(
          "Login succeeded but no session was created."
        );
      }

      showMessage(
        "✅ Login successful! Redirecting...",
        "success"
      );

      setTimeout(() => {
        window.location.href = "dashboard.html";
      }, 1500);
    } catch (err) {
      console.error("Login failed:", err);

      let msg = err.message;

      if (
        msg.includes("Invalid login credentials")
      ) {
        msg =
          "Incorrect email or password. Please try again.";
      } else if (
        msg.includes("Email not confirmed")
      ) {
        msg =
          "Please verify your email before logging in.";
      }

      showMessage(msg, "error");

      loginBtn.disabled = false;
      loginBtn.innerHTML =
        '<i class="fas fa-arrow-right-to-bracket"></i> Login';
    }
  }

  // Login Button
  if (loginBtn) {
    loginBtn.addEventListener("click", handleLogin);
  }

  // Enter Key Support
  [emailInput, passwordInput].forEach((input) => {
    if (!input) return;

    input.addEventListener("keypress", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        handleLogin();
      }
    });
  });

  // Registration Success Message
  const params = new URLSearchParams(
    window.location.search
  );

  if (params.get("registered") === "true") {
    const email = params.get("email");

    showMessage(
      `Account created successfully${
        email ? " for " + email : ""
      }. Please log in.`,
      "success"
    );
  }

  window.addEventListener("load", () => {
    console.log("Page loaded");
    checkExistingSession();
  });

  console.log("Login page initialized");
})();
</script>
</body>
</html>
