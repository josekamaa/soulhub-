<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SoulHub Management – Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@300;400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #FEFCF8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .login-card {
      max-width: 460px;
      width: 100%;
      background: white;
      border-radius: 36px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.08);
      border: 1px solid #F0EAE3;
      overflow: hidden;
    }
    .login-header {
      background: #1E1B18;
      padding: 2rem;
      text-align: center;
      color: white;
    }
    .login-header h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
    }
    .login-body {
      padding: 2rem;
    }
    .form-group {
      margin-bottom: 1.3rem;
    }
    label {
      font-weight: 600;
      font-size: 0.85rem;
      margin-bottom: 0.4rem;
      display: block;
    }
    input {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid #E9E2D8;
      border-radius: 32px;
      font-family: 'Inter', sans-serif;
    }
    input:focus {
      outline: none;
      border-color: #C49A6C;
    }
    .btn-login {
      width: 100%;
      background: #1E1B18;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 40px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 0.5rem;
    }
    .btn-login:hover {
      background: #C49A6C;
      color: #1E1B18;
    }
    .error-msg, .success-info {
      background: #FEF2F0;
      padding: 10px;
      border-radius: 28px;
      font-size: 0.8rem;
      margin-bottom: 1.2rem;
      display: none;
    }
    .success-info {
      background: #E6F4EA;
      color: #2E7D32;
    }
    .profile-box {
      background: #F9F4ED;
      border-radius: 24px;
      padding: 1rem;
      margin-bottom: 1.2rem;
      display: none;
    }
    .logout-btn {
      background: transparent;
      border: 1px solid #C49A6C;
      color: #C49A6C;
      padding: 8px 16px;
      border-radius: 40px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      margin-top: 1rem;
    }
    .register-link {
      text-align: center;
      margin-top: 1.2rem;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
<div class="login-card" id="loginCard">
  <div class="login-header">
    <h2><i class="fas fa-chart-line"></i> SoulHub</h2>
    <p>Sign in to your management console</p>
  </div>
  <div class="login-body" id="loginFormContainer">
    <div id="loginError" class="error-msg"></div>
    <div id="loginSuccess" class="success-info"></div>
    
    <form id="loginForm">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="loginEmail" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" required>
      </div>
      <button type="submit" class="btn-login"><i class="fas fa-arrow-right-to-bracket"></i> Login</button>
    </form>
    <div class="register-link">
      Don't have an account? <a href="registration.html" style="color:#C49A6C;">Register now →</a>
    </div>
  </div>

  <div class="login-body" id="dashboardContainer" style="display: none;">
    <div id="profileCard" class="profile-box"></div>
    <button id="logoutBtn" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Sign out</button>
    <div class="register-link" style="margin-top: 1rem;">
      <a href="index.html" style="color:#C49A6C;">← Back to SoulHub landing</a>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://cvjeuiimisqopsieqmex.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_o9aUlBnVhU4C_N-QWyRoOg_6Dufr5JY";
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  
  const loginContainer = document.getElementById('loginFormContainer');
  const dashboardContainer = document.getElementById('dashboardContainer');
  const profileDiv = document.getElementById('profileCard');
  const loginError = document.getElementById('loginError');
  
  async function checkSession() {
    const { data: { session } } = await supabase.auth.getSession();
    if (session) {
      showDashboard(session.user);
    } else {
      loginContainer.style.display = 'block';
      dashboardContainer.style.display = 'none';
    }
  }
  
  async function showDashboard(user) {
    loginContainer.style.display = 'none';
    dashboardContainer.style.display = 'block';
    
    // fetch profile from profiles table
    const { data: profile, error } = await supabase
      .from('profiles')
      .select('full_name, role, store_name, phone')
      .eq('id', user.id)
      .single();
    
    if (error || !profile) {
      profileDiv.innerHTML = `<p><i class="fas fa-exclamation-triangle"></i> Could not load profile details.</p>`;
    } else {
      profileDiv.innerHTML = `
        <div style="display:flex; align-items:center; gap:12px; margin-bottom:12px;">
          <i class="fas fa-user-circle" style="font-size:2.2rem; color:#C49A6C;"></i>
          <div><strong style="font-size:1.2rem;">${escapeHtml(profile.full_name)}</strong><br>${escapeHtml(user.email)}</div>
        </div>
        <div style="display:grid; gap:8px; margin-top:12px;">
          <div><i class="fas fa-tag"></i> <strong>Role:</strong> <span style="background:#E9D9CC; padding:2px 10px; border-radius:40px;">${escapeHtml(profile.role)}</span></div>
          ${profile.store_name ? `<div><i class="fas fa-store"></i> ${escapeHtml(profile.store_name)}</div>` : ''}
          ${profile.phone ? `<div><i class="fas fa-phone"></i> ${escapeHtml(profile.phone)}</div>` : ''}
        </div>
      `;
    }
  }
  
  function escapeHtml(str) { return str.replace(/[&<>]/g, function(m){if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;});}
  
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    loginError.style.display = 'none';
    const email = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPassword').value;
    
    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
    if (error) {
      loginError.innerText = error.message;
      loginError.style.display = 'flex';
    } else {
      showDashboard(data.user);
    }
  });
  
  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await supabase.auth.signOut();
    loginContainer.style.display = 'block';
    dashboardContainer.style.display = 'none';
    document.getElementById('loginForm').reset();
  });
  
  // check for registration success message from URL
  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.get('registered') === 'true') {
    const successDiv = document.getElementById('loginSuccess');
    successDiv.innerText = '✅ Account created successfully! Please log in with your credentials.';
    successDiv.style.display = 'flex';
    setTimeout(() => successDiv.style.display = 'none', 5000);
  }
  
  checkSession();
</script>
</body>
</html>
